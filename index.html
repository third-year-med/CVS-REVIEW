"2.5", "sourceType": "New SBA"}, {"id": "M8", "test": "MOCK", "topic": "aorta", "style": "Mechanism", "stem": ["A 68-year-old man with long-standing hypertension has an acute proximal aortic dissection. How has his hypertension weakened the aortic media?"], "image": null, "imgQuery": null, "options": ["Cystic medial degeneration (fibrillin)", "Vasa vasorum arteriolosclerosis → medial atrophy", "Syphilitic endarteritis of the vasa vasorum", "Calcified atheroma of the aortic intima"], "answer": 1, "explanation": "In older adults, hypertension causes hyaline arteriolosclerosis of the vasa vasorum. Less blood reaches the media, which atrophies. **Why not A:** cystic medial degeneration (Marfan/Ehlers–Danlos) is the young patient's mechanism. **Why not C:** syphilis causes a thoracic aneurysm, not the usual hypertensive dissection.", "trap": "", "source": "L1 §1.5.2; VL p96", "sections": ["1.5"], "code": "CVS-MK-Q008", "concept": "dissection-mech", "objective": "Explain how hypertension weakens the aortic media", "difficulty": "Recall", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.5", "sourceType": "New SBA"}, {"id": "M9", "test": "MOCK", "topic": "rhdvalve", "style": "Mechanism", "stem": ["A 45-year-old man with Marfan syndrome has an early diastolic blowing murmur, a collapsing pulse, visible nail-bed pulsation and head bobbing. What best explains the peripheral signs?"], "image": null, "imgQuery": null, "options": ["A wide pulse pressure", "Fixed left ventricular outflow obstruction", "Pulmonary hypertension", "Raised systemic vascular resistance"], "answer": 0, "explanation": "Aortic regurgitation (here from root dilation in Marfan) widens the pulse pressure: diastolic pressure falls as blood regurgitates, and systolic pressure rises with the larger stroke volume. This gives the hyperdynamic signs (water-hammer pulse, Quincke pulse, head bobbing). **Why not B:** fixed outflow obstruction is aort cytes with blue fibrosis and fat.", "imgQuery": "arrhythmogenic right ventricular cardiomyopathy", "options": ["Hypertrophic cardiomyopathy", "Arrhythmogenic RV cardiomyopathy", "Lymphocytic viral myocarditis", "Old right ventricular infarction"], "answer": 1, "explanation": "ARVC is autosomal dominant fibro-fatty replacement of the RV wall, causing arrhythmias and sudden death in athletes. **Why not A:** HCM affects the LV and septum, with myofibre disarray.", "trap": "", "source": "L2 §2.5.3; CL p122–123", "sections": ["2.5"], "code": "CVS-MK-Q024", "concept": "arvc", "objective": "Recognise ARVC", "difficulty": "Interpretation", "previousExam": true, "integrated": false, "imageBased": true, "correctAnswer": "B", "lecture": "L2", "section": "2.5", "sourceType": "Previous-exam concept"}, {"id": "M25", "test": "MOCK", "topic": "rhdvalve", "style": "Clinical case", "stem": ["A 52-year-old man has exertional syncope, an ejection click and a crescendo–decrescendo systolic murmur. At surgery his aortic valve has **two** heavily calcified cusps with no commissural fusion, and his mitral valve is normal. Why did he develop stenosis earlier than usual?"], "image": null, "imgQuery": null, "options": ["Rheumatic commissural fusion", "Myxoid degeneration of the cusps", "A congenitally bicuspid valve", "Syphilitic aortic-root dilation"], "answer": 2, "explanation": "Calcific AS usually presents after 60; a bicuspid valve wears faster, so it presents earlier. **Why not A:** rheumatic AS has commissural fusion and coexisting mitral stenosis, and both are absent here.", "trap": "", "source": "L2 §2.3.1; CL p74–75; CQ23", "sections": ["2.3"], "code": "CVS-MK-Q025", "concept": "aortic-stenosis", "objective": "Explain early aortic stenosis in a bicuspid valve", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L2", "section": "2.3", "sourceType": "Previous-exam concept"}, {"id": "M26", "test": "MOCK", "topic": "athero", "style": "Mechanism", "stem": ["As a fatty streak progresses to a fibrofatty atheroma, which cell migrates from the media into the intima and lays down the collagen of the fibrous cap?"], "image": null, "imgQuery": null, "options": ["Smooth muscle cell", "Endothelial cell", "Neutrophil leukocyte", "Activated platelet"], "answer": 0, "explanation": "Growth factors from macrophages recruit medial smooth muscle cells into the intima. They proliferate and deposit collagen and extracellular matrix, forming the fibrous cap. **Why not B:** endothelial injury starts the process, but the endothelium does not build the cap.", "trap": "", "source": "L1 §1.1.3; VL p82–85", "sections": ["1.1"], "code": "CVS-MK-Q026", "concept": "athero-path", "objective": "Identify the cell that builds the fibrous cap", "difficulty": "Recall", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.1", "sourceType": "New SBA"}, {"id": "M27", "test": "MOCK", "topic": "ie", "style": "Clinical case", "stem": ["A 34-year-old woman with known mitral valve prolapse has had low-grade fever, tiredness and weight loss for 6 weeks since a dental extraction. She has splinter haemorrhages, and echo shows small, non-destructive mitral vegetations. What is the most likely organism?"], "image": null, "imgQuery": null, "options": ["*Staphylococcus aureus*", "*Streptococcus viridans*", "*Staphylococcus epidermidis*", "*Streptococcus bovis*"], "answer": 1, "explanation": "*S. viridans* is the most common cause overall. It is a low-virulence organism that infects damaged valves (such as MVP), causing subacute IE with small vegetations. **Why not A:** *S. aureus* causes acute, destructive IE on normal valves.", "trap": "", "source": "L2 §2.4.2–2.4.3; CL p99", "sections": ["2.4"], "code": "CVS-MK-Q027", "concept": "ie-organism", "objective": "Match subacute IE on a damaged valve to its organism", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L2", "section": "2.4", "sourceType": "New SBA"}, {"id": "M28", "test": "MOCK", "topic": "myoperi", "style": "Clinical case", "stem": ["A 61-year-old heavy smoker with lung carcinoma has 2 months of increasing breathlessness and distant heart sounds, without fever. Pericardiocentesis yields bloody fluid containing malignant cells. What type of pericardial disease is this?"], "image": null, "imgQuery": null, "options": ["Fibrinous uraemic pericarditis", "Purulent bacterial pericarditis", "Chylous pericardial effusion", "Haemorrhagic malignant pericarditis"], "answer": 3, "explanation": "Metastases (lung, breast, melanoma, lymphoma) most often involve the pericardium, and malignancy is a leading cause of haemorrhagic pericarditis. **Why not B:** purulent pericarditis presents with high fever and rigors.", "trap": "", "source": "L2 §2.6.3, §2.8; CL p137, p159; CQ41", "sections": ["2.6"], "code": "CVS-MK-Q028", "concept": "pericarditis-types", "objective": "Recognise malignant haemorrhagic pericarditis", "difficulty": "Application", "previousExam": true, "integrated": true, "imageBased": false, "correctAnswer": "D", "lecture": "L2", "section": "2.6", "sourceType": "Previous-exam concept"}, {"id": "M29", "test": "MOCK", "topic": "ihd", "style": "Clinical case", "stem": ["A 70-year-old man who has had several MIs has had progressive dyspnoea, orthopnoea and oedema over some years. Echo shows an ejection fraction of 30% with regional wall-motion abnormalities, and angiography shows diffuse severe coronary disease. What is the diagnosis?"], "image": null, "imgQuery": null, "options": ["Idiopathic dilated cardiomyopathy", "Restrictive cardiomyopathy", "Chronic ischaemic heart disease", "Constrictive pericarditis"], "answer": 2, "explanation": "Chronic ischaemic damage, with or without old infarcts, progresses to congestive heart failure. **Segmental** wall-motion abnormalities and diffuse coronary disease point to ischaemia. **Why not A:** idiopathic DCM has normal coronaries and global hypokinesis.", "trap": "", "source": "L1 §1.2.5; CL p38; CQ35", "sections": ["1.2"], "code": "CVS-MK-Q029", "concept": "chronic-ihd", "objective": "Recognise chronic IHD with heart failure", "difficulty": "Application", "previousExam": true, "integrated": true, "imageBased": false, "correctAnswer": "C", "lecture": "L1", "section": "1.2", "sourceType": "Previous-exam concept"}, {"id": "M30", "test": "MOCK", "topic": "mi", "style": "Laboratory interpretation", "stem": ["A 55-year-old man comes to clinic 8 days after an episode of severe, prolonged chest pain that he ignored. Which marker is most likely still raised?"], "image": null, "imgQuery": null, "options": ["Troponin I", "CK-MB", "Myoglobin", "Troponin I and CK-MB equally"], "answer": 0, "explanation": "Troponin I stays raised for 7–10 days, so it is still raised at day 8. **Why not B:** CK-MB is back to normal by 72 h.", "trap": "", "source": "L1 §1.3.4; CL p23", "sections": ["1.3"], "code": "CVS-MK-Q030", "concept": "mi-biomarkers", "objective": "Choose the marker still raised at day 8", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.3", "sourceType": "New SBA"}, {"id": "M31", "test": "MOCK", "topic": "vasculitis", "style": "Management", "stem": ["A 35-year-old man who smokes 40 cigarettes a day has painful fingertip ulcers and gangrene of one toe. His fingers turn white, then blue, then red in the cold. What is the most effective treatment?"], "image": null, "imgQuery": null, "options": ["Corticosteroids with cyclophosphamide", "Aspirin with IVIG", "A statin", "Complete smoking cessation"], "answer": 3, "explanation": "This is Buerger disease (thromboangiitis obliterans), which is strongly tied to smoking; complete smoking cessation is the treatment. **Why not B:** aspirin with IVIG is the treatment of Kawasaki disease.", "trap": "", "source": "L1 §1.6.7; VL p22", "sections": ["1.6"], "code": "CVS-MK-Q031", "concept": "buerger", "objective": "Manage Buerger disease", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L1", "section": "1.6", "sourceType": "New SBA"}, {"id": "M32", "test": "MOCK", "topic": "aorta", "style": "Morphology", "stem": ["After femoral artery catheterisation, a patient develops a pulsatile swelling in the groin. Imaging shows a breach in the arterial wall communicating with a haematoma contained by fibrous tissue. What is the wall of this lesion made of?"], "image": null, "imgQuery": null, "options": ["All three layers of the arterial wall", "A fibrous wall around a haematoma", "Intima and media split by blood", "Media thinned by syphilitic scarring"], "answer": 1, "explanation": "This is a false aneurysm (pseudoaneurysm): a breach in the wall, usually after trauma, with an extravascular haematoma bounded by fibrous tissue. **Why not A:** a true aneurysm keeps all the layers of the wall. **Why not C:** blood splitting the media is a dissection.", "trap": "", "source": "L1 §1.5.4; VL p104", "sections": ["1.5"], "code": "CVS-MK-Q032", "concept": "aneurysm-types", "objective": "Distinguish a false aneurysm from a true aneurysm and a dissection", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.5", "sourceType": "New SBA"}, {"id": "M33", "test": "MOCK", "topic": "htn", "style": "Clinical case", "stem": ["A 64-year-old man with long-standing, poorly controlled hypertension collapses suddenly. CT shows a large haemorrhage in the basal ganglia. What would his heart most likely show at autopsy?"], "image": null, "imgQuery": null, "options": ["Concentric LV hypertrophy", "Dilation of all four chambers", "A fatty, thinned right ventricle", "A normal-sized heart and valves"], "answer": 0, "explanation": "Chronic hypertension causes intracerebral (basal ganglia) haemorrhage and hypertensive heart disease with concentric LVH. **Why not B:** four-chamber dilation is dilated cardiomyopathy.", "trap": "", "source": "L1 §1.4.5–1.4.6; VL p62, p73; CQ13", "sections": ["1.4"], "code": "CVS-MK-Q033", "concept": "hhd-lvh", "objective": "Link hypertensive haemorrhage to concentric LVH", "difficulty": "Application", "previousExam": false, "integrated": true, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.4", "sourceType": "Integrated"}, {"id": "M34", "test": "MOCK", "topic": "chd", "style": "Clinical case / trap", "stem": ["An infant with Down syndrome has an atrial septal defect in the lower part of the septum, next to the atrioventricular valves. What type of defect is this?"], "image": null, "imgQuery": null, "options": ["Ostium secundum", "Patent foramen ovale", "Ostium primum", "Sinus venosus"], "answer": 2, "explanation": "Ostium primum ASD is associated with Down syndrome. **Why not A:** secundum is the commonest ASD overall (90%), but it is not the Down-associated one.", "trap": "", "source": "L2 §2.1.3; CL p45", "sections": ["2.1"], "code": "CVS-MK-Q034", "concept": "asd", "objective": "Link ostium primum ASD to Down syndrome", "difficulty": "Recall", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L2", "section": "2.1", "sourceType": "Previous-exam concept"}, {"id": "M35", "test": "MOCK", "topic": "rhdvalve", "style": "Complication", "stem": ["A tall 22-year-old woman has a mid-systolic click, and echo shows her mitral leaflet ballooning into the left atrium in systole. Which complication is recognised, although uncommon, in this condition?"], "image": null, "imgQuery": null, "options": ["Microangiopathic haemolytic anaemia", "Infective endocarditis", "Concentric left ventricular hypertrophy", "Coronary artery aneurysm"], "answer": 1, "explanation": "MVP is usually asymptomatic. Its rare complications are infective endocarditis, arrhythmia and severe MR. **Why not A:** MAHA belongs to calcific aortic stenosis.", "trap": "", "source": "L2 §2.3.3; CL p87", "sections": ["2.3"], "code": "CVS-MK-Q035", "concept": "mvp", "objective": "State the complications of MVP", "difficulty": "Recall", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L2", "section": "2.3", "sourceType": "New SBA"}, {"id": "M36", "test": "MOCK", "topic": "cm", "style": "Mechanism", "stem": ["A 17-year-old girl faints while running. Echo shows asymmetric septal hypertrophy with a small LV cavity. What is the mechanism of her exertional syncope?"], "image": null, "imgQuery": null, "options": ["Systolic failure of dilated ventricles", "Coronary artery vasospasm", "Complete heart block from amyloid", "Septal bulge obstructing LV outflow"], "answer": 3, "explanation": "In HCM the subaortic septal bulge acts as a functional aortic stenosis on exertion, so output falls and she faints. The failure is diastolic (the thick ventricle cannot fill). **Why not A:** systolic failure of dilated ventricles is DCM.", "trap": "", "source": "L2 §2.5.2; CL p125", "sections": ["2.5"], "code": "CVS-MK-Q036", "concept": "hcm", "objective": "Explain exertional syncope in HCM", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L2", "section": "2.5", "sourceType": "New SBA"}, {"id": "M37", "test": "MOCK", "topic": "ie", "style": "Laboratory interpretation", "stem": ["A 50-year-old man has had subacute infective endocarditis for 2 months. His Hb is 10 g/dL with a low MCV, low serum iron, low TIBC and a raised ferritin. What best explains these results?"], "image": null, "imgQuery": null, "options": ["Iron deficiency from GI blood loss", "Haemolysis on the vegetations", "Anaemia of chronic disease", "Vitamin B12 deficiency"], "answer": 2, "explanation": "Subacute IE causes anaemia of chronic disease: low Hb, MCV, iron and TIBC, with a **raised** ferritin. **Why not A:** in iron deficiency, ferritin is low and TIBC is high.", "trap": "", "source": "L2 §2.4.6; CL p104–105", "sections": ["2.4"], "code": "CVS-MK-Q037", "concept": "ie-signs", "objective": "Interpret anaemia of chronic disease in subacute IE", "difficulty": "Interpretation", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L2", "section": "2.4", "sourceType": "New SBA"}, {"id": "M38", "test": "MOCK", "topic": "hf", "style": "Mechanism", "stem": ["Why does a patient with left heart failure wake breathless at night and need several pillows to sleep?"], "image": null, "imgQuery": null, "options": ["More venous return congests the lungs", "Less renal blood flow when lying flat", "Hepatic congestion worsening at night", "Coronary vasospasm during sleep"], "answer": 0, "explanation": "Paroxysmal nocturnal dyspnoea and orthopnoea come from pulmonary congestion. Lying flat increases venous return, which raises pulmonary venous pressure. **Why not C:** hepatic congestion is a feature of right heart failure.", "trap": "", "source": "L2 §2.7.2; CL p144", "sections": ["2.7"], "code": "CVS-MK-Q038", "concept": "hf-left-right", "objective": "Explain orthopnoea in left heart failure", "difficulty": "Recall", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L2", "section": "2.7", "sourceType": "New SBA"}, {"id": "M39", "test": "MOCK", "topic": "vasculitis", "style": "Comparison", "stem": ["A 40-year-old woman with late-onset asthma and peripheral eosinophilia develops lung infiltrates and heart involvement. Biopsy shows necrotising granulomas rich in eosinophils, and p-ANCA is positive. What is the diagnosis?"], "image": null, "imgQuery": null, "options": ["GPA (Wegener)", "EGPA (Churg–Strauss)", "Microscopic polyangiitis", "Polyarteritis nodosa"], "answer": 1, "explanation": "EGPA (formerly Churg–Strauss): asthma, eosinophilia, eosinophil-rich granulomas, lung and heart involvement, p-ANCA. **Why not C:** MPA has no granulomas. **Why not A:** GPA is c-ANCA with ENT disease.", "trap": "", "source": "L1 §1.6.8; VL p30–31", "sections": ["1.6"], "code": "CVS-MK-Q039", "concept": "anca-vasculitis", "objective": "Recognise EGPA", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.6", "sourceType": "Previous-exam concept"}, {"id": "M40", "test": "MOCK", "topic": "integrated", "style": "Sudden death in the young", "stem": ["A 25-year-old man collapses at a party and dies. Toxicology is positive for cocaine. His coronary arteries are normal and there are no gross cardiac lesions. What is the most likely microscopic finding in his myocardium?"], "image": null, "imgQuery": null, "options": ["Myofibre disarray", "Lymphocytic myocarditis", "Aschoff bodies in the myocardium", "Contraction-band necrosis"], "answer": 3, "explanation": "Cocaine is a listed cause of sudden cardiac death, and contraction-band necrosis is its classic finding (as in CQ28). **Why not A:** disarray means HCM. **Why not B:** lymphocytes mean myocarditis.", "trap": "", "source": "L1 §1.2.4, §1.3.5; L2 §2.9.2; CL p37", "sections": ["1.2", "2.9"], "code": "CVS-MK-Q040", "concept": "scd", "objective": "Link cocaine to contraction-band necrosis", "difficulty": "Application", "previousExam": true, "integrated": true, "imageBased": false, "correctAnswer": "D", "lecture": "L1+L2", "section": "1.2", "sourceType": "Previous-exam concept"}], "checks": [{"id": "SC 1.1-a", "sec": "1.1", "type": "tf", "q": "Mönckeberg medial calcific sclerosis narrows the arterial lumen.", "answer": false, "expl": "The calcification is in the **media**, so the lumen stays open. It is clinically insignificant.", "ref": "L1 §1.1.1"}, {"id": "SC 1.1-b", "sec": "1.1", "type": "fill", "q": "The earliest visible lesion of atherosclerosis is the [ blank ], made of foamy [ blank ] in the intima.", "answers": [["fatty streak", "fatty streaks"], ["macrophages", "macrophage", "foam cells", "macrophages (foam cells)"]], "expl": "Fatty streak; macrophages (foam cells).", "ref": "L1 §1.1.4"}, {"id": "SC 1.2-a", "sec": "1.2", "type": "match", "q": "Match each type of angina to its description.", "left": ["Stable", "Unstable", "Prinzmetal"], "right": ["Coronary vasospasm; ST elevation", "Fixed ≥75% stenosis; ST depression on exertion", "Plaque rupture with a partial thrombus; pain at rest"], "key": [1, 2, 0], "expl": "Stable = fixed stenosis; unstable = plaque rupture + partial thrombus; Prinzmetal = vasospasm (ST elevation).", "ref": "L1 §1.2.3"}, {"id": "SC 1.2-b", "sec": "1.2", "type": "tf", "q": "In sudden cardiac death, an infarct is usually visible at autopsy.", "answer": false, "expl": "Death comes within 1 hour, usually from an arrhythmia, before necrosis can be seen.", "ref": "L1 §1.2.4"}, {"id": "SC 1.3-a", "sec": "1.3", "type": "match", "q": "Match the time after MI to the microscopy.", "left": ["4–24 hours", "1–3 days", "4–7 days", "1–3 weeks", "Months"], "right": ["Granulation tissue", "Macrophages", "Coagulative necrosis", "Fibrous scar", "Neutrophils"], "key": [2, 4, 1, 0, 3], "expl": "Coagulative necrosis → neutrophils → macrophages → granulation tissue → scar.", "ref": "L1 §1.3.6"}, {"id": "SC 1.3-b", "sec": "1.3", "type": "mcq", "q": "Which coronary artery is most often occluded in MI?", "options": ["Right coronary artery", "Left circumflex artery", "Left anterior descending artery", "Left main stem"], "answer": 2, "expl": "The LAD accounts for 45% of MIs; the RCA is second.", "ref": "L1 §1.3.3"}, {"id": "SC 1.3-c", "sec": "1.3", "type": "select", "q": "Which are features of reperfusion of irreversibly injured myocardium? (Select all that apply.)", "options": ["Calcium influx into myocytes", "Contraction-band necrosis", "Free-radical injury", "Caseous necrosis"], "answer": [0, 1, 2], "expl": "Calcium influx causes hypercontraction (contraction bands); returning O₂ and inflammatory cells generate free radicals.", "ref": "L1 §1.3.5"}, {"id": "SC 1.4-a", "sec": "1.4", "type": "match", "q": "Match each arteriolar lesion to its description.", "left": ["Hyaline arteriolosclerosis", "Hyperplastic arteriolosclerosis", "Necrotising arteriolitis"], "right": ["Fibrinoid necrosis with neutrophils; malignant HTN", "Pink homogeneous wall thickening; benign HTN or diabetes", "Onion-skin layering of smooth muscle; malignant HTN"], "key": [1, 2, 0], "expl": "Hyaline = benign HTN/diabetes; onion-skin and fibrinoid necrosis = malignant HTN.", "ref": "L1 §1.4.3"}, {"id": "SC 1.4-b", "sec": "1.4", "type": "fill", "q": "In benign nephrosclerosis the kidneys are small, with a finely granular \"[ blank ]-grain\" surface. In malignant nephrosclerosis they are described as \"[ blank ]-bitten\".", "answers": [["leather"], ["flea"]], "expl": "Leather-grain (benign); flea-bitten (malignant).", "ref": "L1 §1.4.4"}, {"id": "SC 1.5-a", "sec": "1.5", "type": "tf", "q": "In older adults, aortic dissection is most often caused by Marfan syndrome.", "answer": false, "expl": "In older adults the cause is usually **hypertension** (vasa vasorum → medial atrophy). Marfan and Ehlers–Danlos cause dissection in young people.", "ref": "L1 §1.5.2"}, {"id": "SC 1.5-b", "sec": "1.5", "type": "select", "q": "Which are complications of a syphilitic thoracic aortic aneurysm? (Select all that apply.)", "options": ["Aortic-root dilation with aortic regurgitation", "Compression of the airway or oesophagus", "Thrombosis and embolism", "Cystic medial degeneration"], "answer": [0, 1, 2], "expl": "Cystic medial degeneration is a *cause* of dissection (Marfan), not a complication of syphilis.", "ref": "L1 §1.5.5"}, {"id": "SC 1.6-a", "sec": "1.6", "type": "match", "q": "Match each vasculitis to its signature clue.", "left": ["Giant cell arteritis", "Takayasu arteritis", "Polyarteritis nodosa", "Kawasaki disease", "IgA vasculitis (Henoch–Schönlein purpura)"], "right": ["Strawberry tongue, coronary aneurysm", "HBsAg, lungs spared", "Jaw claudication, ESR markedly raised", "IgA, palpable purpura on the buttocks and legs", "Absent arm pulses in a young woman"], "key": [2, 4, 1, 0, 3], "expl": "Vessel size → patient → signature clue (see the vasculitis grid).", "ref": "L1 §1.6.10"}, {"id": "SC 1.6-b", "sec": "1.6", "type": "match", "q": "Match each disease to its features.", "left": ["GPA (Wegener)", "Microscopic polyangiitis", "EGPA (Churg–Strauss)"], "right": ["p-ANCA, no granulomas", "p-ANCA, asthma, eosinophil-rich granulomas", "c-ANCA, necrotising granulomas, nose–lung–kidney"], "key": [2, 0, 1], "expl": "Ask two questions: granulomas? which ANCA?", "ref": "L1 §1.6.8"}, {"id": "SC 1.6-c", "sec": "1.6", "type": "tf", "q": "A negative temporal artery biopsy rules out giant cell arteritis.", "answer": false, "expl": "The lesions are segmental, so a normal segment can be sampled. Take a long segment, and never delay steroids for the biopsy.", "ref": "L1 §1.6.3"}, {"id": "SC 1.7", "sec": "1.7", "type": "match", "q": "Match each tumour to its association.", "left": ["Kaposi sarcoma", "Liver angiosarcoma", "Haemangioma"], "right": ["Polyvinyl chloride, arsenic, Thorotrast", "Present at birth; often regresses", "HHV-8"], "key": [2, 0, 1], "expl": "Kaposi = HHV-8; liver angiosarcoma = PVC/arsenic/Thorotrast; haemangioma = infancy, regresses.", "ref": "L1 §1.7"}, {"id": "SC 2.1-a", "sec": "2.1", "type": "sort", "q": "Sort each lesion into its group.", "groups": ["Left-to-right shunt", "Right-to-left shunt", "Obstructive"], "items": [["VSD", 0], ["Tetralogy of Fallot", 1], ["Coarctation", 2], ["ASD", 0], ["Transposition", 1], ["PDA", 0], ["Truncus arteriosus", 1], ["Tricuspid atresia", 1]], "expl": "L→R: VSD, ASD, PDA. R→L: the four \"T\" lesions. Obstructive: coarctation.", "ref": "L2 §2.1.1"}, {"id": "SC 2.1-b", "sec": "2.1", "type": "fill", "q": "[ blank ] closes the ductus arteriosus. PGE₁ [ blank ] ductal patency.", "answers": [["indomethacin"], ["maintains", "maintain", "keeps"]], "expl": "Indomethacin closes the duct (PDA); PGE₁ maintains patency (e.g. in transposition).", "ref": "L2 §2.1.3–2.1.4"}, {"id": "SC 2.2-a", "sec": "2.2", "type": "select", "q": "Which of these are major Jones criteria? (Select all that apply.)", "options": ["Migratory polyarthritis", "Fever", "Pancarditis", "Subcutaneous nodules", "Raised ESR", "Erythema marginatum", "Sydenham chorea"], "answer": [0, 2, 3, 5, 6], "expl": "Fever and a raised ESR are minor criteria.", "ref": "L2 §2.2.2"}, {"id": "SC 2.2-b", "sec": "2.2", "type": "tf", "q": "Anitschkow cells are reactive histiocytes with slender, wavy nuclei found in Aschoff bodies.", "answer": true, "expl": "They are the hallmark of acute rheumatic myocarditis.", "ref": "L2 §2.2.3"}, {"id": "SC 2.3-a", "sec": "2.3", "type": "match", "q": "Match each sound to its lesion.", "left": ["Opening snap + diastolic rumble", "Ejection click + crescendo–decrescendo systolic", "Mid-systolic click", "Holosystolic blowing murmur", "Early diastolic blowing murmur"], "right": ["Aortic regurgitation", "Mitral regurgitation", "Mitral stenosis", "Aortic stenosis", "Mitral valve prolapse"], "key": [2, 3, 4, 1, 0], "expl": "See the murmur decoder table.", "ref": "L2 §2.3.6"}, {"id": "SC 2.3-b", "sec": "2.3", "type": "mcq", "q": "Which lesion produces eccentric LV hypertrophy with dilation?", "options": ["Aortic stenosis", "Aortic regurgitation", "Systemic hypertension", "Hypertrophic cardiomyopathy"], "answer": 1, "expl": "Volume overload gives eccentric hypertrophy; pressure overload (aortic stenosis, hypertension) gives concentric LVH.", "ref": "L2 §2.3.2"}, {"id": "SC 2.4-a", "sec": "2.4", "type": "match", "q": "Match each organism to its setting.", "left": ["Streptococcus viridans", "Staphylococcus aureus", "Staphylococcus epidermidis", "Streptococcus bovis", "HACEK"], "right": ["Colorectal carcinoma", "Culture-negative endocarditis", "Previously damaged valve; most common overall", "Prosthetic valve", "IV drug user; tricuspid valve"], "key": [2, 4, 3, 0, 1], "expl": "Match the organism to the patient story.", "ref": "L2 §2.4.3"}, {"id": "SC 2.4-b", "sec": "2.4", "type": "tf", "q": "Libman–Sacks vegetations may occur on both surfaces of the valve leaflet.", "answer": true, "expl": "This distinguishes them from rheumatic and NBTE vegetations, which sit on the line of closure.", "ref": "L2 §2.4.1"}, {"id": "SC 2.5-a", "sec": "2.5", "type": "match", "q": "Match each cardiomyopathy to its key feature.", "left": ["Dilated", "Hypertrophic", "Arrhythmogenic RV", "Restrictive"], "right": ["Myofibre disarray; sudden death in young athletes", "Low-voltage ECG; amyloid", "All four chambers dilated; systolic failure", "Right ventricle replaced by fat"], "key": [2, 0, 3, 1], "expl": "See the comparison table of the four cardiomyopathies.", "ref": "L2 §2.5.5"}, {"id": "SC 2.5-b", "sec": "2.5", "type": "fill", "q": "The most common genetic cause of dilated cardiomyopathy is a mutation in [ blank ].", "answers": [["titin", "ttn"]], "expl": "Titin (about 20% of DCM).", "ref": "L2 §2.5.1"}, {"id": "SC 2.6-a", "sec": "2.6", "type": "match", "q": "Match each type of pericarditis to its typical cause.", "left": ["Fibrinous", "Haemorrhagic", "Chylous", "Purulent"], "right": ["Lymphatic (thoracic duct) obstruction", "Uraemia, MI, Dressler syndrome", "Staphylococci, streptococci, pneumococci", "Malignancy, TB"], "key": [1, 3, 0, 2], "expl": "Fibrinous = uraemia/MI; haemorrhagic = malignancy/TB; chylous = lymphatics; purulent = bacteria.", "ref": "L2 §2.6.3"}, {"id": "SC 2.6-b", "sec": "2.6", "type": "tf", "q": "Viral myocarditis can progress to dilated cardiomyopathy.", "answer": true, "expl": "DCM is a late complication of Coxsackie myocarditis.", "ref": "L2 §2.6.1"}, {"id": "SC 2.7", "sec": "2.7", "type": "sort", "q": "Sort each feature into left or right heart failure.", "groups": ["Left heart failure", "Right heart failure"], "items": [["Pulmonary oedema", 0], ["Jugular venous distension", 1], ["Paroxysmal nocturnal dyspnoea", 0], ["Nutmeg liver", 1], ["Heart-failure cells", 0], ["Dependent pitting oedema", 1]], "expl": "Left = lungs; right = systemic veins.", "ref": "L2 §2.7.2"}, {"id": "SC 2.8", "sec": "2.8", "type": "mcq", "q": "What are the most common tumours of the heart overall?", "options": ["Myxomas", "Rhabdomyomas", "Metastases", "Angiosarcomas"], "answer": 2, "expl": "Metastases are more common than primary tumours. Myxoma is the commonest **primary** tumour in adults.", "ref": "L2 §2.8"}, {"id": "SC 2.9", "sec": "2.9", "type": "select", "q": "Which can cause a systemic embolic stroke? (Select all that apply.)", "options": ["Left atrial thrombus in mitral stenosis with AF", "LV mural thrombus after an old anterior MI", "Left atrial myxoma", "A venous clot crossing an ASD", "A tricuspid valve vegetation in a patient with an intact atrial septum"], "answer": [0, 1, 2, 3], "expl": "Right-sided vegetations embolise to the lungs unless there is a shunt.", "ref": "L2 §2.9.1"}], "practice": [{"id": "P-101", "sub": "1.1.1", "section": "1.1", "lecture": 1, "concept": "monckeberg", "stem": "A 70-year-old has a muscular artery with rings of calcium in the **media** and a widely open lumen. What is the lesion?", "image": "H&E of a medium-sized muscular artery: purple rings of calcium in the media, a thin normal intima and a widely open lumen.", "options": ["Hyaline arteriolosclerosis", "Mönckeberg medial calcific sclerosis", "Complicated atherosclerotic plaque", "Hyperplastic arteriolosclerosis"], "answer": 1, "explanation": "Mönckeberg sclerosis calcifies the **media** of muscular arteries and does not narrow the lumen. **Why not C:** atherosclerosis is an **intimal** plaque that narrows the lumen.", "previousExam": true, "difficulty": "Interpretation", "ref": "L1 §1.1.1; CQ51"}, {"id": "P-102", "sub": "1.1.2", "section": "1.1", "lecture": 1, "concept": "athero-sites", "stem": "Which is the most common site of atherosclerosis in the course list?", "image": null, "options": ["Abdominal aorta", "Coronary arteries", "Popliteal artery", "Internal carotid artery"], "answer": 0, "explanation": "The order is **abdominal aorta > coronary arteries > popliteal artery > internal carotid**. **Why not B:** the coronaries are second.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.1.2"}, {"id": "P-103", "sub": "1.1.3", "section": "1.1", "lecture": 1, "concept": "athero-path", "stem": "In the response-to-injury sequence of atherosclerosis, which event comes first?", "image": null, "options": ["Smooth muscle migration into the intima", "Collagen deposition in the fibrous cap", "Uptake of oxidised LDL by macrophages", "Endothelial injury and dysfunction"], "answer": 3, "explanation": "Chronic **endothelial injury** starts the sequence: it lets LDL and monocytes into the intima. Foam cells, SMC migration and the collagen cap follow. **Why not D:** LDL must first enter through injured endothelium.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.1.3"}, {"id": "P-104", "sub": "1.1.4", "section": "1.1", "lecture": 1, "concept": "athero-path", "stem": "What is the earliest visible lesion of atherosclerosis?", "image": null, "options": ["A fibrous cap over a necrotic core", "An ulcerated, calcified plaque", "A fatty streak of foamy macrophages", "A mural thrombus on a plaque"], "answer": 2, "explanation": "The **fatty streak** (foam cells in the intima) is the earliest visible lesion and is not obstructive. **Why not B:** a raised fibrofatty plaque comes later.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.1.4; VR Q26"}, {"id": "P-105", "sub": "1.1.5", "section": "1.1", "lecture": 1, "concept": "athero-complications", "stem": "Emboli from an ulcerated aortic plaque block small renal arteries. Which feature identifies them as atheroemboli?", "image": null, "options": ["Colonies of bacteria", "Cholesterol crystal clefts", "Clumps of tumour cells", "Droplets of marrow fat"], "answer": 1, "explanation": "Atheroemboli contain **cholesterol crystals**, seen as empty clefts in tissue. **Why not B:** bacterial colonies suggest septic emboli from endocarditis.", "previousExam": false, "difficulty": "Application", "ref": "L1 §1.1.5"}, {"id": "P-121", "sub": "1.2.1", "section": "1.2", "lecture": 1, "concept": "ihd-basics", "stem": "What is the most common cause of ischaemic heart disease?", "image": null, "options": ["Coronary atherosclerosis", "Coronary artery vasospasm", "Coronary artery vasculitis", "Coronary artery embolism"], "answer": 0, "explanation": "IHD is usually caused by reduced coronary flow from **atherosclerosis**. Vasospasm and vasculitis are less common causes.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.2.1"}, {"id": "P-122", "sub": "1.2.2", "section": "1.2", "lecture": 1, "concept": "acs-plaque", "stem": "What directly results from disruption of a vulnerable coronary plaque?", "image": null, "options": ["Gradual fixed narrowing of the lumen", "Dystrophic calcification of the cap", "Regression of the lipid core", "Plaque haemorrhage and thrombosis"], "answer": 3, "explanation": "Rupture exposes the thrombogenic subendothelium, so the plaque bleeds and a **thrombus** forms. This drives the acute coronary syndromes. **Why not B:** fixed narrowing causes stable angina.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.2.2; QZ3"}, {"id": "P-123", "sub": "1.2.3", "section": "1.2", "lecture": 1, "concept": "angina-types", "stem": "A 58-year-old man has chest pain on climbing stairs that settles with rest. The exercise ECG shows ST depression and troponin is normal. What is happening in his myocardium during the pain?", "image": null, "options": ["Transmural myocardial infarction", "Subendocardial myocardial infarction", "Reversible subendocardial ischaemia", "Transient coronary vasospasm"], "answer": 2, "explanation": "This is stable angina: a fixed ≥75% stenosis causes **reversible subendocardial ischaemia** (ST depression) without necrosis. **Why not C:** a subendocardial infarct would raise troponin.", "previousExam": true, "difficulty": "Application", "ref": "L1 §1.2.3; QZ1"}, {"id": "P-124", "sub": "1.2.3", "section": "1.2", "lecture": 1, "concept": "angina-types", "stem": "Which type of angina carries a high risk of progressing to myocardial infarction?", "image": null, "options": ["Stable (typical) angina", "Unstable (crescendo) angina", "Prinzmetal (variant) angina", "Angina relieved by rest"], "answer": 1, "explanation": "Unstable angina is plaque rupture with a **partial** thrombus, so it can progress to occlusion and MI. **Why not C:** Prinzmetal angina is vasospasm without plaque rupture.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.2.3"}, {"id": "P-125", "sub": "1.2.4", "section": "1.2", "lecture": 1, "concept": "scd", "stem": "In the course definition, sudden cardiac death occurs within what time of the onset of symptoms?", "image": null, "options": ["1 hour", "6 hours", "24 hours", "72 hours"], "answer": 0, "explanation": "SCD is unexpected cardiac death with no symptoms or within **1 hour** of symptoms, usually from a ventricular arrhythmia.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.2.4"}, {"id": "P-126", "sub": "1.2.5", "section": "1.2", "lecture": 1, "concept": "chronic-ihd", "stem": "An older man with several old infarcts has a low ejection fraction and segmental wall-motion abnormalities. What is the diagnosis?", "image": null, "options": ["Restrictive cardiomyopathy", "Hypertrophic cardiomyopathy", "Arrhythmogenic cardiomyopathy", "Chronic ischaemic heart disease"], "answer": 3, "explanation": "Chronic ischaemic damage progresses to **congestive heart failure**. **Segmental** wall-motion abnormalities point to ischaemia. **Why not B:** restrictive disease causes diastolic failure with near-normal chambers.", "previousExam": true, "difficulty": "Application", "ref": "L1 §1.2.5; CQ35"}, {"id": "P-131", "sub": "1.3.1", "section": "1.3", "lecture": 1, "concept": "mi-basics", "stem": "What is the usual cause of a myocardial infarction?", "image": null, "options": ["A fixed stenosis without any thrombus", "Vasculitis of intramyocardial arteries", "Plaque rupture with an occlusive thrombus", "An embolus from the right heart"], "answer": 2, "explanation": "MI is usually caused by **rupture of an atherosclerotic plaque with thrombosis and complete occlusion**. **Why not B:** a fixed stenosis causes stable angina.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.3.1"}, {"id": "P-132", "sub": "1.3.2", "section": "1.3", "lecture": 1, "concept": "mi-extent", "stem": "Troponin is raised and the ECG shows ST depression without ST elevation. Which pattern of injury is most likely?", "image": null, "options": ["Transmural infarction", "Subendocardial infarction", "Prinzmetal variant angina", "Stable exertional angina"], "answer": 1, "explanation": "ST depression appears in stable angina, unstable angina **and** subendocardial MI; the raised **troponin** shows necrosis. **Why not B:** transmural infarction gives ST elevation.", "previousExam": false, "difficulty": "Application", "ref": "L1 §1.3.2"}, {"id": "P-133", "sub": "1.3.3", "section": "1.3", "lecture": 1, "concept": "mi-territory", "stem": "Total occlusion of the LAD infarcts which region?", "image": null, "options": ["Anterior wall and anterior septum", "Posterior wall and papillary muscles", "Lateral wall of the left ventricle", "Right ventricular free wall"], "answer": 0, "explanation": "The LAD supplies the **anterior wall and anterior septum** (the most common MI, 45%). **Why not B:** that is the RCA territory.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.3.3; QZ4"}, {"id": "P-134", "sub": "1.3.4", "section": "1.3", "lecture": 1, "concept": "mi-biomarkers", "stem": "Which marker does the course teach as the most sensitive and specific for myocardial injury?", "image": null, "options": ["CK-MB", "Myoglobin", "Lactate dehydrogenase", "Troponin I"], "answer": 3, "explanation": "The course teaches **troponin I** as the most sensitive and specific marker. It stays raised for 7–10 days. **Why not B:** CK-MB is used to detect **reinfarction** because it normalises by 72 h.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.3.4; QZ10"}, {"id": "P-135", "sub": "1.3.5", "section": "1.3", "lecture": 1, "concept": "reperfusion", "stem": "A patient dies 2 days after fibrinolysis for MI. Myocytes show dense transverse eosinophilic bands. What caused the bands?", "image": null, "options": ["Digestion by neutrophil enzymes", "Age-related lipofuscin deposition", "Calcium influx after reperfusion", "Viral injury of the myocytes"], "answer": 2, "explanation": "Restoring flow to irreversibly injured myocytes lets **calcium** flood in, causing hypercontraction: **contraction-band necrosis**. **Why not B:** neutrophils infiltrate at 1–3 days but do not form bands.", "previousExam": true, "difficulty": "Application", "ref": "L1 §1.3.5; QZ8"}, {"id": "P-136", "sub": "1.3.6", "section": "1.3", "lecture": 1, "concept": "mi-timeline", "stem": "An infarct shows granulation tissue with new vessels and plump fibroblasts. How old is it?", "image": "H&E of myocardium: loose tissue with many thin-walled new capillaries, plump fibroblasts and scattered inflammatory cells replacing the dead muscle.", "options": ["4–24 hours", "1–3 weeks", "1–3 days", "4–7 days"], "answer": 1, "explanation": "**Granulation tissue** grows in at **1–3 weeks** (grossly, a red border). **Why not D:** 4–7 days is the macrophage stage.", "previousExam": true, "difficulty": "Interpretation", "ref": "L1 §1.3.6; QZ9"}, {"id": "P-137", "sub": "1.3.6", "section": "1.3", "lecture": 1, "concept": "mi-timeline", "stem": "Which complication is characteristic of the first 24 hours after an MI?", "image": null, "options": ["Arrhythmia", "Free-wall rupture", "Ventricular aneurysm", "Dressler syndrome"], "answer": 0, "explanation": "Within the first 24 h the characteristic complication is **arrhythmia**. **Why not B:** rupture peaks at 4–7 days. Aneurysm and Dressler syndrome come months later.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.3.6; CQ29"}, {"id": "P-138", "sub": "1.3.7", "section": "1.3", "lecture": 1, "concept": "mi-rupture", "stem": "What does rupture of the interventricular septum after an MI cause?", "image": null, "options": ["Haemopericardium with tamponade", "Acute mitral regurgitation", "Fibrinous pericarditis", "A left-to-right shunt"], "answer": 3, "explanation": "Septal rupture creates a **left-to-right shunt**, overloading the right ventricle. **Why not B:** tamponade comes from free-wall rupture. **Why not C:** acute MR comes from papillary muscle rupture.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.3.7"}, {"id": "P-141", "sub": "1.4.1", "section": "1.4", "lecture": 1, "concept": "htn-basics", "stem": "What is the most common type of systemic hypertension?", "image": null, "options": ["Hypertension from renal artery stenosis", "Hypertension from phaeochromocytoma", "Essential (primary) hypertension", "Hypertension from coarctation"], "answer": 2, "explanation": "**Essential hypertension** is about 95% of cases and has no identifiable cause. Secondary causes make up the rest.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.4.1; VR Q12"}, {"id": "P-142", "sub": "1.4.2", "section": "1.4", "lecture": 1, "concept": "htn-malignant", "stem": "Which finding best separates malignant from benign hypertension?", "image": null, "options": ["Concentric left ventricular hypertrophy", "Papilloedema with retinal haemorrhages", "Hyaline arteriolosclerosis in the kidney", "A slow rise in pressure over years"], "answer": 1, "explanation": "Malignant hypertension is a rapid, marked rise that causes **papilloedema, retinal haemorrhages**, encephalopathy and renal failure. **Why not C:** hyaline arteriolosclerosis is the lesion of **benign** HTN.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.4.2; VR Q13"}, {"id": "P-143", "sub": "1.4.3", "section": "1.4", "lecture": 1, "concept": "hyaline", "stem": "Onion-skin concentric layering of arteriolar smooth muscle is typical of which condition?", "image": "H&E of a renal arteriole: concentric layers of smooth muscle cells and basement membrane around a pinpoint lumen.", "options": ["Malignant hypertension", "Benign essential hypertension", "Long-standing diabetes mellitus", "Normal ageing of arterioles"], "answer": 0, "explanation": "Hyperplastic (**onion-skin**) arteriolosclerosis is the lesion of **malignant** hypertension. **Why not B–D:** benign HTN, diabetes and ageing give **hyaline** arteriolosclerosis.", "previousExam": true, "difficulty": "Interpretation", "ref": "L1 §1.4.3; CQ13"}, {"id": "P-144", "sub": "1.4.4", "section": "1.4", "lecture": 1, "concept": "nephrosclerosis", "stem": "How does the kidney look in long-standing benign hypertension?", "image": null, "options": ["Enlarged, with pinpoint haemorrhages", "Enlarged and replaced by cysts", "Normal size with wedge infarcts", "Small, with a finely granular surface"], "answer": 3, "explanation": "Benign nephrosclerosis gives **small kidneys with a finely granular \"leather-grain\" surface**. **Why not B:** flea-bitten kidneys are malignant nephrosclerosis.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.4.4"}, {"id": "P-145", "sub": "1.4.5", "section": "1.4", "lecture": 1, "concept": "hhd-lvh", "stem": "How does chronic systemic hypertension change the left ventricle?", "image": null, "options": ["A thin wall around a dilated cavity", "Fat replacing the ventricular wall", "A thick wall around a small cavity", "A normal wall with a large atrium"], "answer": 2, "explanation": "Pressure overload gives **concentric LVH**: a thick wall and a small cavity. **Why not B:** a thin wall with dilation is dilated cardiomyopathy or volume overload.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.4.5; CQ42, CQ47"}, {"id": "P-146", "sub": "1.4.6", "section": "1.4", "lecture": 1, "concept": "htn-brain", "stem": "What is the typical site of hypertensive intracerebral haemorrhage?", "image": null, "options": ["Cerebellar cortex", "Basal ganglia", "Occipital lobe", "Subdural space"], "answer": 1, "explanation": "HTN classically causes **intracerebral haemorrhage in the basal ganglia**, plus lacunar infarcts.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.4.6"}, {"id": "P-151", "sub": "1.5.1", "section": "1.5", "lecture": 1, "concept": "dissection-mech", "stem": "Aortic dissection needs two things. What are they?", "image": null, "options": ["High wall stress and a weak media", "Infection and vasculitis of the wall", "Low blood pressure and an atheroma", "Thrombus and a calcified intima"], "answer": 0, "explanation": "Dissection needs **(1) high wall stress** (the proximal 10 cm) **plus (2) a weak media**. **Why not B:** infection and vasculitis are not the two requirements.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.5.1; VR Q18"}, {"id": "P-152", "sub": "1.5.2", "section": "1.5", "lecture": 1, "concept": "dissection-mech", "stem": "A 30-year-old man dies of tearing chest pain. An elastic stain of his aortic media is shown. What is the lesion?", "image": "Elastic stain of the aortic media: the regular black elastic layers are broken up, with pale pools of ground substance between the fragments.", "options": ["Hyaline arteriolosclerosis", "Syphilitic endarteritis", "Granulomatous aortitis", "Cystic medial degeneration"], "answer": 3, "explanation": "Fragmented elastic fibres with proteoglycan-filled spaces are **cystic medial degeneration**, the medial weakness of Marfan or Ehlers–Danlos syndrome. **Why not B:** the hypertensive mechanism in older people is hyaline change of the vasa vasorum.", "previousExam": true, "difficulty": "Interpretation", "ref": "L1 §1.5.2; VR Q38"}, {"id": "P-153", "sub": "1.5.3", "section": "1.5", "lecture": 1, "concept": "dissection-death", "stem": "A hypertensive man has tearing chest pain to the back. Which chest X-ray finding supports aortic dissection?", "image": null, "options": ["A boot-shaped heart", "Notching of the ribs", "A widened mediastinum", "Bilateral hilar nodes"], "answer": 2, "explanation": "The classic stem gives a **widened mediastinum**, unremarkable heart sounds and only a slightly raised CK. **Why not C:** rib notching is coarctation.", "previousExam": true, "difficulty": "Application", "ref": "L1 §1.5.3; CQ1"}, {"id": "P-154", "sub": "1.5.4", "section": "1.5", "lecture": 1, "concept": "aneurysm-types", "stem": "What defines a true aneurysm?", "image": null, "options": ["A breach contained by fibrous tissue", "Dilation bounded by all wall layers", "Blood tracking within the media", "A haematoma outside the vessel"], "answer": 1, "explanation": "A **true** aneurysm keeps all layers of the wall. **Why not B:** a breach with an extravascular haematoma is a **false** aneurysm. **Why not C:** blood within the media is a dissection.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.5.4"}, {"id": "P-155", "sub": "1.5.5", "section": "1.5", "lecture": 1, "concept": "syphilis-aneurysm", "stem": "Which appearance of the aortic intima suggests syphilitic aortitis?", "image": null, "options": ["Tree-bark wrinkling", "Flat fatty streaks", "Flea-bitten petechiae", "Onion-skin layering"], "answer": 0, "explanation": "Endarteritis of the vasa vasorum scars the media, and the intima wrinkles into a **tree-bark** pattern. **Why not D:** onion-skin layering is an arteriolar lesion of malignant HTN.", "previousExam": false, "difficulty": "Interpretation", "ref": "L1 §1.5.5"}, {"id": "P-156", "sub": "1.5.6", "section": "1.5", "lecture": 1, "concept": "aaa", "stem": "A 68-year-old male smoker has a pulsatile abdominal mass below the renal arteries. What is the usual cause?", "image": null, "options": ["Tertiary syphilis", "Marfan syndrome", "Takayasu arteritis", "Atherosclerosis"], "answer": 3, "explanation": "AAA is most strongly associated with **atherosclerosis**. **Why not B:** syphilis causes **thoracic** aneurysms.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.5.6; VR Q48"}, {"id": "P-157", "sub": "1.5.7", "section": "1.5", "lecture": 1, "concept": "aaa", "stem": "What is the usual cause of death from an abdominal aortic aneurysm?", "image": null, "options": ["Cardiac tamponade", "Aortic regurgitation", "Rupture", "Carotid occlusion"], "answer": 2, "explanation": "AAA kills by **rupture**; the risk rises with diameter (course cut-off >5 cm). **Why not B:** tamponade is the classic cause of death in **proximal dissection**.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.5.7"}, {"id": "P-161", "sub": "1.6.1", "section": "1.6", "lecture": 1, "concept": "vasc-basics", "stem": "Early in vasculitis, inflammation and necrosis weaken the vessel wall. What can this cause?", "image": null, "options": ["Fibrous stenosis", "Aneurysm", "Atheroma", "Calcification"], "answer": 1, "explanation": "Early necrosis weakens the wall → **aneurysm**. Late healing fibrosis narrows the lumen → ischaemia.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.6.1"}, {"id": "P-162", "sub": "1.6.2", "section": "1.6", "lecture": 1, "concept": "vasc-size", "stem": "Which of these is a small-vessel vasculitis?", "image": null, "options": ["Microscopic polyangiitis", "Giant cell arteritis", "Takayasu arteritis", "Polyarteritis nodosa"], "answer": 0, "explanation": "**Microscopic polyangiitis** is small-vessel. GCA and Takayasu are large-vessel; PAN is medium-vessel.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.2; VL p38"}, {"id": "P-163", "sub": "1.6.3", "section": "1.6", "lecture": 1, "concept": "large-vessel", "stem": "What is the most feared complication of untreated giant cell arteritis?", "image": null, "options": ["Aortic dissection", "Renal failure", "Pulmonary haemorrhage", "Blindness"], "answer": 3, "explanation": "Involvement of the **ophthalmic artery** can cause **blindness**, so steroids start immediately.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.3; VR Q2"}, {"id": "P-164", "sub": "1.6.4", "section": "1.6", "lecture": 1, "concept": "large-vessel", "stem": "Which patient best fits Takayasu arteritis?", "image": null, "options": ["A 75-year-old woman with jaw claudication", "A 3-year-old with a strawberry tongue", "A young Asian woman with absent arm pulses", "A heavy smoker with gangrene of the toes"], "answer": 2, "explanation": "Takayasu (\"pulseless disease\") affects **young (<50) Asian women** at the aortic arch branch points. **Why not B:** that is giant cell arteritis.", "previousExam": false, "difficulty": "Application", "ref": "L1 §1.6.4"}, {"id": "P-165", "sub": "1.6.5", "section": "1.6", "lecture": 1, "concept": "pan", "stem": "Which circulation does polyarteritis nodosa usually spare?", "image": null, "options": ["Renal", "Pulmonary", "Mesenteric", "Cutaneous"], "answer": 1, "explanation": "PAN is a necrotising medium-vessel vasculitis that **spares the lung**. MPA, GPA and EGPA all involve the lung.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.5; VR Q42"}, {"id": "P-166", "sub": "1.6.6", "section": "1.6", "lecture": 1, "concept": "kawasaki", "stem": "What is the treatment of Kawasaki disease?", "image": null, "options": ["Aspirin with IVIG", "Corticosteroids alone", "Cyclophosphamide", "Smoking cessation"], "answer": 0, "explanation": "Kawasaki disease is treated with **aspirin + IVIG**. It is the exception to avoiding aspirin in children (Reye syndrome).", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.6; VL p21"}, {"id": "P-167", "sub": "1.6.7", "section": "1.6", "lecture": 1, "concept": "buerger", "stem": "Which is most strongly associated with Buerger disease (thromboangiitis obliterans)?", "image": null, "options": ["Hepatitis B infection", "Asthma with eosinophilia", "A recent throat infection", "Heavy cigarette smoking"], "answer": 3, "explanation": "Buerger disease occurs in **heavy smokers**; stopping smoking is the treatment. **Why not B:** HBsAg is linked to PAN.", "previousExam": false, "difficulty": "Recall", "ref": "L1 §1.6.7"}, {"id": "P-168", "sub": "1.6.8", "section": "1.6", "lecture": 1, "concept": "anca-vasculitis", "stem": "Which of these vasculitides has **no** granulomas?", "image": null, "options": ["Granulomatosis with polyangiitis", "Eosinophilic granulomatosis (EGPA)", "Microscopic polyangiitis", "Giant cell (temporal) arteritis"], "answer": 2, "explanation": "**Microscopic polyangiitis** is leukocytoclastic, with no granulomas. GPA has necrotising granulomas, EGPA has eosinophil-rich granulomas, and GCA is granulomatous.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.8; VL p40"}, {"id": "P-169", "sub": "1.6.9", "section": "1.6", "lecture": 1, "concept": "hsp", "stem": "What is deposited in the vessel walls in IgA vasculitis (Henoch–Schönlein purpura)?", "image": null, "options": ["Linear IgG on the membrane", "IgA immune complexes", "Amyloid fibrils", "No immune deposits"], "answer": 1, "explanation": "IgA vasculitis is caused by **IgA immune-complex** deposition, usually after an upper respiratory infection. **Why not D:** \"pauci-immune\" small-vessel disease is the ANCA group.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.9; VL p39"}, {"id": "P-170", "sub": "1.6.10", "section": "1.6", "lecture": 1, "concept": "large-vessel", "stem": "Which laboratory finding best fits giant cell arteritis?", "image": null, "options": ["A markedly raised ESR", "A positive c-ANCA", "A positive HBsAg", "A positive anti-dsDNA"], "answer": 0, "explanation": "GCA gives a **markedly raised ESR (often >100)**. **Why not B:** c-ANCA fits GPA. **Why not C:** HBsAg fits PAN.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.6.10; CQ33"}, {"id": "P-171", "sub": "1.7", "section": "1.7", "lecture": 1, "concept": "vasc-tumours", "stem": "An infant has an eyelid lesion made of large, dilated vascular channels. What is it?", "image": null, "options": ["Kaposi sarcoma", "Cutaneous angiosarcoma", "Pyogenic granuloma", "Cavernous haemangioma"], "answer": 3, "explanation": "Large dilated vascular channels in an infant = **cavernous haemangioma**, a benign lesion often present at birth. **Why not B:** Kaposi sarcoma is an HHV-8-associated neoplasm of adults.", "previousExam": true, "difficulty": "Application", "ref": "L1 §1.7; VR Q31"}, {"id": "P-172", "sub": "1.7", "section": "1.7", "lecture": 1, "concept": "vasc-tumours", "stem": "Which exposure is linked to angiosarcoma of the liver?", "image": null, "options": ["Aflatoxin in food", "Asbestos fibres", "Polyvinyl chloride", "Hepatitis B virus"], "answer": 2, "explanation": "Liver angiosarcoma is linked to **polyvinyl chloride, arsenic and Thorotrast**. **Why not B:** aflatoxin causes hepatocellular carcinoma.", "previousExam": true, "difficulty": "Recall", "ref": "L1 §1.7; VR Q30"}, {"id": "P-201", "sub": "2.1.1", "section": "2.1", "lecture": 2, "concept": "chd-groups", "stem": "Which congenital lesion causes cyanosis at or soon after birth?", "image": null, "options": ["Ventricular septal defect", "Tetralogy of Fallot", "Atrial septal defect", "Patent ductus arteriosus"], "answer": 1, "explanation": "Right-to-left shunts (the \"T\" lesions, such as **tetralogy of Fallot**) cause **early cyanosis**. VSD, ASD and PDA are left-to-right shunts: acyanotic, or late cyanosis with Eisenmenger.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.1.1"}, {"id": "P-202", "sub": "2.1.2", "section": "2.1", "lecture": 2, "concept": "eisenmenger", "stem": "In a long-standing VSD, what causes the shunt to reverse?", "image": null, "options": ["Rising pulmonary vascular resistance", "Spontaneous closure of the defect", "Falling systemic vascular resistance", "Development of polycythaemia vera"], "answer": 0, "explanation": "Volume overload of the lungs causes **pulmonary hypertension**; right pressure rises above left, and the shunt reverses (Eisenmenger). **Why not D:** the polycythaemia is **secondary** to hypoxaemia.", "previousExam": true, "difficulty": "Application", "ref": "L2 §2.1.2; QZ12"}, {"id": "P-203", "sub": "2.1.3", "section": "2.1", "lecture": 2, "concept": "asd", "stem": "Which sound is typical of a patent ductus arteriosus?", "image": null, "options": ["A fixed split second heart sound", "An opening snap and rumble", "A mid-systolic click", "A continuous machine-like murmur"], "answer": 3, "explanation": "PDA gives a **continuous \"machine-like\" murmur**. **Why not B:** a split S2 is ASD. **Why not C:** an opening snap is mitral stenosis.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.1.3"}, {"id": "P-204", "sub": "2.1.4", "section": "2.1", "lecture": 2, "concept": "cyanotic-chd", "stem": "A single large arterial vessel arises from both ventricles. What is the lesion?", "image": null, "options": ["Tetralogy of Fallot", "Transposition of the great arteries", "Persistent truncus arteriosus", "Tricuspid atresia"], "answer": 2, "explanation": "The truncus fails to divide → **a single large vessel from both ventricles**. **Why not C:** in transposition there are two vessels arising from the wrong ventricles.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.1.4; QZ14"}, {"id": "P-205", "sub": "2.1.5", "section": "2.1", "lecture": 2, "concept": "coarctation", "stem": "Which valve abnormality is associated with adult (postductal) coarctation?", "image": null, "options": ["Mitral valve prolapse", "Bicuspid aortic valve", "Tricuspid atresia", "Pulmonary stenosis"], "answer": 1, "explanation": "Adult coarctation is associated with a **bicuspid aortic valve**. The infantile form is associated with a PDA.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.1.5"}, {"id": "P-211", "sub": "2.2.1", "section": "2.2", "lecture": 2, "concept": "rf-mechanism", "stem": "What is the mechanism of acute rheumatic fever?", "image": null, "options": ["Antibodies to M protein cross-reacting", "Direct bacterial infection of the valve", "Toxin-mediated necrosis of myocytes", "IgA immune-complex deposition"], "answer": 0, "explanation": "Rheumatic fever is **molecular mimicry**: antibodies against streptococcal M protein cross-react with heart tissue. That is why cultures are negative and the lesions are sterile.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.2.1"}, {"id": "P-212", "sub": "2.2.2", "section": "2.2", "lecture": 2, "concept": "jones", "stem": "Which of these is a **major** Jones criterion?", "image": null, "options": ["Fever", "Raised ESR", "Raised ASO titre", "Pancarditis"], "answer": 3, "explanation": "**Pancarditis** is major. Fever and a raised ESR are minor. A raised ASO is the **evidence of infection**, not a criterion.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.2.2; QZ17"}, {"id": "P-213", "sub": "2.2.3", "section": "2.2", "lecture": 2, "concept": "rhd", "stem": "The cells shown in this myocardial biopsy from a child with acute rheumatic fever are best described as what?", "image": "H&E of myocardium: a perivascular nodule of plump cells whose nuclei show a slender, wavy ribbon of chromatin, with a few giant cells and fibrinoid material.", "options": ["Multinucleate foreign-body giant cells", "Lymphocytes around necrotic myocytes", "Reactive histiocytes with wavy nuclei", "Foamy macrophages full of lipid"], "answer": 2, "explanation": "These are **Anitschkow cells**: reactive histiocytes with slender, wavy \"caterpillar\" nuclei, found in Aschoff bodies. **Why not C:** lymphocytes with myocyte necrosis are viral myocarditis.", "previousExam": true, "difficulty": "Interpretation", "ref": "L2 §2.2.3; QZ16"}, {"id": "P-214", "sub": "2.2.4", "section": "2.2", "lecture": 2, "concept": "rhd", "stem": "What raises the risk of chronic rheumatic heart disease?", "image": null, "options": ["A single attack treated promptly", "Repeated strep throat infections", "Coxsackie virus myocarditis", "Long-standing systemic hypertension"], "answer": 1, "explanation": "**Repeated** group A strep infections cause relapses and raise the risk of chronic RHD.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.2.4"}, {"id": "P-215", "sub": "2.2.5", "section": "2.2", "lecture": 2, "concept": "rhd", "stem": "Which valve is almost always involved in chronic rheumatic heart disease?", "image": "Mitral valve viewed from the left atrium: thickened, fused leaflets with a narrow \"fish-mouth\" orifice and short, thick chordae.", "options": ["Mitral", "Aortic", "Tricuspid", "Pulmonary"], "answer": 0, "explanation": "Chronic RHD **almost always involves the mitral valve** (fish-mouth stenosis); the aortic valve is sometimes involved.", "previousExam": true, "difficulty": "Interpretation", "ref": "L2 §2.2.5; CQ45"}, {"id": "P-231", "sub": "2.3.1", "section": "2.3", "lecture": 2, "concept": "aortic-stenosis", "stem": "Why does calcific aortic stenosis cause schistocytes?", "image": null, "options": ["Antibodies coat and destroy red cells", "Iron is lost through chronic bleeding", "The marrow is replaced by fibrosis", "Red cells are sheared on the calcified valve"], "answer": 3, "explanation": "Red cells are sheared on the calcified valve → **microangiopathic haemolytic anaemia**.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.3.1"}, {"id": "P-232", "sub": "2.3.2", "section": "2.3", "lecture": 2, "concept": "ar", "stem": "Which murmur is typical of aortic regurgitation?", "image": null, "options": ["Crescendo–decrescendo systolic murmur", "Opening snap with diastolic rumble", "Early blowing diastolic murmur", "Continuous machinery murmur"], "answer": 2, "explanation": "AR gives an **early, blowing diastolic murmur** with a wide pulse pressure. **Why not B:** that is aortic stenosis.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.3.2"}, {"id": "P-233", "sub": "2.3.3", "section": "2.3", "lecture": 2, "concept": "mvp", "stem": "What is the basic pathology of mitral valve prolapse?", "image": null, "options": ["Commissural fusion of the leaflets", "Myxoid degeneration of the leaflets", "Nodular calcification of the cusps", "Vegetations on the closure line"], "answer": 1, "explanation": "**Myxoid degeneration** (ground substance builds up) makes the valve floppy, so it balloons into the LA in systole. **Why not B:** fusion is chronic RHD.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.3.3; QZ18"}, {"id": "P-234", "sub": "2.3.4", "section": "2.3", "lecture": 2, "concept": "mr", "stem": "When is the murmur of mitral regurgitation heard?", "image": null, "options": ["Throughout systole", "In early diastole", "In mid-diastole", "Continuously"], "answer": 0, "explanation": "MR gives a **holosystolic** blowing murmur (blood refluxes into the LA throughout systole).", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.3.4"}, {"id": "P-235", "sub": "2.3.5", "section": "2.3", "lecture": 2, "concept": "ms-af", "stem": "Why is the left ventricle normal-sized in pure mitral stenosis?", "image": null, "options": ["It undergoes concentric hypertrophy", "Its wall is replaced by fat", "It dilates from volume overload", "It is protected behind the stenosis"], "answer": 3, "explanation": "The **LV is protected** behind the narrowed mitral valve; the left **atrium** dilates instead.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.3.5"}, {"id": "P-236", "sub": "2.3.6", "section": "2.3", "lecture": 2, "concept": "murmurs", "stem": "An opening snap followed by a diastolic rumble indicates which lesion?", "image": null, "options": ["Aortic stenosis", "Mitral regurgitation", "Mitral stenosis", "Aortic regurgitation"], "answer": 2, "explanation": "Opening snap + diastolic rumble = **mitral stenosis**. **Why not B:** aortic stenosis gives an ejection click and a crescendo–decrescendo systolic murmur.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.3.6; QZ20"}, {"id": "P-241", "sub": "2.4.1", "section": "2.4", "lecture": 2, "concept": "nbte-lse", "stem": "A woman with SLE has sterile vegetations on **both** surfaces of her mitral leaflets. What are they?", "image": null, "options": ["Rheumatic vegetations", "Libman–Sacks vegetations", "NBTE (marantic) vegetations", "Infective vegetations"], "answer": 1, "explanation": "Vegetations on **either side** of the leaflet in SLE are **Libman–Sacks**. **Why not B or C:** rheumatic and NBTE vegetations sit on the line of closure.", "previousExam": true, "difficulty": "Application", "ref": "L2 §2.4.1; QZ22"}, {"id": "P-242", "sub": "2.4.2", "section": "2.4", "lecture": 2, "concept": "ie-acute-subacute", "stem": "Which feature fits **acute** rather than subacute infective endocarditis?", "image": null, "options": ["Large, destructive vegetations", "A low-virulence organism", "A previously damaged valve", "Anaemia of chronic disease"], "answer": 0, "explanation": "Acute IE (*S. aureus*) attacks **normal** valves with **large, destructive** vegetations. The other options describe subacute IE (*S. viridans*).", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.4.2"}, {"id": "P-243", "sub": "2.4.3", "section": "2.4", "lecture": 2, "concept": "ie-organism", "stem": "Which organism typically causes endocarditis on a prosthetic valve?", "image": null, "options": ["*Streptococcus bovis*", "*Streptococcus viridans*", "A HACEK-group organism", "*Staphylococcus epidermidis*"], "answer": 3, "explanation": "Prosthetic valve → ***S. epidermidis***. *S. bovis* points to colorectal cancer; HACEK to culture-negative IE.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.4.3"}, {"id": "P-244", "sub": "2.4.4", "section": "2.4", "lecture": 2, "concept": "ie-organism", "stem": "What starts the formation of an infective vegetation?", "image": null, "options": ["Immune complexes deposited on normal valve cusps", "Antibodies cross-reacting with valve collagen", "Bacteria seeding a sterile thrombus on damaged endocardium", "Myxoid ground substance building up in a leaflet"], "answer": 2, "explanation": "A **damaged endocardial surface** grows a sterile platelet–fibrin deposit, and **transient bacteraemia** seeds it.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.4.4"}, {"id": "P-245", "sub": "2.4.5", "section": "2.4", "lecture": 2, "concept": "ie-histology", "stem": "A section of a valve vegetation is shown. What does the deep basophilic band contain?", "image": "H&E of a valve vegetation: a pink surface layer of fibrin and platelets, a deeper band of dark blue granular material, and inflammatory cells at the base.", "options": ["Dystrophic calcium", "Bacterial colonies", "Caseous necrosis", "Epithelioid granulomas"], "answer": 1, "explanation": "IE vegetations have three zones: a fibrin/platelet cap, a **basophilic zone of bacterial colonies**, and inflammatory cells. **Why not D:** granulomas are not part of the vegetation.", "previousExam": true, "difficulty": "Interpretation", "ref": "L2 §2.4.5; QZ25"}, {"id": "P-246", "sub": "2.4.6", "section": "2.4", "lecture": 2, "concept": "ie-signs", "stem": "A patient with endocarditis has painful, tender nodules on the finger pulps. What are they?", "image": null, "options": ["Osler nodes", "Janeway lesions", "Roth spots", "Splinter haemorrhages"], "answer": 0, "explanation": "**Osler = Ouch**: painful nodules on the finger pulps. Janeway lesions are painless (palms and soles).", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.4.6; QZ24"}, {"id": "P-251", "sub": "2.5.1", "section": "2.5", "lecture": 2, "concept": "dcm", "stem": "Which gene is the most common genetic cause of **dilated** cardiomyopathy?", "image": null, "options": ["β-myosin heavy chain", "Myosin-binding protein C", "Fibrillin-1", "Titin"], "answer": 3, "explanation": "**Titin** mutations cause about 20% of DCM. **Why not B or C:** these are **HCM** genes. Fibrillin-1 is Marfan syndrome.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.5.1; QZ29"}, {"id": "P-252", "sub": "2.5.2", "section": "2.5", "lecture": 2, "concept": "hcm", "stem": "The heart of a young man who collapsed while running is shown. What would microscopy most likely show?", "image": "Transverse slice of the heart: massive, asymmetric thickening of the interventricular septum with a slit-like left ventricular cavity.", "options": ["Fat replacing the right ventricle", "Amyloid between the myocytes", "Myofibre hypertrophy with disarray", "Lymphocytes with myocyte necrosis"], "answer": 2, "explanation": "Asymmetric septal hypertrophy with sudden death in a young athlete = **HCM**, whose histology is **myofibre disarray**. **Why not B:** fat replacing the RV is ARVC.", "previousExam": true, "difficulty": "Interpretation", "ref": "L2 §2.5.2; QZ26, CQ34"}, {"id": "P-253", "sub": "2.5.3", "section": "2.5", "lecture": 2, "concept": "arvc", "stem": "Which change defines arrhythmogenic right ventricular cardiomyopathy?", "image": null, "options": ["Myofibre disarray in the septum", "Fatty replacement of the RV wall", "Dilation of all four chambers", "Amyloid in both ventricles"], "answer": 1, "explanation": "In ARVC the **RV wall is replaced by fat** (with some fibrosis) and thinned, causing arrhythmias and sudden death.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.5.3; QZ27"}, {"id": "P-254", "sub": "2.5.4", "section": "2.5", "lecture": 2, "concept": "rcm", "stem": "Which is a cause of restrictive cardiomyopathy?", "image": null, "options": ["Amyloidosis", "Titin mutation", "Coxsackie myocarditis", "Chronic alcohol use"], "answer": 0, "explanation": "**Amyloidosis** stiffens the ventricle (low-voltage ECG). **Why not B–D:** titin, Coxsackie myocarditis and alcohol cause **dilated** cardiomyopathy.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.5.4; QZ30"}, {"id": "P-255", "sub": "2.5.5", "section": "2.5", "lecture": 2, "concept": "dcm", "stem": "Which cardiomyopathy fails mainly in **systole**?", "image": null, "options": ["Hypertrophic", "Restrictive", "Constrictive pericarditis", "Dilated"], "answer": 3, "explanation": "**Dilated** cardiomyopathy is systolic failure (the ventricles cannot pump). Hypertrophic and restrictive cardiomyopathies, and constrictive pericarditis, fail in diastole.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.5.5"}, {"id": "P-261", "sub": "2.6.1", "section": "2.6", "lecture": 2, "concept": "myocarditis", "stem": "What is the most common cause of myocarditis?", "image": null, "options": ["Trypanosoma cruzi", "Diphtheria toxin", "Coxsackie viruses", "Cardiac sarcoidosis"], "answer": 2, "explanation": "**Viruses** are the most common cause, above all **Coxsackie A and B**.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.6.1; QZ31"}, {"id": "P-262", "sub": "2.6.2", "section": "2.6", "lecture": 2, "concept": "tamponade", "stem": "A man with a stab wound to the chest has hypotension, muffled heart sounds and clear lungs. What is the most useful treatment?", "image": null, "options": ["An intercostal chest drain", "Urgent pericardiocentesis", "An intravenous diuretic", "Intravenous antibiotics"], "answer": 1, "explanation": "Rapid blood in the pericardium causes **tamponade**; it needs **urgent pericardial drainage**. **Why not B:** the lungs are clear, so this is not a pneumothorax or haemothorax picture.", "previousExam": true, "difficulty": "Application", "ref": "L2 §2.6.2; CQ4"}, {"id": "P-263", "sub": "2.6.3", "section": "2.6", "lecture": 2, "concept": "pericarditis-types", "stem": "Milky fluid in the pericardial sac points to what?", "image": null, "options": ["Lymphatic obstruction", "Metastatic carcinoma", "Uraemic pericarditis", "Bacterial infection"], "answer": 0, "explanation": "Milky (**chylous**) fluid = **lymphatic obstruction or injury**. **Why not B:** malignancy gives haemorrhagic fluid.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.6.3; QZ35"}, {"id": "P-264", "sub": "2.6.4", "section": "2.6", "lecture": 2, "concept": "constrictive", "stem": "Which condition is a classic cause of constrictive pericarditis?", "image": null, "options": ["Viral serous pericarditis", "Chylous pericardial effusion", "Acute cardiac tamponade", "Tuberculous pericarditis"], "answer": 3, "explanation": "Constrictive pericarditis is the end result of **TB** and severe **suppurative** pericarditis: a thick, calcified shell restricts filling.", "previousExam": false, "difficulty": "Recall", "ref": "L2 §2.6.4"}, {"id": "P-271", "sub": "2.7.1", "section": "2.7", "lecture": 2, "concept": "hf-compensation", "stem": "Which compensatory mechanism **worsens** heart failure?", "image": null, "options": ["Atrial natriuretic peptide release", "Increased myocardial contractility", "Renin–angiotensin system activation", "Myocardial hypertrophy"], "answer": 2, "explanation": "**RAAS** retains salt and water (more preload) and constricts vessels (more afterload), so fluid retention worsens CHF. ANP is protective.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.7.1; QZ44"}, {"id": "P-272", "sub": "2.7.2", "section": "2.7", "lecture": 2, "concept": "hf-left-right", "stem": "What is the hallmark of left heart failure?", "image": null, "options": ["Nutmeg liver", "Pulmonary oedema", "Jugular venous distension", "Dependent ankle oedema"], "answer": 1, "explanation": "Left heart failure backs blood into the **lungs** → **pulmonary oedema**. The other options are right-sided.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.7.2; QZ41"}, {"id": "P-273", "sub": "2.7.2", "section": "2.7", "lecture": 2, "concept": "hf-left-right", "stem": "The cut surface of a liver is shown. Which condition does it indicate?", "image": "Cut surface of a liver with a mottled pattern of dark red congested centres and paler surrounding tissue (\"nutmeg\").", "options": ["Right heart failure", "Left heart failure", "Viral hepatitis", "Portal vein thrombosis"], "answer": 0, "explanation": "A **nutmeg liver** (centrilobular congestion) is chronic passive congestion from **right** heart failure; it may progress to cardiac cirrhosis.", "previousExam": true, "difficulty": "Interpretation", "ref": "L2 §2.7.2; QZ43"}, {"id": "P-281", "sub": "2.8", "section": "2.8", "lecture": 2, "concept": "cardiac-tumours", "stem": "Cardiac metastases come mainly from which primary tumours?", "image": null, "options": ["Colon and stomach carcinoma", "Kidney and bladder carcinoma", "Thyroid and prostate carcinoma", "Breast and lung carcinoma"], "answer": 3, "explanation": "Metastases (mainly **breast and lung**, also melanoma and lymphoma) are more common than primary cardiac tumours and usually involve the pericardium.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.8; QZ38"}, {"id": "P-282", "sub": "2.8", "section": "2.8", "lecture": 2, "concept": "cardiac-tumours", "stem": "Which primary cardiac tumour is associated with tuberous sclerosis?", "image": null, "options": ["Myxoma", "Angiosarcoma", "Rhabdomyoma", "Fibroma"], "answer": 2, "explanation": "**Rhabdomyoma**, a hamartoma of cardiac muscle in the ventricle, is the most common primary cardiac tumour in children.", "previousExam": true, "difficulty": "Recall", "ref": "L2 §2.8; QZ39"}, {"id": "P-291", "sub": "2.9.1", "section": "2.9", "lecture": 2, "concept": "stroke-source", "stem": "Which embolic source can reach the brain **only** through an intracardiac shunt?", "image": null, "options": ["A left atrial mural thrombus", "A deep vein thrombus", "A left ventricular mural thrombus", "A left atrial myxoma"], "answer": 1, "explanation": "A venous clot reaches the systemic side only by **paradoxical embolism** (e.g. through an ASD). Left-sided sources embolise to the brain directly.", "previousExam": false, "difficulty": "Application", "ref": "L2 §2.9.1; CQ27"}, {"id": "P-292", "sub": "2.9.2", "section": "2.9", "lecture": 2, "concept": "scd", "stem": "Which cause of sudden death in a young person shows **cystic medial degeneration** at autopsy?", "image": null, "options": ["Marfan aortic dissection", "Hypertrophic cardiomyopathy", "Arrhythmogenic RV cardiomyopathy", "Viral myocarditis"], "answer": 0, "explanation": "Cystic medial degeneration of the aorta (Marfan) leads to **dissection**, with death from tamponade.", "previousExam": false, "difficulty": "Application", "ref": "L2 §2.9.2"}, {"id": "P-293", "sub": "2.9.3", "section": "2.9", "lecture": 2, "concept": "mi-rupture", "stem": "Bloody pericardial fluid and hypotension appear 5 days after an MI. What is the cause?", "image": null, "options": ["Dressler syndrome", "Uraemic pericarditis", "Viral pericarditis", "Free-wall rupture"], "answer": 3, "explanation": "Day 4–7 is the rupture window: **free-wall rupture** → haemopericardium → tamponade. **Why not B:** Dressler syndrome is a fibrinous pericarditis weeks to months later.", "previousExam": true, "difficulty": "Application", "ref": "L2 §2.9.3; CQ30"}, {"id": "P-294", "sub": "2.9.4", "section": "2.9", "lecture": 2, "concept": "ar", "stem": "Which cause of aortic regurgitation works by destroying the cusps rather than dilating the root?", "image": null, "options": ["Tertiary syphilitic aortitis", "Marfan aortic-root dilation", "Infective endocarditis", "Proximal aortic dissection"], "answer": 2, "explanation": "**Infective endocarditis** destroys the cusps. Syphilis, Marfan syndrome and dissection dilate the aortic root.", "previousExam": false, "difficulty": "Application", "ref": "L2 §2.9.4"}], "concepts": {"athero-path": {"name": "Atherosclerosis: pathogenesis", "subs": ["1.1.3", "1.1.4"], "sections": ["1.1"]}, "athero-sites": {"name": "Atherosclerosis: sites and risk factors", "
