<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardiovascular Pathology — Exam Review — offline revision edition</title>
<meta name="description" content="Offline revision edition of the cardiovascular pathology exam review for third-year MBBS students. Results stay in the browser and are not official.">
<meta name="author" content="Dr Wesam Alzwawy">
<style>:root{
  --navy:#0f2a4a; --navy-2:#173a63; --teal:#0e7c7b; --teal-2:#0b6463; --teal-soft:#e3f3f2;
  --ink:#1b2430; --muted:#5b6778; --line:#dde3ea; --bg:#f4f6f9; --card:#ffffff;
  --good:#1f7a3f; --good-soft:#e5f4ea; --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fff4dc;
  --hy:#0e7c7b; --trap:#b3261e; --clar:#5a4bb0; --clar-soft:#efedfb;
  --radius:12px; --shadow:0 1px 2px rgba(15,42,74,.06),0 4px 14px rgba(15,42,74,.06);
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--teal-2)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #f0b429;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.brand-logo{width:34px;height:34px;flex:none}
.brand-t{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-s{font-size:12px;opacity:.75;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#dbe6f3;text-decoration:none;padding:7px 7px;border-radius:8px;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a.active{background:var(--teal);color:#fff}
.nav .ico{font-size:15px}
.searchbox{position:relative}
.searchbox input{width:150px;border:0;border-radius:8px;padding:7px 10px;background:rgba(255,255,255,.12);color:#fff}
.searchbox input::placeholder{color:#b9c8da}
@media (max-width:1240px){.searchbox input{width:110px}}
@media (max-width:1360px){.nav a[data-k=faculty] .lbl{display:none}}
@media (max-width:1240px){.nav a[data-k=progress] .lbl,.nav a[data-k=home] .lbl{display:none}}
@media (max-width:1120px){.nav .lbl{display:none}.nav a{padding:8px}.brand-s{display:none}.searchbox input{width:120px}}
@media (max-width:560px){.brand-t{display:none}.searchbox{display:none}}

main{max-width:1280px;margin:0 auto;padding:22px 16px 60px}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px 30px;border-top:1px solid var(--line)}

h1,h2,h3,h4{color:var(--navy);line-height:1.25}
h1{font-size:28px;margin:0 0 6px}
h2{font-size:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--teal);color:var(--teal-2)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc2bd}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal-2)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:6px;vertical-align:middle;white-space:nowrap}
.b-ce{background:var(--good-soft);color:#14532d;border:1px solid #b9dfc6}.b-c{background:#e3edf9;color:#123e6e;border:1px solid #c5d7ee}.b-clar{background:var(--clar-soft);color:var(--clar);border:1px solid #d6d0f3}.b-supp{background:#f1f1f1;color:#555;border:1px solid #ddd}.b-thr{background:var(--warn-soft);color:var(--warn);border:1px solid #f0d49a}
.progress{height:8px;background:#e7ecf2;border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:13px;color:var(--muted)}

/* home */
.hero{background:linear-gradient(135deg,var(--navy),#12456e 60%,var(--teal));color:#fff;border-radius:16px;padding:28px 26px;margin-bottom:20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero h1{color:#fff;font-size:30px}
.hero p{margin:6px 0;opacity:.92;max-width:720px}
.hero .who{font-size:14px;opacity:.85}
.steps{counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-2px);border-color:var(--teal)}
.step .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--teal-2);display:grid;place-items:center;font-weight:800}
.step.done .n{background:var(--good);color:#fff}
.step h3{margin:0 0 4px;font-size:17px}
.step p{margin:0;font-size:14px;color:var(--muted)}

/* lecture */
.lec{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.toc li.sub{display:none}.lec{grid-template-columns:minmax(0,1fr)}.toc{position:static!important;max-height:none!important}}
.toc{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;padding:14px}
.toc h4{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:flex;gap:8px;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px}
.toc li a:hover{background:var(--teal-soft)}
.toc li a .tick{margin-left:auto;color:var(--good);font-weight:800}
.toc li.sub a{padding-left:24px;font-size:13px;color:var(--muted)}
.lec-head{margin-bottom:14px}
.sec{margin-bottom:22px;scroll-margin-top:80px}
.sec>h2{display:flex;gap:10px;align-items:center;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--teal-soft)}
.sec>h2 .num{background:var(--navy);color:#fff;border-radius:8px;padding:2px 9px;font-size:16px}
details.sub{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:#fff;scroll-margin-top:80px}
details.sub>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:700;color:var(--navy)}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary::before{content:"▸";color:var(--teal);transition:transform .15s}
details.sub[open]>summary::before{transform:rotate(90deg)}
details.sub>summary .sid{color:var(--teal-2);font-variant-numeric:tabular-nums}
details.sub .body{padding:0 16px 14px}
.md p{margin:.55em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.4em}
.md li{margin:.2em 0}
.md table{border-collapse:collapse;width:100%;font-size:14px;margin:.7em 0;background:#fff}
.md th,.md td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.md th{background:#eef3f8;color:var(--navy)}
.md tr:nth-child(even) td{background:#fafcfd}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.md h3,.md h4{margin:1em 0 .4em}
.co{border-left:4px solid var(--teal);background:var(--teal-soft);padding:9px 12px;border-radius:0 9px 9px 0;margin:.7em 0}
.co.trap{border-color:var(--trap);background:var(--bad-soft)}
.co.clar{border-color:var(--clar);background:var(--clar-soft)}
.co.why{border-color:#8aa4c2;background:#f1f5fa}
.co>p:first-child{margin-top:0}.co>p:last-child{margin-bottom:0}
.src{font-size:13px;color:var(--muted);margin:.4em 0}
.src::before{content:"📑 "}
mark{background:#fff0a8;padding:0 2px;border-radius:3px}

/* image card */
.fig{display:flex;gap:12px;align-items:flex-start;border:1px dashed #a9bdd3;background:#f7fafd;border-radius:10px;padding:10px 12px;margin:.7em 0}
.fig svg{flex:none;width:44px;height:44px}
.fig .cap{font-size:14px}
.fig .cap b{color:var(--navy)}
.fig .cap .lk{font-size:13px}

/* questions */
.q{margin:14px 0}
.q .stem p{margin:.4em 0}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink)}
.opt:hover{border-color:var(--teal)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #9fb2c6;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--navy)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.sel .L{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .L{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:15px}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb .mark{font-weight:800}
.check{border:1px solid var(--line);border-left:4px solid var(--clar);border-radius:10px;padding:12px 14px;background:#fff;margin:10px 0}
.check .hd{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center;margin:6px 0}
.matchrow select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}
.matchrow.ok select{border-color:var(--good);background:var(--good-soft)}
.matchrow.no select{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:600px){.matchrow{grid-template-columns:minmax(0,1fr)}}
.blank{border:0;border-bottom:2px solid var(--teal);background:var(--teal-soft);padding:2px 6px;min-width:120px;border-radius:4px 4px 0 0}
.blank.ok{border-color:var(--good);background:var(--good-soft)}.blank.no{border-color:var(--bad);background:var(--bad-soft)}

/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.exam-side{position:sticky;top:70px}
.timer{font-size:28px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.qnav button{border:1.5px solid var(--line);background:#fff;border-radius:7px;padding:6px 0;font-weight:700;font-size:13px;color:var(--navy);position:relative}
.qnav button.ans{background:var(--teal);border-color:var(--teal);color:#fff}
.qnav button.cur{outline:2px solid var(--navy);outline-offset:1px}
.qnav button.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#f0b429}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* results */
.bar{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 60px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bar .track{height:12px;background:#e7ecf2;border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
@media (max-width:600px){.bar{grid-template-columns:minmax(0,1fr) 50px}.bar .track{grid-column:1/-1;grid-row:2}}
table.data{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{background:#eef3f8;color:var(--navy);position:sticky;top:0}
table.data th.sort{cursor:pointer}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--teal-soft)}
.review-item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{border-color:var(--teal);color:var(--navy)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);display:grid;place-items:center;z-index:300;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin-top:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:400;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-weight:600;font-size:14px;color:var(--navy)}
.field input,.field select{padding:9px 11px;border:1px solid #c6d1dd;border-radius:9px;background:#fff}
.err{color:var(--bad);font-size:13px}
.note{background:var(--warn-soft);border:1px solid #f0d49a;border-radius:10px;padding:10px 12px;font-size:14px}

/* facts */
.facts li{margin:.45em 0}
.facts li.known{opacity:.55}
.facts li label{cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.facts li input{margin-top:5px;accent-color:var(--teal)}

/* presentation */
.pres{position:fixed;inset:0;background:#0b1f36;z-index:150;display:flex;flex-direction:column;color:#fff}
.pres-main{flex:1;display:flex;min-height:0}
.pres-stage{flex:1;display:flex;min-height:0;min-width:0;padding:18px 26px 8px;border-radius:14px}
.pres-stage.drop{outline:3px dashed #f0b429;outline-offset:-10px}
.pres.editing .pres-stage{padding:14px 14px 8px}
.editor{width:390px;flex:none;background:#fff;color:var(--ink);overflow:auto;padding:14px 16px;border-left:4px solid var(--teal)}
.editor .field{margin:8px 0}
.editor textarea,.editor input:not([type=range]):not([type=file]),.editor select{width:100%;padding:8px 10px;border:1px solid #c6d1dd;border-radius:8px;font:inherit;font-size:14px;background:#fff}
.editor textarea{resize:vertical;line-height:1.45;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.editor .btn{padding:6px 10px;font-size:13px}
.editor .btn.small{padding:4px 8px}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.ed-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ed-row select{width:auto!important;flex:1}
.ed-col{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ed-sec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.ed-help div{background:#f4f6f9;border-radius:8px;padding:8px;margin-top:4px;line-height:1.7}
.ed-img{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}
.ed-img>img{width:84px;height:84px;object-fit:cover;border-radius:6px;background:#eef3f8}
.ed-img input[type=range]{width:110px;vertical-align:middle}
@media (max-width:900px){.pres-main{flex-direction:column}.editor{width:auto;max-height:48vh;border-left:0;border-top:4px solid var(--teal)}}
.simg{margin:0 0 .6em;text-align:center}
.simg img{max-width:100%;max-height:58vh;object-fit:contain;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.simg figcaption{font-size:.62em;color:var(--muted);margin-top:.2em;line-height:1.3}
.simg.al-right{float:right;margin-left:1.2em}
.simg.al-left{float:left;margin-right:1.2em}
.simg.al-center{margin-left:auto;margin-right:auto}
.simg.al-full{width:100%}
.slide .sbody::after{content:"";display:block;clear:both}
.slide.title .simg figcaption,.slide.section .simg figcaption{color:#dbe6f3}
.lightbox{background:rgba(5,12,24,.92);cursor:zoom-out}
.lightbox figure{margin:0;max-width:96vw;max-height:94vh;text-align:center}
.lightbox img{max-width:96vw;max-height:86vh;object-fit:contain;border-radius:8px;background:#fff}
.lightbox figcaption{color:#e6edf5;margin-top:8px;font-size:15px}
.slide{flex:1;background:#fff;color:var(--ink);border-radius:14px;padding:3.2vh 3.4vw;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.slide h2{margin:0 0 .5em;font-size:1.45em;border-bottom:3px solid var(--teal);padding-bottom:.25em}
.slide .sbody{flex:1;min-height:0;overflow:auto}
.slide .md table{font-size:.85em}
.slide.title{justify-content:center;align-items:flex-start;background:linear-gradient(135deg,var(--navy),#12456e 60%,var(--teal));color:#fff}
.slide.title h1{color:#fff;font-size:2.2em;margin:.2em 0}
.slide.title p{font-size:1.05em;opacity:.9}
.slide.section{justify-content:center;background:var(--navy);color:#fff}
.slide.section h1{color:#fff;font-size:2em}
.slide.section .md{color:#dbe6f3}
.pres-bar{display:flex;gap:8px;align-items:center;padding:8px 18px 12px;flex-wrap:wrap}
.pres-bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.pres-bar .cnt{font-variant-numeric:tabular-nums;opacity:.85;min-width:80px;text-align:center}
.pres-notes{background:#132c4b;color:#dbe6f3;padding:10px 26px;font-size:15px;max-height:22vh;overflow:auto;border-top:1px solid #24466d}
.overview{position:fixed;inset:0;background:rgba(8,22,40,.96);z-index:160;overflow:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.overview button{background:#fff;border:0;border-radius:10px;padding:10px;text-align:left;min-height:84px;color:var(--navy);font-size:13px}
.overview button.cur{outline:3px solid #f0b429}
.overview button b{display:block;color:var(--teal-2);font-size:12px}

@media print{
  .topbar,.footer,.toc,.noprint,.btn{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:0;padding:0}
  details.sub{border:0}
  details.sub>summary::before{display:none}
  .lec{display:block}
  .check{break-inside:avoid}
}

/* ---------- v2.0 ---------- */
.prio{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:6px;white-space:nowrap;vertical-align:middle}
.prio.p3{background:#fff1d6;color:#7a4b00;border:1px solid #f0cf85}.prio.p2{background:#fff8e8;color:#8a6a10;border:1px solid #f3e2b3}.prio.p1{background:#f5f6f8;color:#5b6778;border:1px solid #e2e6ec}
.tstar{color:#b07a00;font-size:11px}
details.sub>summary .st{flex:1 1 220px}
details.sub>summary .tags{display:flex;gap:6px;flex-wrap:wrap}
.co.rem{border-color:#8aa4c2;background:#f4f7fb}
details.supp{border:1px dashed #cfd6de;border-radius:8px;padding:6px 10px;margin:.5em 0;background:#fafbfc}
details.supp>summary{cursor:pointer;font-weight:600;color:#555}
details.ty{margin:14px 0 4px;border:1px solid #bfe0de;border-radius:10px;background:#f6fbfb}
details.ty>summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--teal-2)}
details.ty .tyb{padding:0 14px 12px}
.sba{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.sba:first-child{border-top:0;margin-top:0}
.sba .opts{margin:8px 0}
.runner .sba{border-top:0}
.cycle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 6px}
.cycle a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font-size:12.5px}
.cycle a b{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.cycle a:hover b{border-color:var(--teal)}
.cycle .arr{color:var(--muted)}
.next-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:14px 16px;max-width:380px}
.hero .goal{font-size:16px}
.prios{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.prio-card{border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:12px 14px;background:#fff}
.prio-card:nth-child(2){border-left-color:#c98a00}.prio-card:nth-child(n+3){border-left-color:#8aa4c2}
.prio-card .pn{font-size:12px;font-weight:800;color:var(--bad);text-transform:uppercase;letter-spacing:.4px}
.prio-card h3{margin:2px 0 4px;font-size:17px}
.prio-card p{margin:4px 0}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.topic-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--navy);font-weight:600}
.topic-row:hover{border-color:var(--teal)}
.factlist{padding-left:0;list-style:none;counter-reset:f;display:grid;gap:10px}
.factlist .fact{counter-increment:f;position:relative;padding-left:52px}
.factlist .fact::before{content:counter(f);position:absolute;left:14px;top:16px;width:26px;height:26px;border-radius:50%;background:var(--teal-soft);color:var(--teal-2);display:grid;place-items:center;font-weight:800;font-size:13px}
.factlist .fact.known::before{background:var(--good);color:#fff}
.fact .fq{margin-bottom:8px}
.fa{margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
.fa p{margin:.3em 0}
.trapcard{margin-bottom:10px}
.trapcard p{margin:.35em 0}
.tl{display:inline-block;min-width:78px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:6px;margin-right:6px}
.tl.bad{background:var(--bad-soft);color:var(--bad)}.tl.good{background:var(--good-soft);color:var(--good)}
.morph p{margin:.3em 0}
.r15.now{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.25)}
.small15{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.neg{color:var(--bad);font-weight:800}.lowdi{color:#a15c00;font-weight:700}
.note b{color:var(--navy)}
@media print{details.ty,.cycle,.next-box{display:none!important}}

/* ---------- v2.1 pictures ---------- */
.fig{position:relative;flex-wrap:wrap}
.fig.pic{display:block;padding:10px}
.fig.pic img{display:block;max-width:100%;max-height:520px;margin:0 auto 8px;border-radius:8px;cursor:zoom-in;background:#f4f6f9}
.fig.pic .cap{text-align:center}
.pic-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pic-tools .btn{padding:5px 10px;font-size:13px}
.fig.drop{outline:3px dashed var(--teal);outline-offset:3px}
.fig[tabindex]:focus-visible{outline:3px solid #f0b429}
.pres .pic-tools{display:none}
.slide .fig.pic img{max-height:48vh}
.picslot{margin-bottom:12px}
.picslot .fig{margin:6px 0 0}
@media print{.pic-tools{display:none!important}}
.fig .cap{flex:1 1 220px;min-width:0}
.fig.pic{border-style:solid;background:#fff}

/* ---------- connected edition (v3.0) ---------- */
#cvs-boot{position:fixed;inset:0;z-index:500;background:linear-gradient(135deg,var(--navy),#12456e 60%,var(--teal));display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#cvs-boot.over{background:rgba(15,42,74,.6)}
.boot-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px;width:100%;max-width:440px}
.boot-brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.boot-t{font-weight:800;color:var(--navy);line-height:1.2}.boot-s{font-size:13px;color:var(--muted)}
.boot-card h1{font-size:22px;margin:10px 0 6px}
.boot-card label{display:block;font-size:14px;font-weight:600;color:var(--navy);margin:10px 0 0}
.boot-card label input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:16px}
.boot-card label.chk{font-weight:400;display:flex;gap:8px;align-items:center}.boot-card label.chk input{width:auto;margin:0}
.boot-muted{color:var(--muted);font-size:14px}.boot-err{color:var(--bad);font-size:14px;min-height:1em}.boot-note{background:var(--warn-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.boot-foot{font-size:12px;color:var(--muted);margin:16px 0 0}
.boot-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.boot-tabs button{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.boot-tabs button.on{color:var(--navy);border-color:var(--teal)}
.bbtn{border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 16px;border-radius:9px;font-weight:700;margin-top:12px;cursor:pointer}
.bbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff;width:100%}.bbtn.link{border:0;background:none;padding:0;margin:0;color:var(--teal-2);text-decoration:underline;font-weight:400;font-size:12px}
.userchip{position:relative;flex:none}
.userchip .uc{background:rgba(255,255,255,.12);color:#fff;border-color:transparent;padding:6px 10px;font-size:13px}
.ucm{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:220px;z-index:60;padding:4px}
.ucm button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;color:var(--navy)}
.ucm button:hover{background:var(--teal-soft)}
.conn{color:#9ff0c8}
.err{color:var(--bad)}
.svst{margin:6px 0}
@media (max-width:1120px){.userchip .lbl{display:none}}
</style>

<script type="application/json" id="cvs-data">{"meta": {"title": "Cardiovascular Pathology — Exam Review", "short": "CVS Review", "author": "Dr Wesam Alzwawy", "role": "Associate Professor of Pathology", "dept": "Pathology Department, College of Medicine, Misurata University", "audience": "Third-year MBBS", "version": "2.1", "storagePrefix": "cvs_", "edition": "offline"}, "lectures": [{"num": 1, "title": "Vascular Disease and the Ischaemic Heart", "intro": {"id": "how-to-use-this-lecture", "title": "How to use this lecture", "intro": "This is an exam-focused review for students who have already had the full faculty lectures. It is **not a full course**. It teaches only what was taught and examined, in the order *vessel → heart*.\n\n**Every block has the same shape:**\n\n- **HIGH-YIELD FACT** — the line to remember\n- **Why** — a short explanation, so the fact is understood rather than memorised\n- **EXAM TRAP** — kept only for genuine confusions; other exam notes are shown as **Remember**\n- **Image** — the gross or microscopic picture the platform will show at that point\n- **Source** — the faculty slide it comes from\n\n**Labels:**\n\n- [COURSE + EXAM] — faculty content that has been examined\n- [COURSE] — faculty content\n- [CLARIFICATION] — added to prevent a misunderstanding or to update terminology\n- [SUPP] — an additional pathology note, collapsed by default; not assessable\n- [COURSE THRESHOLD] — a faculty number kept for the exam where current definitions differ. The faculty value is never silently replaced; the difference is labelled\n- ★★★ MUST KNOW · ★★ HIGH-YIELD · ★ SUPPORTING — the priority of each learning block\n\n**Source codes:**\n\n- **CL** = cardiac lectures, **VL** = vascular lectures (slide number)\n- **QZ / CR** = cardiac quiz and revision MCQs, **VR** = vascular revision MCQs, **CQ** = CVS case questions\n\n**Corrections applied** (from the blueprint's quality-control table):\n\n- ≥75% is used as the only critical-stenosis figure\n- The MI time course follows the CL p27 table\n- The \"polycythemia vera\" wording in Eisenmenger is corrected in Lecture 2\n\nEach learning block ends with a **Test yourself** question; each section ends with a **section check**.", "subs": []}, "sections": [{"id": "1.1", "title": "Atherosclerosis: the common root", "intro": "Atherosclerosis is a major underlying mechanism of IHD, MI, **ischaemic** stroke, peripheral vascular disease and AAA. Learn it once here; Sections 1.2, 1.3 and 1.5 reuse it.", "subs": [{"id": "1.1.1", "title": "Arteriosclerosis has three patterns", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Arteriosclerosis (hardening of arteries) = atherosclerosis + arteriolosclerosis + Mönckeberg medial calcific sclerosis.\n\n| Pattern | Vessel | Layer | Lesion | Clinical significance |\n| --- | --- | --- | --- | --- |\n| Atherosclerosis | Large and medium arteries | **Intima** | Lipid plaque (atheroma) | Major: ischaemia, infarction, aneurysm |\n| Arteriolosclerosis | Small arteries/arterioles | Wall | Hyaline (protein leak) or hyperplastic (SMC layers) | HTN and diabetes damage (see 1.4) |\n| Mönckeberg | Medium muscular arteries | **Media** | Ring-like calcification | **Usually none** — the lumen is not narrowed |\n\n**EXAM TRAP:** A calcified artery with an **open lumen** in an elderly patient (the CQ51 thyroidectomy slide; VR Q32) is Mönckeberg, not atherosclerosis.\n\n**Image:** H&E of a small artery with purple medial calcium rings and an open lumen, next to an atheroma for contrast.\n\n*Source: VL p75–76*", "priority": 2}, {"id": "1.1.2", "title": "Sites and risk factors", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The four commonest sites are the **abdominal aorta > coronary arteries > popliteal artery > internal carotid**.\n\nRisk factors:\n\n| Non-modifiable | Modifiable |\n| --- | --- |\n| Genetic abnormalities, family history, increasing age, male sex | **Hyperlipidaemia (LDL)**, hypertension, smoking, diabetes, inflammation |\n\n**Why:** Each modifiable factor injures the endothelium (1.1.3). Hyperlipidaemia is the risk factor most tied to plaque growth, which is why a patient with claudication, bruits and a high LDL points to hyperlipidaemia (VR Q27).\n\n*Source: VL p78–79; IHD risk factors CL p5*", "priority": 2}, {"id": "1.1.3", "title": "Pathogenesis: response to injury", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Chronic endothelial injury → LDL enters the intima and is oxidised → monocytes enter and become macrophages → **foam cells** → smooth muscle cells migrate from the media and lay down collagen → fibrofatty plaque.\n\nThe sequence (VL p80–85):\n\n1. **Endothelial injury/dysfunction:** hyperlipidaemia, HTN, smoking, homocysteine, haemodynamic stress, toxins, viruses, immune reactions\n2. **Increased permeability** and leukocyte adhesion; monocytes and platelets adhere\n3. **Macrophages take up oxidised LDL** and become foam cells; they release cytokines and growth factors\n4. **SMC recruitment** from media to intima; SMCs also engulf lipid\n5. **SMC proliferation + collagen/ECM + extracellular lipid** = fibrofatty atheroma\n\n**Why it matters:** The lipid in foam cells comes mainly from **serum lipoproteins (LDL)**, not from dead cells (VR Q47). The SMC is the cell that builds the fibrous cap.\n\n**Image:** The Robbins-style stepwise diagram (drawn fresh for the platform), then H&E of foam cells.", "priority": 3}, {"id": "1.1.4", "title": "Morphological stages", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Fatty streak → atherosclerotic plaque → complicated plaque.\n\n| Stage | What you see | Significance |\n| --- | --- | --- |\n| **Fatty streak** | Flat yellow streak; foamy macrophages in the intima | **Earliest visible lesion** (VR Q26); not obstructive |\n| Atherosclerotic plaque | Raised plaque: fibrous cap over a necrotic lipid core with cholesterol clefts | Narrows the lumen |\n| Complicated plaque | Rupture/ulceration, haemorrhage, thrombus, calcification | Causes the acute events |\n\n**Image:** Gross aorta series (streak → raised plaques → ulcerated, calcified plaques with thrombus).\n\n*Source: VL p86–88*", "priority": 2}, {"id": "1.1.5", "title": "Complications: know them by site", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Atherosclerosis causes disease in four ways: stenosis, rupture + thrombosis, embolism and aneurysm.\n\n| Mechanism | Result | Example |\n| --- | --- | --- |\n| **Stenosis** (gradual) | Ischaemia on demand | Popliteal → peripheral vascular disease (claudication); coronary → stable angina; mesenteric → ischaemic bowel |\n| **Plaque rupture + thrombosis** | Sudden occlusion | Coronary → MI; middle cerebral artery → stroke |\n| **Rupture + embolisation** | Distal infarcts | Atheroemboli contain **cholesterol crystals** |\n| **Weakened wall** | Aneurysm | Abdominal aorta → AAA (1.5.4) |\n\n**Intermittent claudication** is leg pain on exercise, relieved by rest, caused by atherosclerotic stenosis (VR f43).\n\n*Source: VL p89–91*", "priority": 2}, {"id": "1.1.6", "title": "Link card: atherosclerosis → the heart", "label": null, "md": "Critical stenosis (≥75%) gives stable angina. Plaque disruption with thrombus gives the acute coronary syndromes. Go to 1.2.\n\n[CLARIFICATION] Heavy calcification of an atheroma is **dystrophic calcification**: it forms in damaged tissue while serum calcium is normal (VR Q44). This is general pathology revision, not new content.", "priority": 1}]}, {"id": "1.2", "title": "Ischaemic heart disease", "intro": "", "subs": [{"id": "1.2.1", "title": "Definition and the four syndromes", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** IHD is an imbalance between myocardial O₂ demand and supply, usually from reduced coronary flow. Coronary atherosclerosis is the most common cause; vasospasm and vasculitis are less common.\n\nThe four syndromes:\n\n1. Angina pectoris\n2. Acute myocardial infarction\n3. Sudden cardiac death\n4. Chronic IHD with congestive heart failure\n\n*Source: CL p3, p10; CR f1–2*", "priority": 1}, {"id": "1.2.2", "title": "Pathogenesis: five roles", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A fixed coronary stenosis typically causes symptoms when myocardial oxygen demand rises, such as during exertion. The acute syndromes come from **acute plaque change**, often on a plaque that was only mildly stenosing.\n\n| Role | What happens | Leads to |\n| --- | --- | --- |\n| 1. Critical stenosis | **≥75%** fixed narrowing of the lumen | Demand ischaemia → stable angina |\n| 2. Acute plaque change | Rupture or ulceration → (i) haemorrhage into the atheroma (it swells); (ii) exposed thrombogenic subendothelium → thrombus | Unstable angina, MI, sudden death |\n| 3. Coronary thrombus | **Total** occlusion → transmural MI or sudden death. **Partial** occlusion → unstable angina, subendocardial MI or sudden death. It can also embolise | Grades the syndrome |\n| 4. Vasoconstriction | Narrows the lumen; can promote plaque disruption | Adds to the other roles |\n| 5. Inflammation | Active at every stage of atherosclerosis | — |\n\n**Remember:** The question asks what *directly* results from disruption of a vulnerable plaque. The answer is **haemorrhage into the plaque with thrombosis**, not fixed obstruction or calcification (QZ3).\n\n**Image:** The CL p4 pathway diagram: <70% → asymptomatic; critical stenosis → stable angina; mural thrombus → UA/subendocardial MI; occlusive thrombus → transmural MI/SCD.\n\n*Source: CL p4, p6–9*", "priority": 2}, {"id": "1.2.3", "title": "The three anginas", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Angina is transient, **reversible** ischaemia with **no necrosis**. On the ECG, **ST depression** reflects **subendocardial** ischaemia. **ST elevation** in angina is the transient **transmural** ischaemia of Prinzmetal vasospasm; ST elevation **with a troponin rise** is a transmural (ST-elevation) MI (1.3.2).\n\n|  | Stable (typical) | Unstable (crescendo) | Prinzmetal (variant) |\n| --- | --- | --- | --- |\n| Trigger | Exertion or emotion | **At rest** / increasing pain with less exertion | Episodic, **unrelated to exertion** |\n| Lesion | Fixed **≥75%** stenosis | **Plaque rupture + thrombus, incomplete occlusion** | **Coronary vasospasm** |\n| ECG | ST depression | ST depression | **ST elevation** |\n| Relief | Rest or nitroglycerin | Nitroglycerin | Nitroglycerin or **calcium-channel blocker** |\n| Key risk | — | **High risk of MI** | — |\n\nAngina pain lasts minutes (<20 min). It may radiate to the left arm, jaw or neck, with sweating and breathlessness.\n\n**EXAM TRAP:** \"Exertional pain, relieved by rest, ST depression\" = **subendocardial ischaemia**, not infarction or spasm (QZ1). \"ST elevation that resolves, no enzyme rise\" = Prinzmetal.\n\n*Source: CL p12–16; QZ1, QZ5*", "priority": 3}, {"id": "1.2.4", "title": "Sudden cardiac death", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** SCD is unexpected cardiac death with no symptoms or within **1 hour** of symptoms. It is usually a **fatal ventricular arrhythmia**.\n\n- The most common cause is acute ischaemia; **90%** have severe pre-existing coronary atherosclerosis\n- Less common causes are **mitral valve prolapse, cardiomyopathy and cocaine**\n- There is often **no infarct at autopsy**, because death comes before necrosis is visible (<4 h, see 1.3.6)\n\n**Remember:** A diabetic who dies within an hour of chest pain with no infarct at autopsy has **sudden cardiac death from arrhythmia** (QZ2), not a missed subendocardial MI.\n\n*Source: CL p37*", "priority": 2}, {"id": "1.2.5", "title": "Chronic IHD", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Chronic ischaemic damage, with or without old infarcts, gives poor myocardial function and progresses to **congestive heart failure** (ischaemic cardiomyopathy).\n\nIt fits the CQ35 pattern: an obese older patient with high LDL, a low ejection fraction and **segmental wall-motion abnormalities**.\n\n*Source: CL p38*", "priority": 1}]}, {"id": "1.3", "title": "Myocardial infarction", "intro": "", "subs": [{"id": "1.3.1", "title": "Definition and causes", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** MI is **necrosis** of cardiac myocytes. It is usually caused by rupture of an atherosclerotic plaque with thrombosis and **complete** occlusion of a coronary artery.\n\nOther causes: vasospasm (Prinzmetal), emboli, and vasculitis (e.g. **Kawasaki disease** in a child, see 1.6.5).\n\n*Source: CL p17; CR f11*", "priority": 2}, {"id": "1.3.2", "title": "Subendocardial vs transmural", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Infarction starts in the **subendocardium**, the zone most distant from the epicardial coronary arteries. It spreads outward if ischaemia continues.\n\n|  | Subendocardial | Transmural |\n| --- | --- | --- |\n| Extent | **<50%** of wall thickness | Most of the wall |\n| Usual cause | Partial/incomplete occlusion; the initial phase | Continued or severe ischaemia; total occlusion |\n| ECG | **ST depression** | **ST elevation** (STEMI) |\n\n**EXAM TRAP:** ST depression appears in stable angina, unstable angina **and** subendocardial MI. Only the **enzymes** (troponin) separate infarction from angina.\n\n*Source: CL p19; CR f12–13*", "priority": 2}, {"id": "1.3.3", "title": "Coronary territories", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** MI almost always affects the **left ventricle**; the RV and both atria are generally spared.\n\n| Artery occluded | LV territory infarcted | Frequency |\n| --- | --- | --- |\n| **LAD** (anterior interventricular) | **Anterior wall + anterior septum** | Most common, **45%** |\n| **RCA** | **Posterior wall, posterior septum, papillary muscles** | 2nd most common |\n| Left circumflex | Lateral wall | — |\n\n**Remember:** \"Total LAD occlusion → which region?\" The answer is the **anterior septum**. The **posterior** wall is the RCA (QZ4). RCA infarcts are the ones linked to papillary muscle injury.\n\n**Image:** A coronary map of the heart, colour-coded by territory.\n\n*Source: CL p21*", "priority": 3}, {"id": "1.3.4", "title": "Clinical picture and biomarkers", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The pain is severe and crushing, lasts **>20 min**, radiates to the left arm or jaw, comes with sweating and dyspnoea, and is **not relieved by nitroglycerin**.\n\n| Marker | Rises | Peaks | Normal again | Use |\n| --- | --- | --- | --- | --- |\n| **Troponin I** | 2–4 h | 24 h | **7–10 days** | **Most sensitive and specific** (as taught in this course) |\n| **CK-MB** | 4–6 h | 24 h | **72 h** | **Detects reinfarction** days after the first MI |\n\n**Why CK-MB for reinfarction:** Troponin is still raised for a week after the first MI, so a new rise cannot be seen. CK-MB is back to normal by 72 h, so a fresh rise means **new** necrosis (QZ6).\n\n**EXAM TRAP:** \"The most specific and sensitive marker\" is troponin I, not CK-MB or myoglobin (QZ10).\n\n[COURSE] Treatment, in one line: aspirin/heparin, O₂, nitrates, β-blocker, ACE inhibitor, and fibrinolysis or angioplasty (CL p24).\n\n*Source: CL p22–24*", "priority": 3}, {"id": "1.3.5", "title": "Reperfusion injury and contraction-band necrosis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Restoring flow to **irreversibly** damaged myocytes lets **calcium** flood in → hypercontraction of myofibrils → **contraction-band necrosis**. Returning O₂ and inflammatory cells also generate **free radicals**, which injure myocytes further (reperfusion injury).\n\n**Image:** H&E showing dense, hypereosinophilic transverse bands across myocytes.\n\n**EXAM TRAP:** Contraction bands mean **reperfusion** (after fibrinolysis or angioplasty; QZ8). They are also seen with **cocaine** in a young man who dies suddenly (CQ28). They are **not** a marker of a 3-hour infarct without reperfusion.\n\n*Source: CL p25; CR f22*", "priority": 2}, {"id": "1.3.6", "title": "The time course: master table", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Learn one row per time point, reading across: gross → microscopic → complication.\n\n| Time | Gross | Microscopic | Complication |\n| --- | --- | --- | --- |\n| **<4 h** | None | **None** | Cardiogenic shock (massive infarct), CHF, **arrhythmia** |\n| **4–24 h** | **Dark** discoloration | **Coagulative necrosis** | **Arrhythmia** |\n| **1–3 days** | **Yellow pallor** | **Neutrophils** | **Fibrinous pericarditis** (chest pain + friction rub) |\n| **4–7 days** | Yellow pallor | **Macrophages** | **Rupture**: free wall → tamponade; septum → shunt; papillary muscle → mitral insufficiency |\n| **1–3 weeks** | **Red border** as granulation tissue enters from the edge | **Granulation tissue** (plump fibroblasts, collagen, blood vessels) | — |\n| **Months** | **White scar** | **Fibrosis** | **Ventricular aneurysm, mural thrombus, Dressler syndrome** |\n\n[CLARIFICATION] The complication column gives the complication **characteristic** of each period, as taught. Not every patient develops it. For example, fibrinous pericarditis at 1–3 days is a course and exam association, not a finding in every MI.\n\nMemory line (CL p28): **Coagulative necrosis (day) → Neutrophils → Macrophages (week) → Granulation tissue → Scar (month).**\n\n**Why rupture peaks at 4–7 days:** Macrophages are clearing the dead muscle, and no collagen has been laid down yet. The wall is at its softest.\n\n**Remember:**\n\n- \"Day 3 histology\" = **myofibre necrosis with neutrophils** (CQ2). Capillaries with macrophages is later.\n- \"1–3 weeks\" = **granulation tissue with new vessels** (QZ9). A dense collagen scar is months.\n- \"Within the first 24 h, the most likely complication\" = **arrhythmia** (CQ29).\n- Bloody pericardial fluid and hypotension on **day 4** → free-wall rupture. The histology then is **necrosis with neutrophils and macrophages** (CQ30).\n- An old MI with a low EF and a fibrous scar on H&E → **LV aneurysm** (CQ49).\n\n**Image:** Six-panel strip of H&E (coagulative necrosis → neutrophils → macrophages → granulation tissue → scar) above matching gross slices.\n\n*Source: CL p27–36; QZ7, QZ9; CQ2, 29, 30, 49*", "priority": 3}, {"id": "1.3.7", "title": "Mechanical complications", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Three ruptures, three presentations:\n\n| Rupture | Result | Clue in the stem |\n| --- | --- | --- |\n| **Papillary muscle** | Acute **mitral regurgitation** | New holosystolic murmur, pulmonary oedema (QZ50) |\n| **Interventricular septum** | L→R shunt → RV overload, acute cor pulmonale | New murmur, right heart strain |\n| **LV free wall** | **Haemopericardium → cardiac tamponade** | Sudden hypotension, muffled heart sounds, bloody pericardiocentesis |\n\nLate complications (months): **ventricular aneurysm** (thin, bulging scar, often apical); **mural thrombus** → systemic emboli; **Dressler syndrome** (post-MI fibrinous pericarditis, see Lecture 2).\n\n**Image:** Gross photographs of a ruptured papillary muscle, a free-wall rupture, and an apical aneurysm with mural thrombus.\n\n*Source: CL p32–36*", "priority": 3}]}, {"id": "1.4", "title": "Hypertension, arteriolosclerosis and hypertensive heart disease", "intro": "", "subs": [{"id": "1.4.1", "title": "Definitions and classification", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Systemic HTN is **≥140/90 mmHg**. **Essential (primary) HTN is 95%** of cases and has no identifiable cause. Secondary HTN is 5%.\n\n- Systemic HTN is a major risk factor for **atherosclerosis, CHF and renal failure**\n- Pulmonary HTN leads to **right ventricular failure**. **[COURSE THRESHOLD]** The faculty lecture defines it as a mean pulmonary artery pressure **>25 mmHg** at rest (>30 on exercise). [CLARIFICATION] This is the historical definition used in the course; current haemodynamic definitions use a lower threshold. Use the course figure in this exam.\n\nCauses of secondary HTN:\n\n| Group | Examples |\n| --- | --- |\n| Renal (the largest group) | Glomerulonephritis, chronic renal failure, polycystic kidney, pyelonephritis, diabetic nephropathy, renin-secreting tumours |\n| Endocrine | Cushing, hyperaldosteronism, phaeochromocytoma, acromegaly, thyroid disease, oral contraceptives, pregnancy |\n| Cardiovascular | **Coarctation of the aorta** (upper-body HTN), **polyarteritis nodosa** |\n| Neurological | Raised intracranial pressure, acute stress |\n\n[COURSE] Essential HTN is multifactorial: genetic factors, race, salt, obesity and stress (VL p54–55). The final common pathway is raised peripheral vascular resistance and/or cardiac output (VL p59).\n\n**Remember:** \"The most common type of HTN\" is **essential**, not renal artery stenosis or phaeochromocytoma (VR Q12).\n\n*Source: VL p49–56*", "priority": 1}, {"id": "1.4.2", "title": "Benign vs malignant hypertension", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Malignant HTN is a **rapid, marked rise in blood pressure**. **[COURSE THRESHOLD]** The faculty lecture uses **≥200/120 mmHg**. It causes **papilloedema, retinal haemorrhages, hypertensive encephalopathy and renal failure**, and is fatal within about 2 years if untreated.\n\n|  | Benign HTN | Malignant HTN |\n| --- | --- | --- |\n| BP | Moderate, rising slowly over years | ≥200/120, rising fast |\n| Course | Long, asymptomatic, until MI or stroke | Emergency |\n| Arteriolar lesion | **Hyaline arteriolosclerosis** | **Hyperplastic (onion-skin)** + **necrotising arteriolitis** |\n| Kidney | **Benign nephrosclerosis** | **Malignant nephrosclerosis** |\n\n*Source: VL p53; VR Q13*", "priority": 2}, {"id": "1.4.3", "title": "The three arteriolar lesions", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Hyaline = **benign HTN or diabetes**. Onion-skin and fibrinoid necrosis = **malignant HTN**.\n\n| Lesion | Cause | Mechanism | Microscopy |\n| --- | --- | --- | --- |\n| **Hyaline arteriolosclerosis** | Ageing, **benign HTN**, **diabetes** | HTN: chronic stress pushes plasma proteins into the wall. **Diabetes: non-enzymatic glycosylation of basement membrane → leaky → protein leak** | Homogeneous **pink hyaline** thickening; narrow lumen |\n| **Hyperplastic arteriolosclerosis** | **Malignant HTN** | Endothelial injury → SMC proliferation + basement-membrane reduplication | **\"Onion-skin\"** concentric layers of SMC |\n| **Necrotising arteriolitis** | Severe/malignant HTN | Sudden pressure rise tears the wall | **Fibrinoid necrosis** + neutrophils in the adventitia |\n\n**EXAM TRAPS:**\n\n- A diabetic with HTN and pink, thickened arterioles on renal biopsy = **hyaline** arteriolosclerosis (VR Q36). The diabetic mechanism is **glycosylation**, not immune complexes (VR Q16).\n- \"Concentric intimal thickening\" of arterioles = **hyperplastic**, the lesion of a **hypertensive emergency** (CQ13).\n\n**Image:** Side-by-side H&E: pink hyaline arteriole vs onion-skin arteriole vs fibrinoid necrosis.\n\n*Source: VL p63–67*", "priority": 3}, {"id": "1.4.4", "title": "The kidney in hypertension", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Benign = **small, finely granular \"leather-grain\"** kidneys. Malignant = **\"flea-bitten\"** kidneys with pinpoint petechiae.\n\n|  | Benign nephrosclerosis | Malignant nephrosclerosis |\n| --- | --- | --- |\n| Gross | Both kidneys small; adherent capsule; finely granular cortex | Pure form: enlarged, **flea-bitten** (ruptured arterioles/capillaries). If superimposed on benign HTN: small |\n| Vessels | Hyaline arteriolosclerosis | **Fibrinoid necrosis + onion-skin** |\n| Parenchyma | Glomerulosclerosis, tubular atrophy, fine interstitial fibrosis | Ischaemic tubular loss, infarcts |\n\n**Remember:** A woman dies of a basal-ganglia haemorrhage. She has a 550 g heart, **80 g scarred kidneys** and **concentric intimal thickening** of arterioles. This is malignant HTN on long-standing HTN (**hypertensive emergency**, CQ13). The small kidney does not rule out malignant change.\n\n*Source: VL p68–72; VR Q14–15*", "priority": 2}, {"id": "1.4.5", "title": "Hypertensive heart disease", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Pressure overload → **concentric left ventricular hypertrophy**: a thick wall and a small cavity. Microscopy shows enlarged myocytes with interstitial fibrosis. It progresses to **left heart failure**.\n\n**Why it matters:** The cardiac lectures list hypertensive heart disease as one of the **five major types of heart disease** (CL p2), but the detail is taught in the vascular lecture. Untreated HTN (175/110) is at greatest risk of **LVH** (CQ42). A cross-section of a heart with a thick LV wall and a small cavity in a man with orthopnoea = **essential hypertension** (CQ47).\n\n**EXAM TRAP:** **Concentric** LVH = pressure overload (HTN, aortic stenosis). **Eccentric** hypertrophy with dilation = volume overload (aortic regurgitation). See Lecture 2.\n\n**Image:** A transverse slice of the heart showing a thick, concentric LV wall with a slit-like cavity.\n\n*Source: VL p61–62; CL p2*", "priority": 2}, {"id": "1.4.6", "title": "Brain and retina", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** HTN in the brain gives **intracerebral haemorrhage** (basal ganglia), lacunar infarcts, subarachnoid haemorrhage and hypertensive encephalopathy. In the retina it gives arteriolar thickening, exudates, haemorrhages and **papilloedema** in severe HTN.\n\n**Remember:** The typical retinal finding of malignant HTN is **papilloedema with haemorrhages**, not a cherry-red spot or Hollenhorst plaques (VR Q13).\n\n*Source: VL p73*", "priority": 1}]}, {"id": "1.5", "title": "Aortic dissection and aneurysms", "intro": "", "subs": [{"id": "1.5.1", "title": "Aortic dissection: definition and the two requirements", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** An **intimal tear** lets blood dissect **through the media** of the aortic wall. It needs **(1) high wall stress**, which is why it happens in the **proximal 10 cm** of the aorta, **plus (2) pre-existing weakness of the media**.\n\n**Remember:** The \"two key requirements\" are **high wall stress + medial weakness**. They are not infection, vasculitis or low BP (VR Q18).\n\n*Source: VL p94–95*", "priority": 2}, {"id": "1.5.2", "title": "Why the media is weak: cause depends on age", "label": "COURSE + EXAM", "md": "| Patient | Cause | Mechanism of medial weakness |\n| --- | --- | --- |\n| **Older adult** (most common) | **Hypertension** | **Hyaline arteriolosclerosis of the vasa vasorum** → less flow to the media → **medial atrophy** |\n| **Young adult** | **Marfan syndrome** (fibrillin-1 mutation; fibrillin is the scaffold for elastic fibres) or **Ehlers–Danlos** (defective collagen synthesis) | Weak connective tissue → **cystic medial degeneration (necrosis)** |\n\n**Cystic medial degeneration:** fragmented elastic fibres, with spaces that look like cysts but are filled with **proteoglycans**. On an elastic stain, the regular black layers are broken up.\n\n**EXAM TRAPS:**\n\n- HTN weakens the media through the **vasa vasorum**, not by lipid deposition (VR Q19).\n- Tearing chest pain, normal troponin, sudden death, and an aorta with elastin fragmentation and proteoglycan-filled spaces = **cystic medial degeneration** (VR Q38).\n- A tall young woman with MVP, **aortic-root dilation** and a **dislocated lens** = **fibrillin** mutation (CQ5).\n\n**Image:** An elastic stain of Marfan media next to normal media.\n\n*Source: VL p96–99*", "priority": 3}, {"id": "1.5.3", "title": "Clinical picture and complications", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Sudden **sharp, tearing chest pain radiating to the back**. In **proximal** dissection, a major immediate cause of death is **haemopericardium with cardiac tamponade**, as blood tracks back into the pericardial sac. The faculty lecture lists tamponade as the **most common cause of death**.\n\n- Other complications: **rupture** with fatal haemorrhage; **obstruction of branch arteries**, e.g. coronary (MI), carotid (stroke), renal\n- Classic stem (CQ1): an older hypertensive with tearing pain to the back, a **widened mediastinum**, unremarkable heart sounds and only a slightly raised CK\n- Dissection of the aortic root can also cause **aortic regurgitation** (CL p79–80)\n\n**Remember:** \"Most lethal immediate cause of death\" = **tamponade** (VR Q21), not coronary thrombosis.\n\n**Image:** Gross photograph of an opened pericardial sac full of clotted blood (haemopericardium), and a dissected aorta with a false lumen.\n\n*Source: VL p100–101*", "priority": 2}, {"id": "1.5.4", "title": "Aneurysm: definition and classification", "label": "COURSE", "md": "**HIGH-YIELD FACT:** An aneurysm is a **localised abnormal dilation of a blood vessel or of the heart**. It may be congenital or acquired, and is most common in the aorta and its main branches.\n\n| Classify by | Types |\n| --- | --- |\n| Wall | **True** = all layers of the wall (or thinned heart wall, e.g. a post-MI LV aneurysm). **False (pseudoaneurysm)** = a breach in the wall → extravascular haematoma with a fibrous wall, usually after trauma |\n| Shape | **Saccular** (spherical outpouching), **fusiform** (spindle), cylindrical, serpentine, racemose |\n| Mechanism | **Atherosclerotic** (most common), **syphilitic**, dissecting, **mycotic** (infection, e.g. from endocarditis emboli), **berry** (circle of Willis) |\n\n*Source: VL p103–108*", "priority": 1}, {"id": "1.5.5", "title": "Thoracic aortic aneurysm: syphilis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The classic cause is **tertiary syphilis**. **Endarteritis of the vasa vasorum** starves the aortic media, which scars. The intima wrinkles into a **\"tree-bark\"** pattern.\n\nMajor complication: **dilation of the aortic root → aortic valve regurgitation** (a diastolic murmur). Others: compression of mediastinal structures (airway, oesophagus) and thrombosis/embolism.\n\n**EXAM TRAP:** An elderly man with a diastolic murmur, dilated thoracic aorta, **positive treponemal test** and narrowed vasa vasorum with disrupted medial elastic fibres = **tertiary syphilis** (CQ38; VR Q22, Q39, Q49). The mechanism is endarteritis, **not** cystic medial degeneration and **not** a mycotic aneurysm.\n\n**Image:** Normal aortic intima next to tree-bark aorta (gross).\n\n*Source: VL p111–112*", "priority": 2}, {"id": "1.5.6", "title": "Abdominal aortic aneurysm: atherosclerosis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** AAA is caused by **atherosclerosis**. It forms **below the renal arteries and above the bifurcation**, because the **vasa vasorum stop at the renal level**: the thick atheromatous intima there starves the media, which atrophies.\n\n- Classic patient: **male smoker >60 years with HTN** and a **pulsatile abdominal mass** that grows with time\n- Major complication: **rupture**. The risk rises with diameter; **[COURSE THRESHOLD]** the faculty uses **>5 cm** as the exam cut-off. Rupture triad: **hypotension + pulsatile abdominal mass + flank pain**\n- Others: compression (e.g. ureter), thrombosis/embolism (reduced leg pulses)\n\n**Remember:** In the stem (CQ8), a 65-year-old with severe abdominal pain, a pulsatile mass, low leg pulses and normal CK has an **atherosclerotic aortic aneurysm**. Long-standing diabetes is there to point at atherosclerosis. AAA is most strongly associated with **atherosclerosis**, not syphilis (VR Q48).\n\n*Source: VL p113–115*", "priority": 2}, {"id": "1.5.7", "title": "Comparison: dissection vs TAA vs AAA", "label": null, "md": "|  | Aortic dissection | Syphilitic TAA | AAA |\n| --- | --- | --- | --- |\n| Site | Proximal 10 cm | Thoracic (ascending/arch) | Infrarenal |\n| Cause | HTN (old); Marfan/EDS (young) | Tertiary syphilis | Atherosclerosis |\n| Key lesion | Intimal tear; medial weakness | Vasa vasorum endarteritis; tree-bark | Atheroma; medial atrophy |\n| Signature presentation | Tearing pain to back; widened mediastinum | Aortic regurgitation | Pulsatile mass; rupture risk rises with size (course cut-off >5 cm) |\n| Cause of death | **Tamponade** | AR/heart failure; rupture | **Rupture** |", "priority": 1}]}, {"id": "1.6", "title": "Vasculitis", "intro": "This is the **single most-examined topic** in the course: 25 previous questions. Almost every question is a clinical vignette. The fastest route to the answer is: **vessel size → patient → one signature clue**.", "subs": [{"id": "1.6.1", "title": "What vasculitis does", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Vasculitis is inflammation of the vessel wall (artery or vein). It is **mostly immune-mediated; infection is rare**.\n\n- **Early:** inflammation and necrosis weaken the wall → **aneurysm**\n- **Late:** healing fibrosis narrows the lumen → **ischaemia**\n- Damaged endothelium also exposes tissue factor and collagen → **thrombosis**\n\nClinically, expect **non-specific constitutional symptoms** (fever, fatigue, weight loss, myalgia) **plus ischaemia** of the organs the vessels supply.\n\n*Source: VL p3–5*", "priority": 1}, {"id": "1.6.2", "title": "Classification by vessel size", "label": "COURSE + EXAM", "md": "| Large vessel (aorta + major branches) | Medium vessel (muscular arteries to organs) | Small vessel (arterioles, capillaries, venules) |\n| --- | --- | --- |\n| **Giant cell (temporal) arteritis** | **Polyarteritis nodosa** | **Granulomatosis with polyangiitis (GPA; formerly Wegener)** |\n| **Takayasu arteritis** | **Kawasaki disease** | **Microscopic polyangiitis** |\n|  | **Buerger disease** | **Eosinophilic granulomatosis with polyangiitis (EGPA; formerly Churg–Strauss)** |\n|  |  | **IgA vasculitis (formerly Henoch–Schönlein purpura)** |\n\n**Remember:** \"Small-vessel vasculitis is seen in\" → **microscopic polyangiitis**, not GCA, Takayasu or PAN (VL p38). \"Medium-vessel vasculitis\" → **PAN**, not temporal arteritis or HSP (VL p45).\n\n**Image:** Diagram of vessel sizes with each disease placed on its vessel (redrawn from VL p6–7).", "priority": 2}, {"id": "1.6.3", "title": "Giant cell (temporal) arteritis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The classic exam pattern is an **older woman (average age 72)** with **new headache, jaw claudication or visual disturbance** and a **markedly raised ESR (often >100)**. Start **corticosteroids immediately** to prevent **blindness** (ophthalmic artery). **The biopsy must not delay treatment.**\n\n- Affects **branches of the carotid artery**: temporal (headache, tender cord-like temple), ophthalmic (vision), jaw arteries (claudication)\n- Often with **polymyalgia rheumatica** (joint and muscle pain, flu-like illness)\n- **Biopsy:** **granulomatous** inflammation with **giant cells** at a fragmented internal elastic lamina, and intimal fibrosis\n- The lesions are **segmental**, so take a **long segment**. **A negative biopsy does not exclude GCA**\n\n**EXAM TRAPS:**\n\n- \"Best next step\" = **start high-dose steroids now**. Do **not** delay for the biopsy (VR Q1).\n- The most feared complication is **blindness** (VR Q2).\n- \"All true EXCEPT\" → \"most commonly involves the **abdominal aorta**\" is **false** (VL p46).\n- In CQ33, a 74-year-old man with a tender temple and giant cells on biopsy → the expected lab is **ESR 110 mm/h**, not ANCA or anti-dsDNA.\n\n**Image:** H&E of the temporal artery with giant cells; an elastic stain showing a broken internal elastic lamina.\n\n*Source: VL p9–12*", "priority": 3}, {"id": "1.6.4", "title": "Takayasu arteritis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A \"GCA\" in a **young (<50) Asian woman**, affecting the **aortic arch at the branch points**. It gives **weak or absent upper-limb pulses** (\"pulseless disease\"), with visual and neurological symptoms.\n\nIt shares GCA's granulomatous histology, **raised ESR** and steroid treatment.\n\n|  | GCA | Takayasu |\n| --- | --- | --- |\n| Age | Old (avg 72) | Young (<50), Asian female |\n| Vessel | Carotid branches (temporal) | Aortic arch branch points |\n| Signature | Headache, jaw claudication, blindness | Absent arm pulses |\n\n*Source: VL p13*", "priority": 2}, {"id": "1.6.5", "title": "Polyarteritis nodosa", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A **necrotising** medium-vessel vasculitis in many organs that **spares the lungs**. It is linked to **HBsAg** (hepatitis B).\n\n| Artery involved | Result |\n| --- | --- |\n| Renal | **Hypertension** (PAN is also a cause of secondary HTN) |\n| Mesenteric | Abdominal pain with melaena |\n| CNS | Neurological disturbance |\n| Skin | Skin lesions |\n\n- **\"String of pearls\"** on angiography: **lesions of different ages in the same artery**. Early fibrinoid necrosis → aneurysm; late fibrosis → narrowing\n- Treat with **corticosteroids + cyclophosphamide**; it is fatal if untreated\n\n**Remember:** \"Does not involve / most often spares\" = the **pulmonary** circulation (VL p44; VR Q42). Microscopic polyangiitis, GPA and EGPA all involve the lung.\n\n*Source: VL p14–17*", "priority": 2}, {"id": "1.6.6", "title": "Kawasaki disease", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** An **Asian child under 4** with **fever >5 days**, an extremely irritable child, **conjunctivitis** (sparing the area next to the iris), **erythematous rash of palms, soles and mucosa (strawberry tongue)** and **enlarged cervical nodes**. Its other name is **mucocutaneous lymph node syndrome**.\n\n- It targets the **coronary arteries** → **thrombosis with MI** (a 3-year-old with an MI) or **aneurysm with rupture**\n- Treat with **aspirin** (prevents thrombosis) **+ IVIG**; it is self-limited\n\n**Remember:** Children with viral illness are **not** given aspirin because of **Reye syndrome** (encephalopathy + liver necrosis). **Kawasaki is the exception** (VL p21). The artery responsible for Kawasaki mortality is the **coronary** (VR Q5).\n\n*Source: VL p18–21*", "priority": 2}, {"id": "1.6.7", "title": "Buerger disease (thromboangiitis obliterans)", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A **heavy smoker** with necrotising vasculitis of the **digits** → painful **ulcers, gangrene, autoamputation** of fingers and toes. It comes with **Raynaud phenomenon** (white → blue from vasospasm → red on reflow). The treatment is **stopping smoking**.\n\n[CLARIFICATION] The inflammation is segmental and thrombosing and can extend to **adjacent veins and nerves** (VR Q7). Its histology is not described in the lecture, so do not use it in \"granulomatous\" questions (see blueprint QC-10).\n\n*Source: VL p22*", "priority": 2}, {"id": "1.6.8", "title": "The ANCA-associated trio", "label": "COURSE + EXAM", "md": "**Names:**\n\n- **GPA** = granulomatosis with polyangiitis (formerly **Wegener** granulomatosis)\n- **EGPA** = eosinophilic granulomatosis with polyangiitis (formerly **Churg–Strauss** syndrome)\n\nThe faculty slides use the older names, so expect either name in the exam.\n\n**HIGH-YIELD FACT:** All three are necrotising small-vessel vasculitides that hit the **lung** and a **second organ**. Ask two questions: **granulomas?** and **which ANCA?**\n\n|  | **GPA (Wegener)** | **Microscopic polyangiitis** | **EGPA (Churg–Strauss)** |\n| --- | --- | --- | --- |\n| Organs | **Nasopharynx + lungs + kidneys** | **Lung + kidney** (and others) | **Lung + heart** (multiple organs) |\n| Patient | Middle-aged man | — | Asthmatic |\n| Clinical | Sinusitis/nasal ulcer; haemoptysis with bilateral nodular infiltrates; haematuria (**RPGN**) | Like GPA but **no ENT disease** | **Asthma + peripheral eosinophilia** |\n| Granulomas | **Yes — large necrotising** | **No** (leukocytoclastic) | **Yes, with eosinophils** |\n| ANCA | **c-ANCA** | **p-ANCA** | **p-ANCA** |\n| Treatment | Cyclophosphamide + steroids; relapse common | Same; relapse common | — |\n\n- **c-ANCA** stains the cytoplasm away from the nucleus. **p-ANCA** stains the **perinuclear** cytoplasm. The faculty lecture states that ANCA levels **correlate with disease activity**. [CLARIFICATION] Treat this as a course statement: ANCA levels support the clinical picture but are not used alone to judge activity.\n- [SUPP] The target antigens (c-ANCA = PR3, p-ANCA = MPO) are not in the lecture.\n\n**EXAM TRAPS:**\n\n- Cough, haemoptysis, glomerulonephritis and **raised c-ANCA** → **GPA (Wegener)** (VL p42). Its most common organs are **lung and kidney** (VL p43).\n- The same picture with **no granulomas, no ENT disease and p-ANCA** → **microscopic polyangiitis** (VR Q9).\n- \"All are granulomatous EXCEPT\" → **microscopic polyangiitis** (VL p40).\n\n**Image:** A lung biopsy with a large necrotising granuloma (GPA), next to leukocytoclastic vasculitis (MPA).\n\n*Source: VL p24–31*", "priority": 3}, {"id": "1.6.9", "title": "IgA vasculitis (formerly Henoch–Schönlein purpura)", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The **most common vasculitis in children**. It is caused by **IgA immune-complex** deposition and usually follows an **upper respiratory tract infection** (mucosal IgA overproduction).\n\n- **Palpable purpura on the buttocks and legs** (palpable because the vessel wall is inflamed)\n- **GI pain and bleeding**\n- **Haematuria** from IgA nephropathy\n- It is **self-limited** but may recur; give steroids if severe\n\n**Remember:**\n\n- A 5-year-old with perivascular IgA, neutrophils, a leg rash and non-blanching purpura = **HSP** (VL p39).\n- \"Not a common cause of vasculitis in **adults**\" = **HSP** (VL p41).\n\n*Source: VL p32–34*", "priority": 2}, {"id": "1.6.10", "title": "One-page vasculitis grid", "label": "COURSE + EXAM", "md": "| Disease | Size | Classic patient | Signature clue | Histology | Lab | Treatment |\n| --- | --- | --- | --- | --- | --- | --- |\n| GCA | Large | Woman \\~72 | Headache, jaw claudication, vision | Granulomatous, giant cells, segmental | **ESR markedly raised (often >100)** | Steroids now |\n| Takayasu | Large | Asian woman <50 | Absent arm pulses | Granulomatous | ESR ↑ | Steroids |\n| PAN | Medium | Adult | Renal HTN, melaena, **lung spared** | Necrotising; lesions of different ages | **HBsAg** | Steroids + cyclophosphamide |\n| Kawasaki | Medium | Asian child <4 | Fever, strawberry tongue, nodes | — | — | Aspirin + IVIG |\n| Buerger | Medium | Heavy smoker | Digital gangrene, Raynaud | Necrotising, thrombosing | — | Stop smoking |\n| GPA (Wegener) | Small | Middle-aged man | Sinus + lung + kidney | **Necrotising granulomas** | **c-ANCA** | Cyclophosphamide + steroids |\n| Microscopic polyangiitis | Small | Adult | Lung + kidney, no ENT | **No granulomas** | **p-ANCA** | Cyclophosphamide + steroids |\n| EGPA (Churg–Strauss) | Small | Asthmatic | Asthma, eosinophilia, heart | Granulomas + eosinophils | **p-ANCA** | — |\n| IgA vasculitis (HSP) | Small | Child after URTI | Palpable purpura, buttocks/legs | IgA deposits | — | Self-limited |", "priority": 2}]}, {"id": "1.7", "title": "Vascular tumours", "intro": "**HIGH-YIELD FACT:** Benign = haemangioma. Low-grade malignant = **Kaposi sarcoma (HHV-8)**. Malignant = **angiosarcoma**.\n\n| Tumour | Behaviour | Key facts |\n| --- | --- | --- |\n| **Haemangioma** | Benign | A tumour of blood vessels; often **present at birth** and **regresses in childhood**; mostly **skin and liver**. Types: **capillary**, **cavernous** (large dilated channels) and **pyogenic granuloma** |\n| **Kaposi sarcoma** | Low-grade malignant | A vascular neoplasm **associated with HHV-8**; **purple patches, plaques and nodules** on skin (can be visceral). Three settings: **older Eastern European men** (stays in the skin), **AIDS** and **transplant recipients** (spread early) |\n| **Angiosarcoma** | Highly aggressive malignant | Endothelial malignancy of **skin, breast and liver**. **Liver angiosarcoma** is linked to **polyvinyl chloride, arsenic and Thorotrast** |\n\n**Remember:**\n\n- The virus associated with Kaposi sarcoma is **HHV-8**, not HIV itself (VR Q29). HIV only sets the stage through immunosuppression.\n- The classic liver-angiosarcoma exposure is **PVC** (plus arsenic, Thorotrast), not aflatoxin, which causes hepatocellular carcinoma (VR Q30).\n- An infant's eyelid lesion made of large vascular channels = **cavernous haemangioma** (VR Q31).\n\n**Image:** Clinical photographs of a capillary haemangioma, a pyogenic granuloma and Kaposi sarcoma plaques; H&E of cavernous haemangioma.\n\n*Source: VL p117–123*", "subs": [], "priority": 2}, {"id": "1.8", "title": "Lecture 1 in 15 facts", "intro": "1. Atherosclerosis is an **intimal** disease of large and medium arteries: **abdominal aorta > coronaries > popliteal > internal carotid**. The **fatty streak** (foam cells) is the earliest lesion.\n2. **≥75% stenosis** → stable angina (ST↓). **Plaque rupture + partial thrombus** → unstable angina/subendocardial MI. **Total occlusion** → transmural MI (ST↑).\n3. **Prinzmetal** = vasospasm, **ST elevation**, relieved by nitrates or a calcium-channel blocker.\n4. **SCD** = death within 1 h, usually arrhythmia; there may be **no infarct** at autopsy.\n5. **LAD** (45%) → anterior wall + septum. **RCA** → posterior wall, posterior septum, papillary muscles.\n6. **Troponin I** is the course's most sensitive and specific marker (normal after 7–10 days). **CK-MB** normalises by 72 h, so it detects **reinfarction**.\n7. **Contraction-band necrosis** = **reperfusion** (Ca²⁺ influx); also seen with cocaine.\n8. MI time course: **<4 h nothing → 4–24 h coagulative necrosis → 1–3 d neutrophils (pericarditis) → 4–7 d macrophages (rupture) → 1–3 wk granulation tissue → months scar (aneurysm, mural thrombus, Dressler)**.\n9. Rupture: papillary muscle → **acute MR**; septum → shunt; free wall → **tamponade**.\n10. **Hyaline** arteriolosclerosis = benign HTN/diabetes (glycosylation). **Onion-skin + fibrinoid necrosis** = malignant HTN (≥200/120; papilloedema; **flea-bitten kidney**).\n11. **HTN → concentric LVH** (hypertensive heart disease) → left heart failure.\n12. **Dissection** = intimal tear in the proximal aorta. Older patients: HTN (vasa vasorum → medial atrophy). Young: Marfan/EDS (**cystic medial degeneration**). **Death by tamponade.**\n13. **Syphilis → thoracic aneurysm** (vasa vasorum endarteritis, **tree-bark**) → aortic regurgitation. **Atherosclerosis → infrarenal AAA**; rupture risk rises with size (course cut-off >5 cm).\n14. **GCA**: old woman, markedly raised ESR (often >100), **steroids now** (blindness). **PAN** spares the lung, HBsAg. **Kawasaki**: coronary aneurysm, **aspirin + IVIG**. **IgA vasculitis (HSP)**: child, IgA, palpable purpura.\n15. **GPA (Wegener)** = granulomas + **c-ANCA** (nose, lung, kidney). **Microscopic polyangiitis** = **no granulomas** + p-ANCA. **EGPA (Churg–Strauss)** = asthma + eosinophils + p-ANCA.", "subs": [], "priority": null}], "facts": null}, {"num": 2, "title": "Structural, Valvular, Infective and Myocardial Heart Disease", "intro": {"id": "how-to-use-this-lecture", "title": "How to use this lecture", "intro": "The format is the same as Lecture 1:\n\n- **HIGH-YIELD FACT → Why → EXAM TRAP (genuine confusions only) or Remember → Image → Source**\n- Labels: [COURSE + EXAM] = faculty content that has been examined; [COURSE] = faculty content; [CLARIFICATION] = added to prevent a misunderstanding or to update terminology; [SUPP] = an additional note, collapsed, not assessable; [COURSE THRESHOLD] = a faculty number kept for the exam where current definitions differ. Priority: ★★★ MUST KNOW · ★★ HIGH-YIELD · ★ SUPPORTING\n- Source codes: CL = cardiac lectures (slide number); QZ = cardiac quiz; CQ = CVS case questions\n- Where current practice differs from the faculty teaching, the faculty value is kept and the difference is labelled, not silently replaced\n\nTwo faculty statements are corrected here, as agreed in the blueprint:\n\n- Eisenmenger causes **secondary** polycythaemia (the slide says \"polycythemia vera\")\n- Turner syndrome is taught as linked to **coarctation**, without tying it to one form", "subs": []}, "sections": [{"id": "2.1", "title": "Congenital heart disease", "intro": "", "subs": [{"id": "2.1.1", "title": "Basics and the three groups", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** CHD arises in **weeks 3–8** and affects about **1% of live births**. Most cases are sporadic (about 90% unknown cause). Known causes: **Down and Turner syndromes**, **rubella** and syphilis, drugs, **maternal diabetes** and radiation.\n\n| Group | Defects | Cyanosis |\n| --- | --- | --- |\n| **Left-to-right shunt** | VSD, ASD, PDA | **Acyanotic**, or **late cyanosis** (Eisenmenger) |\n| **Right-to-left shunt** | Tetralogy of Fallot, transposition, truncus arteriosus, tricuspid atresia | **Early cyanosis** (at or soon after birth) |\n| **Obstructive** | Coarctation, aortic stenosis, pulmonary stenosis | Depends on the lesion |\n\n**Memory aid [CLARIFICATION]:** The right-to-left group is the \"T\" lesions: **T**etralogy, **T**ransposition, **T**runcus, **T**ricuspid atresia.\n\n*Source: CL p39–42, p49*", "priority": 2}, {"id": "2.1.2", "title": "Eisenmenger syndrome", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A **long-standing left-to-right shunt** → pulmonary volume overload → **pulmonary hypertension** → RV hypertrophy → right pressure exceeds left → the shunt **reverses** to right-to-left → **late (tardive) cyanosis**.\n\nFeatures: **pulmonary hypertension**, **RV hypertrophy**, **secondary polycythaemia** (a response to hypoxaemia), **clubbing and cyanosis**.\n\n**Remember:**\n\n- The primary cause in VSD is **increased pulmonary vascular resistance**. It is **not** a right-to-left shunt \"from birth\" (QZ12).\n- A large, untreated membranous VSD in a child → in adulthood the risk is **pulmonary hypertension** (CQ17).\n\n*Source: CL p41; CR f29*", "priority": 2}, {"id": "2.1.3", "title": "The three left-to-right shunts", "label": "COURSE + EXAM", "md": "|  | VSD | ASD | PDA |\n| --- | --- | --- | --- |\n| Key fact | **Most common CHD** | **Ostium secundum = 90%** | Ductus fails to close |\n| Association | **Fetal alcohol syndrome** | **Ostium primum → Down syndrome** | **Congenital rubella** |\n| Sign | Size decides the shunt and the age at presentation; murmur | **Split S2** (extra right-heart blood delays pulmonary valve closure) | **Continuous \"machine-like\" murmur** |\n| Key complication | Large defect → **Eisenmenger** | **Paradoxical emboli** | Eisenmenger → **lower-limb cyanosis** (unoxygenated blood enters the aorta distal to the arm arteries) |\n| Treatment | Surgical closure; **small defects may close spontaneously** | — | **Indomethacin** (↓PGE → closure). PGE₁ maintains ductal patency |\n\n**EXAM TRAPS:**\n\n- A newborn with **Down syndrome** + ASD → **ostium primum** (QZ11). The commonest ASD in general is **secundum**.\n- An older man with a DVT then a **stroke**, with pulmonary hypertension on X-ray → **ASD** (paradoxical embolus, CQ27).\n- A 5-week-old baby with breathlessness and a **pansystolic murmur** → **VSD** (CQ22).\n\n**Image:** An opened heart showing a membranous VSD; an atrial septum viewed from the left atrium with a defect (as in CQ46).\n\n*Source: CL p43–48*", "priority": 3}, {"id": "2.1.4", "title": "The right-to-left shunts", "label": "COURSE + EXAM", "md": "**Tetralogy of Fallot (PROV):**\n\n- **P**ulmonary stenosis, **R**V hypertrophy, **O**verriding aorta, **V**SD\n- Right-to-left shunt → **early cyanosis**. The degree of pulmonary stenosis decides how much blood shunts and how cyanotic the child is\n- Children **squat** during a cyanotic spell: squatting raises systemic arterial resistance, so less blood shunts and more reaches the lungs\n- **\"Boot-shaped\" heart** on X-ray\n\n**Transposition of the great arteries:**\n\n- The **aorta arises from the RV** and the **pulmonary artery from the LV**\n- Linked to **maternal diabetes**\n- Early cyanosis; the two circuits do not mix, so survival **needs a shunt** (ASD, VSD or PDA). **PGE**₁ maintains ductal patency until surgery\n- RV hypertro
