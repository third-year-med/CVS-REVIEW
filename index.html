phy, LV atrophy\n\n**Persistent truncus arteriosus:** the truncus fails to divide → a **single large vessel from both ventricles**; early cyanosis.\n\n**Tricuspid atresia:** no tricuspid orifice; **hypoplastic RV**; survival needs an **ASD** (right-to-left); early cyanosis.\n\n**EXAM TRAPS:**\n\n- A cyanotic child who **squats** = **tetralogy** (QZ13).\n- \"A single vessel from both ventricles\" = **truncus** (QZ14).\n- An 18-week fetus with VSD, overriding aorta and pulmonary atresia → at birth, expect **cyanosis** (CQ11).\n- PGE vs indomethacin: **PGE₁ maintains** ductal patency (TGA, to keep mixing). **Indomethacin closes** it (PDA).\n\n**Image:** Diagram of each lesion showing flow; gross specimen of tetralogy.\n\n*Source: CL p50–55*", "priority": 3}, {"id": "2.1.5", "title": "Coarctation of the aorta", "label": "COURSE + EXAM", "md": "|  | Infantile (preductal) | Adult (postductal) |\n| --- | --- | --- |\n| Site | After the arch, **before the PDA** | After the arch; **no PDA** |\n| Presentation | **Lower-limb cyanosis** in infancy, often at birth | **Upper-limb HTN, weak/delayed leg pulses**; found in adulthood |\n| Association | PDA | **Bicuspid aortic valve** |\n| X-ray | — | **Rib notching** (dilated intercostal collaterals) |\n\n**Turner syndrome** is associated with **coarctation of the aorta**. The faculty slide links it to the infantile form. In practice, Turner patients present with either form, so **use the clinical signs, not the syndrome, to choose the form**.\n\n**Remember:** A 17-year-old girl with short stature and a webbed neck has arm BP 165/85, cool legs with weak pulses, and **rib notching**. The lesion is narrowing of the aorta **past the ductus** — the adult form (CQ7). Coarctation is also a cause of **secondary HTN** (Lecture 1).\n\n*Source: CL p57–59*", "priority": 2}]}, {"id": "2.2", "title": "Rheumatic fever and chronic rheumatic heart disease", "intro": "", "subs": [{"id": "2.2.1", "title": "Acute rheumatic fever: cause and mechanism", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A systemic complication of **group A β-haemolytic streptococcal pharyngitis**, appearing **2–3 weeks** after the sore throat in children. It is caused by **molecular mimicry**: antibodies against the bacterial **M protein** cross-react with human tissue.\n\n**Why the delay matters:** The 2–3-week gap is the time needed to make antibodies. This is an **immune** disease, not a direct infection, so **blood cultures are negative** and the heart lesions are **sterile**.\n\n*Source: CL p61*", "priority": 2}, {"id": "2.2.2", "title": "Jones criteria", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Diagnosis = evidence of a recent group A streptococcal infection (**raised ASO or anti-DNase B**) **plus either 2 major criteria, or 1 major + 2 minor criteria**.\n\n[CLARIFICATION] The faculty slide says \"major and minor criteria\". The 2-major or 1-major + 2-minor rule is the standard Jones rule and is added here so the diagnostic threshold is explicit.\n\n| Major criteria | Minor criteria |\n| --- | --- |\n| 1. **Migratory polyarthritis** of large joints (resolves in days, moves to another joint) | **Fever** |\n| 2. **Pancarditis** | **Raised ESR** |\n| 3. **Subcutaneous nodules** | (non-specific) |\n| 4. **Erythema marginatum** (annular, non-itchy rash with red borders on the trunk and limbs) |  |\n| 5. **Sydenham chorea** (rapid involuntary movements) |  |\n\n**EXAM TRAP:** \"Which is a **major** criterion?\" → **pancarditis**. Fever and ESR are **minor**. A raised ASO is the **evidence of infection**, not a criterion (QZ17).\n\n*Source: CL p62–68*", "priority": 2}, {"id": "2.2.3", "title": "Pancarditis and the Aschoff body", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** All three layers are inflamed. **Myocarditis is the most common cause of death in the acute phase.**\n\n| Layer | Lesion |\n| --- | --- |\n| **Endocarditis** | **Mitral > aortic.** Small **vegetations along the lines of closure** → regurgitation |\n| **Myocarditis** | **Aschoff bodies**: foci of chronic inflammation, **Anitschkow cells** (reactive histiocytes with **slender, wavy \"caterpillar\" nuclei**), giant cells and fibrinoid material |\n| **Pericarditis** | Friction rub and chest pain (fibrinous) |\n\n**Remember:** The finding **most characteristic** of acute rheumatic myocarditis is **Anitschkow cells in Aschoff bodies**. Vegetations **on both sides** of the valve are Libman–Sacks (QZ16).\n\n**Image:** H&E of an Aschoff body in the myocardium, with a high-power inset of Anitschkow cells.\n\n*Source: CL p64–66*", "priority": 3}, {"id": "2.2.4", "title": "Course", "label": "COURSE", "md": "The acute attack usually resolves. **Repeated** group A strep infections cause relapses and raise the risk of **chronic rheumatic heart disease**.\n\n*Source: CL p69*", "priority": 1}, {"id": "2.2.5", "title": "Chronic rheumatic heart disease", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The valve scars into **stenosis** with a classic **\"fish-mouth\"** orifice. It **almost always involves the mitral valve**: thickened, fused leaflets with **thickened, shortened chordae tendineae**. It sometimes involves the aortic valve (**commissural fusion**). **Infective endocarditis** is a complication.\n\nThe consequences are those of **mitral stenosis** (2.3.5): **LA dilation → atrial fibrillation → LA mural thrombus → stroke**, plus pulmonary congestion.\n\n**Remember:**\n\n- A 45-year-old woman with 3 years of orthopnoea, **dysphagia** (big left atrium pressing on the oesophagus) and a recent **stroke**; the X-ray shows a **prominent left atrial border** and normal LV. This is **mitral stenosis** (CQ3).\n- An autopsy after poorly controlled **AF** and a stroke: fused mitral leaflets, short chordae, and an LA **full of thrombus**. The underlying cause is **rheumatic heart disease** (CQ9).\n- A gross photograph of a thickened, calcified mitral valve with fused chordae → the underlying cause is **group A β-haemolytic strep** (CQ45).\n\n**Image:** Fish-mouth mitral stenosis viewed from the left atrium; chordae that are thick and fused.\n\n*Source: CL p70*", "priority": 3}]}, {"id": "2.3", "title": "Valvular disease and the murmur decoder", "intro": "**Principle:** A valve either fails to open (**stenosis**) or fails to close (**regurgitation**). Stenosis causes **pressure** overload; regurgitation causes **volume** overload.\n\n*Source: CL p72*", "subs": [{"id": "2.3.1", "title": "Aortic stenosis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Usually **degenerative calcific (\"wear and tear\")** stenosis in people **>60**. A **bicuspid valve** wears out faster, so it presents earlier. Chronic RHD is a less common cause; it is identified by **commissural fusion together with mitral stenosis**.\n\n- **Murmur:** a systolic **ejection click** followed by a **crescendo–decrescendo** systolic murmur. There is a long asymptomatic phase\n- **Complications:**\n  - **Concentric LVH** → heart failure\n  - **Angina and syncope on exertion**: output cannot rise across the fixed valve\n  - **Microangiopathic haemolytic anaemia**: red cells are sheared on the calcified valve into **schistocytes**\n- **Treatment:** valve replacement once complications appear\n\n**Remember:**\n\n- A 72-year-old woman with **syncope** and pulmonary oedema, a prominent left heart border and normal cholesterol = **calcific aortic stenosis** (CQ6).\n- A 66-year-old man in CHF with a **systolic ejection click** = a **calcified bicuspid aortic valve** (CQ23).\n\n**Image:** Calcific aortic stenosis (nodular calcium in the cusps, no commissural fusion) next to a calcified bicuspid valve.\n\n*Source: CL p74–77*", "priority": 2}, {"id": "2.3.2", "title": "Aortic regurgitation", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Blood flows back from the aorta into the LV in **diastole** → **early, blowing diastolic murmur** → **volume overload** → **LV dilation with eccentric hypertrophy**.\n\n- **Causes:**\n  - **Aortic root dilation**: idiopathic, **syphilitic aneurysm** (tree bark), **aortic dissection**\n  - **Valve damage**: **infective endocarditis**\n- **Hyperdynamic circulation** from a **wide pulse pressure**: diastolic pressure falls (regurgitation) and systolic rises (larger stroke volume). Signs: **bounding/water-hammer (Corrigan) pulse**, pulsating nail beds (**Quincke**) and **head bobbing**\n\n**Remember:** Bounding pulse and head bobbing are caused by a **high pulse pressure**, not by the murmur itself (QZ19).\n\n*Source: CL p78–84*", "priority": 2}, {"id": "2.3.3", "title": "Mitral valve prolapse", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** **Myxoid degeneration** (ground substance builds up) makes the mitral valve floppy, so it **balloons into the left atrium in systole**. The cause is usually unknown; it is seen in **Marfan and Ehlers–Danlos syndromes**.\n\n- Usually asymptomatic: an incidental **mid-systolic click** followed by a regurgitant murmur\n- Rare complications: **infective endocarditis, arrhythmia, severe mitral regurgitation**. MVP is also a listed cause of **sudden cardiac death**\n\n**Remember:**\n\n- A young adult with a **mid-systolic click** → **MVP** (QZ18). A photograph of a ballooned, hooded mitral leaflet → the underlying disease is **Marfan syndrome** (CQ52).\n- MVP + aortic root dilation + a **dislocated lens** + ruptured chordae → **fibrillin** mutation (CQ5).\n\n**Image:** A myxomatous mitral valve with a ballooned leaflet, viewed from the left atrium.\n\n*Source: CL p86–87*", "priority": 2}, {"id": "2.3.4", "title": "Mitral regurgitation", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Blood refluxes from the LV into the LA in **systole** → a **holosystolic \"blowing\" murmur** → volume overload → left heart failure.\n\n- **Causes:** most often a complication of **MVP**. Also LV dilation (left heart failure), infective endocarditis, acute rheumatic heart disease, and **papillary muscle rupture after MI**\n- The murmur is **louder with squatting** (raised systemic resistance) and on **expiration** (more return to the left atrium)\n\n**Remember:** A new murmur with acute MR a few days after MI = **papillary muscle rupture** (QZ50). This links back to Lecture 1.\n\n*Source: CL p88–89*", "priority": 1}, {"id": "2.3.5", "title": "Mitral stenosis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** It is usually due to **chronic rheumatic heart disease**. It gives an **opening snap followed by a diastolic rumble**.\n\nThe LA dilates and causes:\n\n1. **Pulmonary congestion**, with oedema and alveolar haemorrhage\n2. **Pulmonary hypertension** → eventual **right heart failure**\n3. **Atrial fibrillation** → **LA mural thrombus** → **systemic thromboembolism** (stroke)\n\nThe enlarged LA can press on the oesophagus and cause dysphagia (CQ3). **The LV is normal-sized**, because it is protected behind the stenosis.\n\n*Source: CL p90–91*", "priority": 2}, {"id": "2.3.6", "title": "The murmur decoder", "label": "COURSE + EXAM", "md": "| Lesion | Timing | Sound | Chamber effect | Main cause |\n| --- | --- | --- | --- | --- |\n| **Aortic stenosis** | Systolic | **Ejection click + crescendo–decrescendo** | **Concentric** LVH | Calcific (>60 y); bicuspid |\n| **Aortic regurgitation** | Diastolic (early) | **Blowing**; wide pulse pressure | LV dilation, **eccentric** hypertrophy | Root dilation (syphilis, dissection); IE |\n| **Mitral valve prolapse** | Systolic (mid) | **Mid-systolic click** ± late murmur | — | Myxoid degeneration; Marfan |\n| **Mitral regurgitation** | Systolic (whole) | **Holosystolic blowing** | LA + LV volume overload | MVP; post-MI papillary rupture |\n| **Mitral stenosis** | Diastolic (mid) | **Opening snap + diastolic rumble** | **LA dilation**, normal LV | Chronic RHD |\n| **VSD** | Systolic | Pansystolic | — | Congenital |\n| **PDA** | Continuous | **Machine-like** | — | Congenital (rubella) |\n| **ASD** | — | **Split S2** | Right-heart volume load | Congenital |\n\n**Remember:** A crescendo–decrescendo systolic murmur is AS. A **diastolic rumble** is MS. An **opening snap** is MS. A **continuous machinery murmur** is PDA (QZ20 distractors).", "priority": 2}]}, {"id": "2.4", "title": "Endocarditis", "intro": "This is the **most-examined cardiac topic** (19 previous questions). Most questions give a clinical setting and ask for the organism, the vegetation type, or the sign.", "subs": [{"id": "2.4.1", "title": "Four kinds of vegetation", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Endocarditis is inflammation of the endocardium lining the valves, usually from bacteria. The **non-infective** types are rheumatic, **Libman–Sacks (SLE)** and **NBTE (marantic)**.\n\n| Type | Vegetation | Where on the valve | Setting | Destroys the valve? |\n| --- | --- | --- | --- | --- |\n| **Rheumatic** (acute RF) | **Small, warty**, inflammatory | Along the **lines of closure** | 2–3 wk after strep throat | No, but scars later |\n| **Infective** | **Large, irregular, friable** masses | Can spread onto chordae and myocardium | Bacteraemia ± damaged valve | **Yes** |\n| **NBTE (marantic)** | Small–medium, **bland** | Line of closure | **Hypercoagulable state / adenocarcinoma** (e.g. pancreas) | No, but they **embolise** |\n| **Libman–Sacks** | Small–medium, inflammatory | **Either side** of the leaflet | **SLE** (ANA, anti-dsDNA, anti-Smith) | No; heals with scarring |\n\n**EXAM TRAPS:**\n\n- SLE with **vegetations on both sides** of the mitral valve / **sterile** vegetations = **Libman–Sacks** (QZ22, QZ47; CQ10, CQ40).\n- Pancreatic adenocarcinoma, **negative cultures**, stroke = **NBTE** (CL p113; CQ25). A brain tumour patient with **thromboembolism** in the lungs, spleen and kidney → **mitral marantic vegetations** (CQ43).\n- A young woman with arthritis, rash, GN, negative cultures and positive ANA/anti-dsDNA → **Libman–Sacks** (CL p112).\n\n**Image:** Four gross valves side by side showing the four vegetation types.\n\n*Source: CL p93–95, p112–113*", "priority": 3}, {"id": "2.4.2", "title": "Acute vs subacute infective endocarditis", "label": "COURSE + EXAM", "md": "|  | Acute | Subacute |\n| --- | --- | --- |\n| Organism | **Highly virulent**: **S. aureus** | **Low virulence**: **Strep. viridans** |\n| Valve | **Normal** valves | **Previously damaged** valves (chronic RHD, MVP, CHD) |\n| Vegetations | **Large, destructive**, necrotising, ulcerating; ring abscess | **Small**; do not destroy the valve |\n| Course | Death in days to weeks in \\~50%, despite treatment | Slow; **anaemia of chronic disease** |\n\n*Source: CL p96, p99, p102*", "priority": 2}, {"id": "2.4.3", "title": "Organism by setting", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Match the organism to the patient's story.\n\n| Clue in the stem | Organism | Note |\n| --- | --- | --- |\n| Most common overall; **dental** work; previously **damaged valve** | **Streptococcus viridans** | Subacute |\n| **IV drug user** | **Staphylococcus aureus** | **Tricuspid** valve; acute, destructive |\n| **Prosthetic valve** | **Staphylococcus epidermidis** |  |\n| **Colorectal carcinoma** | **Streptococcus bovis** | Look for the colon cancer |\n| **Culture-negative** | **HACEK** (Haemophilus, Aggregatibacter (formerly Actinobacillus), Cardiobacterium, Eikenella, Kingella) |  |\n\n**Remember:**\n\n- IVDU with fever, murmur and *S. aureus* → the **tricuspid** valve (QZ23). **Rapidly progressive right-sided failure** in an IVDU → **tricuspid insufficiency** (CL p115).\n- A delirious patient with fever, murmur, splinters and hypotension → expect a **positive urine screen for opiates** (the IVDU is the clue, CQ24). A patient with needle tracks → **blood culture positive for *S. aureus*** (CQ16).\n- Colon cancer + endocarditis → ***S. bovis*** (QZ21).\n- An IVDU with fever and a **stroke** (septic embolus) → **bacterial endocarditis** (CL p114).\n- Tooth extraction → subacute IE on a **pre-existing lesion**. In CQ31, the widely split S2 and diastolic rumble point to an **ASD**.\n\n*Source: CL p99–103, p114–115*", "priority": 3}, {"id": "2.4.4", "title": "Predisposing factors and pathogenesis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A **damaged endocardial surface** grows a sterile platelet–fibrin vegetation, and **transient bacteraemia** seeds it. The faculty slide notes that prophylactic antibiotics decrease the risk.\n\n[CLARIFICATION] Current guidance limits antibiotic prophylaxis to **selected high-risk cardiac patients** (e.g. a prosthetic valve or previous IE) undergoing **certain dental procedures**. It is **not** routine for everyone with underlying heart disease.\n\n| Predisposing group | Examples |\n| --- | --- |\n| Transient bacteraemia | **Dental/periodontal infection**, GU/GI infection, tonsillectomy, bronchoscopy |\n| Underlying heart disease | **RHD**, CHD (VSD, subaortic stenosis), myxomatous mitral valve, **prosthetic valves** |\n| Impaired host defence | Immunodeficiency, diabetes, neutropenia |\n\n*Source: CL p98, p100*", "priority": 1}, {"id": "2.4.5", "title": "Vegetation microscopy", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Three zones:\n\n1. An outer **eosinophilic cap** of **fibrin and platelets**\n2. A **basophilic zone of bacterial colonies**\n3. A deeper zone of **non-specific inflammatory cells**\n\n**Remember:** The answer is \"zones of **platelets, bacteria and inflammatory cells**\", not granulomas or caseation (QZ25).\n\n**Image:** H&E of a vegetation with the three zones labelled.\n\n*Source: CL p101*", "priority": 2}, {"id": "2.4.6", "title": "Clinical features, labs and complications", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** **Fever + a new murmur + emboli.**\n\n| Feature | Detail |\n| --- | --- |\n| **Osler nodes** | **Painful**, tender nodules on the finger pulps |\n| **Janeway lesions** | **Painless** lesions on the **palms and soles** (septic emboli) |\n| **Roth spots** | Retinal haemorrhages |\n| **Splinter haemorrhages** | Subungual, from emboli to skin capillaries |\n| Others | Petechiae (skin, conjunctiva); **painful splenomegaly**; immune-complex **glomerulonephritis** |\n| Labs | **Positive blood cultures**; **anaemia of chronic disease** (↓Hb, ↓MCV, **↑ferritin**, ↓TIBC, ↓iron); **transoesophageal echo** shows the vegetation |\n\n**Complications:**\n\n- **Cardiac:** valve stenosis or insufficiency; perforation or rupture; **ring abscess** into the myocardium; suppurative pericarditis; heart failure\n- **Extracardiac:** emboli from either side of the heart (brain → stroke; spleen; kidney); **mycotic aneurysm**\n\n**Causes of death:** heart failure, embolism, renal failure, ruptured mycotic aneurysm.\n\n**EXAM TRAP:** **Osler = Ouch** (painful). **Janeway = painless** (QZ24).\n\n**Image:** Clinical photos of splinter haemorrhages, Janeway lesions and Roth spots (fundus).\n\n*Source: CL p104–110*", "priority": 2}]}, {"id": "2.5", "title": "Cardiomyopathies", "intro": "**Principle:** Cardiomyopathies are primary myocardial diseases that cause cardiac dysfunction. Ask two questions: **can the ventricle pump (systolic)?** and **can it fill (diastolic)?**", "subs": [{"id": "2.5.1", "title": "Dilated cardiomyopathy", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** The **most common** cardiomyopathy. **All four chambers dilate** → **systolic dysfunction** (the ventricles cannot pump) → **biventricular CHF**. Complications: **mitral and tricuspid regurgitation** (from the stretched rings) and **arrhythmia**. The treatment is heart transplant.\n\n**Causes:** most are **idiopathic**. Known causes:\n\n1. **Genetic**, usually autosomal dominant. **Titin** mutations cause about **20% of DCM** (titin is the giant protein spanning the sarcomere from Z to M band)\n2. **Myocarditis**, usually **Coxsackie A or B**; DCM is a **late** complication\n3. **Alcohol**\n4. **Drugs**, e.g. **doxorubicin**\n5. **Pregnancy**: late pregnancy or weeks to months after delivery\n6. **Haemochromatosis**\n\n**EXAM TRAPS:**\n\n- Heart failure **weeks after a Coxsackie infection** → **dilated** (QZ28). The same young woman with an enlarged, poorly contracting LV and lymphocytes on biopsy → **Coxsackie B** (CQ15).\n- The most common genetic mutation in DCM = **titin** (QZ29). β-myosin heavy chain and myosin-binding protein C are the **HCM** genes.\n- A man with **haemochromatosis**, arthritis and biventricular failure → **serum ferritin 800 ng/mL** (CQ20).\n- A 58-year-old with ascites, a small cirrhotic liver and a **globally enlarged heart** → **dilated cardiomyopathy** (alcohol links the liver and the heart; CQ37).\n\n**Image:** Gross heart with four dilated chambers and a thin wall.\n\n*Source: CL p119–121, p133*", "priority": 3}, {"id": "2.5.2", "title": "Hypertrophic cardiomyopathy", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** **Autosomal dominant** mutations in **sarcomere proteins** (e.g. β-myosin heavy chain) → a thick, stiff LV → **diastolic dysfunction** (the ventricle cannot fill). **Asymmetric septal hypertrophy** can obstruct the outflow tract (**HOCM**). The biopsy shows **myofibre hypertrophy with disarray**.\n\nClinical features:\n\n1. Reduced cardiac output (poor filling)\n2. **Sudden death from ventricular arrhythmia**: a common cause of **sudden death in young athletes**\n3. **Syncope on exercise**: the subaortic septal bulge acts as a **functional aortic stenosis**\n\nTreatment: drugs that relax the ventricle; surgical reduction of the septum.\n\n**Remember:**\n\n- A young man **collapses while running**; autopsy shows asymmetric septal hypertrophy and **myofibre disarray** = **HCM** (QZ26; CQ34). With a family history of sudden death, the inheritance is **autosomal dominant** (QZ48).\n- A 17-year-old with exertional syncope, **LVH** on ECG and a hypertrophied septum → the histology is **myofibre disarray** (CQ34).\n\n**Image:** Gross heart with a massive septum and a slit-like LV cavity; H&E of disarrayed myocytes.\n\n*Source: CL p124–126*", "priority": 3}, {"id": "2.5.3", "title": "Arrhythmogenic right ventricular cardiomyopathy", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** An **autosomal dominant** disease in which the **right ventricular wall is replaced by fat** (with some fibrosis) and is severely **thinned**. It causes **right-sided heart failure and arrhythmias → sudden death**, accounting for about 10% of **sudden deaths in athletes**.\n\n**Remember:**\n\n- **RV fatty infiltration + sudden death in an athlete** = ARVC (QZ27).\n- A woman with an irregular pulse, an enlarged right heart and a **thin RV wall with reduced EF** → the cause is a **gene mutation** (CQ18).\n\n**Image:** A dilated RV with fat replacing the free wall; a Masson trichrome stain (red muscle, blue fibrosis, clear fat).\n\n*Source: CL p122–123*", "priority": 2}, {"id": "2.5.4", "title": "Restrictive cardiomyopathy", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** A **stiff, non-compliant** ventricle **restricts diastolic filling** → congestive heart failure. The classic sign is a **low-voltage ECG** (small QRS complexes).\n\n**Causes:** **amyloidosis**, **sarcoidosis**, **endocardial fibroelastosis** (children), and **Loeffler syndrome** (endomyocardial fibrosis with eosinophilic infiltrate and **eosinophilia**).\n\n**Remember:**\n\n- \"A cause of restrictive cardiomyopathy\" = **amyloidosis**, not titin or viral myocarditis, which cause DCM (QZ30).\n- A heavy heart with arrhythmia and **apple-green birefringence** on Congo red under polarised light = **cardiac amyloidosis** (CQ53).\n\n**Image:** A Congo red stain under polarised light (apple-green), next to H&E (pink amorphous material between myocytes).\n\n*Source: CL p127–131*", "priority": 2}, {"id": "2.5.5", "title": "Comparison of the four", "label": "COURSE + EXAM", "md": "|  | Dilated | Hypertrophic | ARVC | Restrictive |\n| --- | --- | --- | --- | --- |\n| Chambers | **All four dilated** | Thick LV, **asymmetric septum**, small cavity | **Thin, fatty RV** | Near-normal size, stiff |\n| Failure | **Systolic** | **Diastolic** (+ outflow obstruction) | Right-sided + arrhythmia | **Diastolic** |\n| Cause | Idiopathic; **titin**; Coxsackie; alcohol; doxorubicin; pregnancy; haemochromatosis | **AD sarcomere** mutations | **AD** | **Amyloid**, sarcoid, fibroelastosis, Loeffler |\n| Histology | Non-specific | **Myofibre disarray** | **Fat + fibrosis** replacing myocytes | Amyloid (Congo red) etc. |\n| Signature | Biventricular CHF, AV-valve regurgitation | **SCD in young athletes**; exertional syncope | **SCD in athletes** | **Low-voltage ECG** |", "priority": 1}]}, {"id": "2.6", "title": "Myocarditis and pericardial disease", "intro": "", "subs": [{"id": "2.6.1", "title": "Myocarditis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Myocarditis is inflammation of the myocardium. **Viruses are the most common cause, above all Coxsackie A and B.** Microscopy shows **oedema with a lymphocytic infiltrate and focal myocyte necrosis**.\n\n| Cause group | Key examples |\n| --- | --- |\n| **Infective** | **Coxsackie A and B (most common)**, ECHO, influenza, HIV; also diphtheria, Trypanosoma, Toxoplasma, Trichinella |\n| **Immunological** | **Rheumatic fever**, SLE and other connective-tissue diseases, **drug hypersensitivity** (methyldopa, sulphonamides), post-viral, transplant rejection |\n| **Unknown** | Sarcoidosis, **giant cell myocarditis** (widespread infiltrate with multinucleate giant cells) |\n\n- **Gross:** the myocardium is pale and flabby, with patchy necrosis and sometimes mural thrombi\n- **Clinical range:** from no symptoms and full recovery, through fatigue, dyspnoea, palpitations, chest pain and fever, to sudden heart failure or **arrhythmia with sudden death**\n- **Outcome:** the lesions resolve or heal by fibrosis. It **occasionally progresses to DCM**\n\n**Remember:**\n\n- The hallmark of viral myocarditis is a **lymphocytic infiltrate with myocyte necrosis**. Aschoff bodies = rheumatic; giant cells = giant cell myocarditis (QZ32).\n- A young woman with fever, arrhythmia, diffuse ST–T changes, raised troponin, **no vegetations** and full recovery in 2 weeks → the cause is an **enterovirus** (echovirus titre, CQ19). Troponin rises in myocarditis too, because myocytes die.\n- Ask \"most common cause\" without \"worldwide\" (blueprint QC-5). The expected answer is **Coxsackie B** (QZ31).\n\n**Image:** H&E of lymphocytes surrounding damaged myocytes.\n\n*Source: CL p121, p148–150*", "priority": 2}, {"id": "2.6.2", "title": "Pericardial effusion and tamponade", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** Normally the pericardial sac holds only **30–50 mL** of clear fluid. **Rapid** accumulation of fluid, blood or pus causes **cardiac tamponade**: the heart cannot fill, so cardiac output falls fast and progresses to **cardiogenic shock**. It needs **urgent pericardial drainage**.\n\n**Remember:** A stab wound to the left chest, BP barely recordable, **muffled heart sounds**, clear lungs → the most useful treatment is **pericardiocentesis** (CQ4).\n\nCauses of haemopericardium to remember: MI free-wall rupture (day 4–7), aortic dissection, trauma and malignancy.\n\n*Source: CL p151–152*", "priority": 2}, {"id": "2.6.3", "title": "Acute pericarditis", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** **Pleuritic chest pain that improves on sitting up or leaning forward**, plus a **pericardial friction rub** and typical ECG changes.\n\nClassify pericarditis by duration (acute: days to weeks; chronic: >3 months), by cause (idiopathic, infective, immunological, neoplastic, **metabolic — uraemia**, traumatic) and **by the exudate**:\n\n| Exudate | Key causes | Key feature |\n| --- | --- | --- |\n| **Serous** | Viral (Coxsackie, mumps), RF, RA, SLE | Protein-rich; rarely organises |\n| **Fibrinous / serofibrinous** | **Uraemia, MI (1–3 d), Dressler (post-MI), RF, SLE** | **The most common type.** **\"Bread and butter\"** shaggy surface; **friction rub** is the striking sign; may heal as adhesions |\n| **Purulent** | Staph, strep, pneumococcus (from empyema, pneumonia, blood, surgery) | High fever, rigors, rub; usually heals by **scarring** |\n| **Haemorrhagic** | **Malignancy**, TB, bacterial, bleeding disorders, after cardiac surgery | Blood + fibrin/pus |\n| **Chylous** | **Lymphatic (thoracic duct) obstruction or injury** | Milky fluid; can cause tamponade or constriction |\n\n**EXAM TRAPS:**\n\n- A patient with renal failure (urea 100, creatinine 9.8) and a friction rub → **fibrinous** pericarditis (QZ49; CQ39). A shaggy epicardium on the gross photo → the underlying condition is **chronic renal failure** (CQ48).\n- An afebrile man with 3 months of malaise, distant heart sounds and **bloody** fluid → **metastatic carcinoma** (CQ41). Metastases most often involve the pericardium.\n- Milky fluid → **lymphatic obstruction** (QZ35).\n- Chest pain relieved by leaning forward + rub → **acute pericarditis**, not MI (QZ33).\n\n**Image:** The \"bread and butter\" epicardium (gross); a haemorrhagic pericarditis for contrast.\n\n*Source: CL p153–160*", "priority": 3}, {"id": "2.6.4", "title": "Chronic and constrictive pericarditis", "label": "COURSE", "md": "**HIGH-YIELD FACT:** In **constrictive pericarditis** the pericardium becomes a thick, **calcified** fibrous shell. It **restricts diastolic filling** (the heart is **small**) and causes **systemic venous congestion**. It is the end result of **TB** and severe **suppurative** pericarditis.\n\n- **Tuberculous pericarditis:** caseous material and adhesions → fibrosis and calcification → constriction\n- [COURSE] Adherent mediastinopericarditis: fibrosis binds the pericardium to the mediastinum; every beat pulls on the chest wall → hypertrophy, dilation and failure\n\n**EXAM TRAP:** **Constrictive pericarditis vs restrictive cardiomyopathy.** Both cause diastolic failure. In constriction the **pericardium** is thick and calcified; in restriction the **myocardium** is stiff (amyloid). (The CQ44 distractor.)\n\n*Source: CL p161–163*", "priority": 1}]}, {"id": "2.7", "title": "Heart failure", "intro": "", "subs": [{"id": "2.7.1", "title": "Definition and compensation", "label": "COURSE + EXAM", "md": "**HIGH-YIELD FACT:** CHF is **pump failure**: the ventricles cannot keep up an output that meets the body's needs. Output depends on **preload** (end-diastolic volume/pressure), **afterload** (the pressure the LV contracts against) and **contractility**.\n\n**Compensation** keeps the heart going, but a small extra insult (e.g. an infection) can tip it into overt failure. The mechanisms:\n\n- **Increased contractility** and **myocardial hypertrophy**\n- **Sympathetic stimulation**\n- **Renin–angiotensin system activation**\n- **Atrial natriuretic peptide** release\n\n**Why RAAS makes it worse:** Poor renal flow activates RAAS → salt and water retention (more preload) and vasoconstriction (more afterload) → **fluid retention worsens CHF**. **ACE inhibitors** are the mainstay because they cut this loop and **reduce afterload**.\n\n**Remember:**\n\n- The compensatory mechanism that **worsens** failure is **RAAS activation**. ANP is protective (QZ44).\n- The key drug for afterload reduction in left heart failure is the **ACE inhibitor** (QZ45).\n\n*Source: CL p139–141, p144*", "priority": 1}, {"id": "2.7.2", "title": "Left vs right heart failure", "label": "COURSE + EXAM", "md": "|  | Left heart failure | Right heart failure |\n| --- | --- | --- |\n| Causes | **Ischaemia/MI, hypertension**, dilated and restrictive cardiomyopathy (and aortic/mitral valve disease) | **Most commonly left heart failure**; **left-to-right shunts**; **chronic lung disease (cor pulmonale)** |\n| Blood backs up into | **Lungs** | **Systemic veins** |\n| Hallmark | **Pulmonary oedema** | **Peripheral congestion** |\n| Symptoms and signs | **Dyspnoea, orthopnoea, paroxysmal nocturnal dyspnoea** (more venous return lying flat), crackles | **Jugular venous distension**, **painful hepatosplenomegaly**, **dependent pitting oedema** |\n| Pathology | Capillaries burst → alveolar haemorrhage → **haemosiderin-laden macrophages (\"heart-failure cells\")** = chronic passive congestion | **\"Nutmeg liver\"** (centrilobular congestion) → may progress to **cardiac cirrhosis** |\n| Kidney | Low flow → RAAS → fluid retention | — |\n\n**EXAM TRAPS:**\n\n- The hallmark of left heart failure is **pulmonary oedema**. Nutmeg liver, JVD and ankle oedema are **right**-sided (QZ41, QZ43).\n- Heart-failure cells mean **chronic passive congestion**, not pneumonia or TB (QZ42).\n- A man with leg swelling, basal crackles, a **widely split S2**, a big right heart and effusions → **cor pulmonale** from **pulmonary interstitial fibrosis** (CQ44).\n\n**Image:** Lung H&E with brown haemosiderin-laden macrophages (Prussian blue inset); cut surface of a nutmeg liver.\n\n*Source: CL p142–146*", "priority": 3}]}, {"id": "2.8", "title": "Cardiac tumours", "intro": "**HIGH-YIELD FACT:** **Metastases are more common than primary tumours.** The commonest primary in adults is **myxoma**; in children it is **rhabdomyoma**.\n\n| Tumour | Who | Where | Key facts |\n| --- | --- | --- | --- |\n| **Myxoma** | **Adults** (most common primary) | **Left atrium**; **pedunculated** mass | Benign mesenchymal tumour; **gelatinous**, rich in ground substance. It **blocks the mitral valve → syncope** (\"ball-valve\"), and can embolise |\n| **Rhabdomyoma** | **Children** (most common primary) | **Ventricle** | Benign **hamartoma** of cardiac muscle; associated with **tuberous sclerosis** |\n| **Metastases** | Adults | **Pericardium** → **pericardial effusion** | From **lung and breast carcinoma, melanoma, lymphoma** |\n\n**Remember:**\n\n- A 45-year-old woman with syncope and a **pedunculated left atrial mass** = **myxoma** (QZ36). A woman with repeated **syncope** and a small cerebral infarct (embolus), a normal-sized heart and clear lungs = **left atrial myxoma** (CQ26).\n- \"Associated with tuberous sclerosis\" = **rhabdomyoma** (QZ39).\n- Metastases come mainly from **breast and lung** (QZ38). Bloody pericardial fluid in an older patient points to **metastatic carcinoma** (CQ41).\n- [SUPP] Angiosarcoma, papillary fibroelastoma and fibroma are not taught. They appear only as distractors (blueprint QC-14).\n\n**Image:** Gross photograph of a gelatinous, pedunculated left atrial myxoma; H&E of stellate cells in a myxoid matrix.\n\n*Source: CL p134–137*", "subs": [], "priority": 2}, {"id": "2.9", "title": "Integrated cardiovascular pathology", "intro": "These four tables pull facts from both lectures that examiners combine in one vignette. Nothing here is new; every row points back to where it was taught.", "subs": [{"id": "2.9.1", "title": "Cardiac sources of stroke", "label": null, "md": "| Source | Clue in the stem | Taught in |\n| --- | --- | --- |\n| **Mitral stenosis → AF → LA mural thrombus** | Dysphagia, big left atrium, irregular pulse, rheumatic history | 2.2.5, 2.3.5 (CQ3, CQ9) |\n| **Post-MI mural thrombus** | Old anterior MI, LV aneurysm | 1.3.6–1.3.7 |\n| **Infective endocarditis** (septic embolus) | Fever, murmur, IVDU, splinters | 2.4 (CL p114) |\n| **NBTE** | Adenocarcinoma (pancreas), negative cultures | 2.4.1 (CL p113; CQ25, CQ43) |\n| **Left atrial myxoma** | Syncope, pedunculated LA mass | 2.8 (CQ26) |\n| **Paradoxical embolus via ASD** | Recent **DVT**, pulmonary hypertension | 2.1.3 (CQ27) |\n| **Aortic dissection into the carotid** | Tearing chest pain + stroke signs | 1.5.3 (VL p101) |", "priority": 2}, {"id": "2.9.2", "title": "Sudden death in a young person", "label": null, "md": "| Cause | Autopsy / key clue | Taught in |\n| --- | --- | --- |\n| **Hypertrophic cardiomyopathy** | Asymmetric septum, **myofibre disarray**, family history | 2.5.2 |\n| **ARVC** | Thin RV **replaced by fat** | 2.5.3 |\n| **Myocarditis** | **Lymphocytes + necrosis**, recent viral illness | 2.6.1 |\n| **Cocaine** | No gross lesion; **contraction-band necrosis** | 1.2.4, 1.3.5 (CQ28) |\n| **Mitral valve prolapse** | Floppy mitral valve (Marfan) | 2.3.3 |\n| **Aortic dissection (Marfan)** | Tall; **cystic medial degeneration**; tamponade | 1.5.2 |\n| **Kawasaki (in a child)** | Coronary aneurysm/thrombosis → MI | 1.6.6 |", "priority": 1}, {"id": "2.9.3", "title": "Blood in the pericardium / tamponade", "label": null, "md": "| Cause | Timing / clue | Taught in |\n| --- | --- | --- |\n| **MI free-wall rupture** | **Day 4–7** after MI; bloody pericardiocentesis | 1.3.6 (CQ30) |\n| **Aortic dissection** | Tearing pain to back; **a major immediate cause of death in proximal dissection (the course lists it as the most common cause**) | 1.5.3 |\n| **Penetrating trauma** | Stab wound, muffled heart sounds | 2.6.2 (CQ4) |\n| **Metastatic carcinoma / TB** | Slow, bloody, afebrile, malaise | 2.6.3 (CQ41) |", "priority": 1}, {"id": "2.9.4", "title": "Causes of aortic regurgitation", "label": null, "md": "| Cause | Mechanism | Taught in |\n| --- | --- | --- |\n| **Tertiary syphilis** | Vasa vasorum endarteritis → root dilation (tree bark) | 1.5.5 (CQ38) |\n| **Aortic dissection** | Root dilation / tear | 1.5.3 |\n| **Infective endocarditis** | Cusp destruction | 2.4 |\n| **Marfan syndrome** | Root dilation (cystic medial degeneration) | 1.5.2 (CQ5) |\n| **Chronic RHD** (occasional) | Commissural fusion → mixed disease | 2.2.5 |", "priority": 1}]}], "facts": {"id": "30-high-yield-facts-to-know-before-the-exam", "title": "30 high-yield facts to know before the exam", "intro": "The 30 facts below are the **highest-priority COURSE + EXAM facts** selected from Lectures 1 and 2. Course thresholds are marked where current definitions differ.\n\n**Vessels, IHD and MI**\n\n1. **Fatty streak** (foam cells) is the earliest atherosclerotic lesion. The sites in order are abdominal aorta > coronaries > popliteal > internal carotid.\n2. **≥75% stenosis** → stable angina (**ST↓**). **Prinzmetal** = spasm (**ST↑**), relieved by a calcium-channel blocker.\n3. **Unstable angina** = plaque rupture + **partial** thrombus; high risk of MI.\n4. **LAD** (45%) → anterior wall + anterior septum. **RCA** → posterior wall + papillary muscles.\n5. **Troponin I** = the course's most sensitive and specific marker. **CK-MB** normalises by 72 h, so it detects **reinfarction**.\n6. **Contraction-band necrosis = reperfusion** (Ca²⁺ influx).\n7. MI day **1–3 = neutrophils + fibrinous pericarditis**. Day **4–7 = macrophages + rupture**. **1–3 weeks = granulation tissue**. Months = scar, aneurysm, mural thrombus.\n8. **Papillary muscle rupture → acute MR. Free-wall rupture → tamponade.**\n9. **Hyaline** arteriolosclerosis = benign HTN/diabetes. **Onion-skin + fibrinoid necrosis** = malignant HTN (**flea-bitten kidney**).\n10. **HTN → concentric LVH** (hypertensive heart disease).\n11. **Aortic dissection:** HTN (older) or **Marfan/cystic medial degeneration** (young). The major immediate cause of death in proximal dissection is haemopericardium with **tamponade**.\n12. **Syphilis → thoracic aneurysm** (tree bark) **→ aortic regurgitation**. **Atherosclerosis → infrarenal AAA** (rupture risk rises with size; course cut-off >5 cm).\n13. **GCA** = old woman + **markedly raised ESR (often >100)** + jaw claudication → **steroids now** (blindness). Biopsy a long segment.\n14. **PAN spares the lung** (HBsAg). **Kawasaki → coronary aneurysm** (aspirin + IVIG). **IgA vasculitis (HSP)** = child, IgA, palpable purpura.\n15. **GPA (Wegener)** = granulomas + **c-ANCA**. **Microscopic polyangiitis** = no granulomas + **p-ANCA**. **EGPA (Churg–Strauss)** = asthma + eosinophils.\n\n**Structural, infective and myocardial disease**\n\n16. **VSD** is the most common CHD. Large, untreated defects → **Eisenmenger** (pulmonary HTN → shunt reversal → late cyanosis).\n17. **ASD:** secundum is the commonest; **primum → Down syndrome**; split S2; **paradoxical emboli**.\n18. **PDA:** rubella, machinery murmur. **Indomethacin closes** it; **PGE₁ maintains patency** (in TGA).\n19. **Tetralogy (PROV):** early cyanosis, **squatting**, boot-shaped heart.\n20. **Coarctation (adult):** arm HTN, weak leg pulses, **rib notching**, bicuspid valve. Associated with Turner syndrome.\n21. **Rheumatic fever:** group A strep, **molecular mimicry**. **Aschoff bodies with Anitschkow cells**. Myocarditis kills in the acute phase.\n22. **Chronic RHD → fish-mouth mitral stenosis → LA dilation → AF → mural thrombus → stroke.**\n23. **Aortic stenosis** (calcific, >60; earlier if bicuspid): ejection click, **syncope, angina**, concentric LVH, schistocytes.\n24. **MVP:** myxoid valve, **mid-systolic click**, Marfan. **MR:** holosystolic blowing murmur.\n25. **IE organisms:** *S. viridans* (most common, damaged valve); ***S. aureus* (IVDU, tricuspid)**; *S. epidermidis* (prosthetic); ***S. bovis* (colon cancer)**; HACEK (culture-negative).\n26. **Libman–Sacks** = SLE, vegetations on **both sides**. **NBTE** = adenocarcinoma, bland, **embolises**.\n27. **Osler = painful** finger nodules. **Janeway = painless** palms/soles. Plus Roth spots, splinters, GN.\n28. **DCM** = systolic failure, most common; titin, **Coxsackie**, alcohol, doxorubicin, haemochromatosis. **HCM** = AD sarcomere, **myofibre disarray**, **sudden death in athletes**. **RCM** = **amyloid**, low-voltage ECG.\n29. **Fibrinous \"bread-and-butter\" pericarditis:** **uraemia**, MI, Dressler, friction rub. **Chylous** = lymphatic obstruction. **Haemorrhagic** = malignancy/TB.\n30. **Myxoma** = adult, **left atrium**, syncope. **Rhabdomyoma** = child, **tuberous sclerosis**. **Metastases > primaries.** Left HF → **heart-failure cells**; right HF → **nutmeg liver**.", "subs": []}}], "questions": [{"id": "L1-1", "test": "L1", "topic": "athero", "style": "Mechanism", "stem": ["In a developing atherosclerotic plaque, the lipid that accumulates inside intimal foam cells comes mainly from which source?"], "image": null, "imgQuery": null, "options": ["Lipid released from dead smooth muscle cells of the media", "The contents of platelet granules", "Plasma LDL that has entered the intima and been oxidised", "Triglyceride made by endothelial cells"], "answer": 2, "explanation": "Endothelial injury lets LDL into the intima. Once oxidised, it is taken up by macrophages, which become foam cells.", "trap": "\"membranes of dead cells\" sounds plausible, but the source is serum lipoprotein.", "source": "L1 §1.1.3; VL p80–85", "sections": ["1.1"], "code": "CVS-L1-Q001", "concept": "athero-path", "objective": "Identify the source of lipid in foam cells", "difficulty": "Recall", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L1", "section": "1.1", "sourceType": "New SBA"}, {"id": "L1-2", "test": "L1", "topic": "athero", "style": "Image", "stem": ["A 72-year-old woman has a thyroid nodule removed. The pathologist also notes the small artery shown.", "[[IMAGE]]", "What is the best interpretation?"], "image": "H&E, low power. A medium-sized muscular artery with ring-like purple calcific deposits confined to the media; thin intima; widely patent lumen.", "imgQuery": "Monckeberg arteriosclerosis", "options": ["Complicated atherosclerotic plaque", "Hyaline arteriolosclerosis of benign hypertension", "Mönckeberg medial calcific sclerosis", "Healed giant cell arteritis"], "answer": 2, "explanation": "Mönckeberg sclerosis is calcification of the **media** of muscular arteries. It does **not** narrow the lumen and is clinically insignificant.", "trap": "calcium in an artery is not automatically atherosclerosis; atherosclerosis is an **intimal** lesion.", "source": "L1 §1.1.1; VL p75–76; CQ51", "sections": ["1.1"], "code": "CVS-L1-Q002", "concept": "monckeberg", "objective": "Recognise Mönckeberg medial calcific sclerosis on histology", "difficulty": "Interpretation", "previousExam": false, "integrated": false, "imageBased": true, "correctAnswer": "C", "lecture": "L1", "section": "1.1", "sourceType": "New SBA"}, {"id": "L1-3", "test": "L1", "topic": "ihd", "style": "Clinical case / ECG", "stem": ["A 45-year-old woman has recurrent chest pain at about 5 a.m. while resting in bed. During an episode, the ECG shows ST elevation that resolves within minutes. Troponin stays normal, and angiography shows no significant fixed stenosis. What is the most likely mechanism?"], "image": null, "imgQuery": null, "options": ["Plaque rupture with an occlusive thrombus", "Fixed ≥75% stenosis with demand ischaemia", "Transient coronary artery vasospasm", "Subendocardial necrosis"], "answer": 2, "explanation": "This is Prinzmetal (variant) angina. The pain is episodic and unrelated to exertion. In this vasospastic context, ST elevation reflects transient **transmural** ischaemia, and the normal troponin shows there is no necrosis. It is relieved by nitrates or calcium-channel blockers. **Why not A:** an occlusive thrombus causes infarction, so troponin would rise.", "trap": "ST elevation does not always mean infarction. In Prinzmetal angina it is transient, and the normal troponin shows the ischaemia is reversible.", "source": "L1 §1.2.3; CL p15", "sections": ["1.2"], "code": "CVS-L1-Q003", "concept": "angina-types", "objective": "Distinguish Prinzmetal from stable and unstable angina", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L1", "section": "1.2", "sourceType": "Previous-exam concept"}, {"id": "L1-4", "test": "L1", "topic": "ihd", "style": "Mechanism", "stem": ["A 62-year-old diabetic man has had chest pain at rest, increasing over 2 days. The ECG shows ST depression and troponin is not raised. What is the most likely coronary lesion?"], "image": null, "imgQuery": null, "options": ["Coronary vasospasm with no fixed plaque", "A fixed plaque causing demand ischaemia", "Complete thrombotic occlusion of the LAD", "A disrupted plaque with a partial thrombus"], "answer": 3, "explanation": "Unstable angina is plaque rupture with thrombosis and **incomplete** occlusion. It is reversible (no enzyme rise) but carries a high risk of MI. **Why not C:** complete occlusion causes a transmural MI with ST elevation and a troponin rise. **Why not B:** a fixed plaque causes pain on exertion, not increasing pain at rest.", "trap": "", "source": "L1 §1.2.2–1.2.3; CL p9, p14", "sections": ["1.2"], "code": "CVS-L1-Q004", "concept": "acs-plaque", "objective": "Link unstable angina to plaque disruption with partial thrombus", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L1", "section": "1.2", "sourceType": "New SBA"}, {"id": "L1-5", "test": "L1", "topic": "ihd", "style": "Clinical case (autopsy)", "stem": ["A 58-year-old man collapses 30 minutes after the start of chest pain and cannot be resuscitated. At autopsy there is severe three-vessel coronary atherosclerosis, but no gross or microscopic evidence of myocardial infarction. What is the best explanation for his death?"], "image": null, "imgQuery": null, "options": ["Ventricular arrhythmia from acute ischaemia", "Aortic dissection with cardiac tamponade", "Rupture of the left ventricular free wall", "Massive transmural myocardial infarction"], "answer": 0, "explanation": "Sudden cardiac death occurs within 1 hour of symptoms and is usually a ventricular arrhythmia. Necrosis cannot yet be seen (no light-microscopic change before about 4 h). **Why not C or D:** free-wall rupture happens at 4–7 days, and an infarct would be visible if it were old enough to be massive.", "trap": "\"no infarct at autopsy\" does not mean the death was non-cardiac.", "source": "L1 §1.2.4; CL p27, p37", "sections": ["1.2"], "code": "CVS-L1-Q005", "concept": "scd", "objective": "Explain sudden cardiac death without a visible infarct", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.2", "sourceType": "New SBA"}, {"id": "L1-6", "test": "L1", "topic": "mi", "style": "Image / timeline", "stem": ["A 60-year-old man dies 2 days after an anterior MI. The infarcted myocardium is shown.", "[[IMAGE]]", "Which other autopsy finding is most characteristic of this stage?"], "image": "H&E, medium power. Hypereosinophilic myocytes with loss of nuclei and cross-striations; the interstitium is densely infiltrated by neutrophils.", "imgQuery": "myocardial infarction neutrophils histology", "options": ["Fibrinous exudate on the epicardium", "A firm white fibrous scar", "A ventricular aneurysm with mural thrombus", "A red border of granulation tissue"], "answer": 0, "explanation": "Neutrophils mark **1–3 days**. The characteristic complication of this period is **fibrinous pericarditis** (chest pain with a friction rub). **Why not B or C:** a scar and an aneurysm take months. **Why not D:** granulation tissue with a red border appears at 1–3 weeks.", "trap": "", "source": "L1 §1.3.6; CL p27, p30–31", "sections": ["1.3"], "code": "CVS-L1-Q006", "concept": "mi-timeline", "objective": "Match the 1–3-day stage of MI to its complication", "difficulty": "Interpretation", "previousExam": false, "integrated": false, "imageBased": true, "correctAnswer": "A", "lecture": "L1", "section": "1.3", "sourceType": "New SBA"}, {"id": "L1-7", "test": "L1", "topic": "mi", "style": "Laboratory interpretation", "stem": ["A man admitted with an MI has new chest pain on day 5. Which test best shows whether a **new** infarction has occurred?"], "image": null, "imgQuery": null, "options": ["Troponin I", "CK-MB", "ESR", "Serum cholesterol"], "answer": 1, "explanation": "CK-MB returns to normal by 72 h, so a fresh rise on day 5 means new necrosis.", "trap": "troponin I is the most sensitive and specific marker in this course, but it stays raised for 7–10 days, so it cannot separate old from new injury.", "source": "L1 §1.3.4; CL p23", "sections": ["1.3"], "code": "CVS-L1-Q007", "concept": "mi-biomarkers", "objective": "Choose the marker that detects reinfarction", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.3", "sourceType": "Previous-exam concept"}, {"id": "L1-8", "test": "L1", "topic": "mi", "style": "Interpretation (territory)", "stem": ["Angiography in a man with an acute STEMI shows thrombotic occlusion of the right coronary artery. Which region is at greatest risk?"], "image": null, "imgQuery": null, "options": ["Anterior wall and anterior septum", "Lateral wall of the left ventricle", "Posterior wall and papillary muscles", "Right atrium and interatrial septum"], "answer": 2, "explanation": "The RCA supplies the posterior wall, posterior septum and papillary muscles of the LV. **Why not A:** the anterior wall and anterior septum are the LAD territory (the most common, 45%). The circumflex supplies the lateral wall.", "trap": "", "source": "L1 §1.3.3; CL p21", "sections": ["1.3"], "code": "CVS-L1-Q008", "concept": "mi-territory", "objective": "Map the RCA to its infarct territory", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L1", "section": "1.3", "sourceType": "Previous-exam concept"}, {"id": "L1-9", "test": "L1", "topic": "mi", "style": "Complication by day", "stem": ["A 66-year-old man is 5 days after an anterior transmural MI. He suddenly becomes profoundly hypotensive, with distended neck veins and muffled heart sounds, and dies. What will the autopsy most likely show?"], "image": null, "imgQuery": null, "options": ["Papillary muscle rupture with acute MR", "Ventricular septal rupture with a shunt", "Dressler fibrinous pericarditis", "Free-wall rupture with haemopericardium"], "answer": 3, "explanation": "Days 4–7 are the rupture window: macrophages are clearing the necrotic tissue and no collagen has been laid down. Free-wall rupture → haemopericardium → **tamponade** (hypotension, raised JVP, muffled heart sounds). **Why not A:** papillary muscle rupture gives a new murmur and pulmonary oedema, not tamponade.", "trap": "papillary muscle rupture gives a new murmur and pulmonary oedema, not tamponade.", "source": "L1 §1.3.6–1.3.7; CL p27, p33", "sections": ["1.3"], "code": "CVS-L1-Q009", "concept": "mi-rupture", "objective": "Recognise free-wall rupture with tamponade at 4–7 days", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L1", "section": "1.3", "sourceType": "New SBA"}, {"id": "L1-10", "test": "L1", "topic": "htn", "style": "Image", "stem": ["A 48-year-old man presents with BP 230/135 mmHg, papilloedema and rising creatinine. His renal biopsy is shown.", "[[IMAGE]]", "What is the diagnosis?"], "image": "H&E, high power. An arteriole with concentric \"onion-skin\" layers of smooth muscle cells and a pinpoint lumen; a neighbouring arteriole shows fibrinoid necrosis.", "imgQuery": "hyperplastic arteriolosclerosis", "options": ["Benign hypertension", "Malignant hypertension", "Polyarteritis nodosa", "Mönckeberg medial sclerosis"], "answer": 1, "explanation": "Onion-skin (hyperplastic) arteriolosclerosis and necrotising arteriolitis are the arteriolar lesions of **malignant** hypertension, which fits the papilloedema and renal failure. The BP is above the course threshold (≥200/120). **Why not A:** benign hypertension gives pink **hyaline** arteriolosclerosis and a slow course.", "trap": "", "source": "L1 §1.4.2–1.4.3; VL p65–66", "sections": ["1.4"], "code": "CVS-L1-Q010", "concept": "htn-malignant", "objective": "Recognise malignant hypertension and its arteriolar lesion", "difficulty": "Interpretation", "previousExam": false, "integrated": false, "imageBased": true, "correctAnswer": "B", "lecture": "L1", "section": "1.4", "sourceType": "New SBA"}, {"id": "L1-11", "test": "L1", "topic": "htn", "style": "Mechanism", "stem": ["A 60-year-old woman has type 2 diabetes and mild hypertension. Her renal arterioles show homogeneous pink thickening of the wall with a narrowed lumen. In diabetes, what is the mechanism of this change?"], "image": null, "imgQuery": null, "options": ["IgA immune-complex deposition in the wall", "Smooth-muscle proliferation after acute injury", "Fibrinoid necrosis from a sudden pressure rise", "Glycosylated basement membrane leaking protein"], "answer": 3, "explanation": "This is hyaline arteriolosclerosis. In diabetes, non-enzymatic glycosylation makes the basement membrane leaky, so plasma proteins enter the wall. **Why not B or C:** onion-skin proliferation and fibrinoid necrosis are the lesions of malignant HTN. **Why not A:** immune complexes are not the mechanism.", "trap": "", "source": "L1 §1.4.3; VL p64", "sections": ["1.4"], "code": "CVS-L1-Q011", "concept": "hyaline", "objective": "Explain hyaline arteriolosclerosis in diabetes", "difficulty": "Recall", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L1", "section": "1.4", "sourceType": "New SBA"}, {"id": "L1-12", "test": "L1", "topic": "htn", "style": "Clinical case", "stem": ["A 55-year-old man has had untreated blood pressure around 170/105 mmHg for 10 years. He now has exertional dyspnoea and orthopnoea. Echo shows a thick left ventricular wall with a small cavity and normal valves. What is the most likely diagnosis?"], "image": null, "imgQuery": null, "options": ["Hypertensive heart disease with concentric LVH", "Dilated cardiomyopathy", "Eccentric hypertrophy from aortic regurgitation", "Arrhythmogenic right ventricular cardiomyopathy"], "answer": 0, "explanation": "Chronic pressure overload gives **concentric** LVH and, later, left heart failure.", "trap": "volume overload (AR) gives eccentric hypertrophy with dilation.", "source": "L1 §1.4.5; VL p61–62; CQ42, CQ47", "sections": ["1.4"], "code": "CVS-L1-Q012", "concept": "hhd-lvh", "objective": "Recognise hypertensive heart disease with concentric LVH", "difficulty": "Application", "previousExam": false, "integrated": true, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.4", "sourceType": "Integrated"}, {"id": "L1-13", "test": "L1", "topic": "aorta", "style": "Morphology", "stem": ["A 28-year-old tall man with long fingers and a history of lens dislocation dies suddenly after tearing chest pain radiating to the back. What would a section of his ascending aortic media most likely show?"], "image": null, "imgQuery": null, "options": ["Hyaline arteriolosclerosis of the vasa vasorum with medial atrophy", "Fragmented elastic fibres with proteoglycan-filled spaces", "Endarteritis of the vasa vasorum with tree-bark intima", "Granulomatous inflammation with giant cells"], "answer": 1, "explanation": "Marfan syndrome (fibrillin-1) causes **cystic medial degeneration**, the medial weakness behind dissection in young people.", "trap": "A is the mechanism in **older hypertensive** patients; C is syphilis.", "source": "L1 §1.5.2; VL p96–99", "sections": ["1.5"], "code": "CVS-L1-Q013", "concept": "dissection-mech", "objective": "Link Marfan syndrome to cystic medial degeneration", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.5", "sourceType": "New SBA"}, {"id": "L1-14", "test": "L1", "topic": "aorta", "style": "Complication", "stem": ["A 70-year-old woman with poorly controlled hypertension has sudden tearing chest pain radiating to her back and a widened mediastinum on X-ray. She dies 2 hours after admission. What is the most likely immediate cause of death?"], "image": null, "imgQuery": null, "options": ["Haemopericardium with cardiac tamponade", "Pulmonary embolism", "Transmural MI from coronary thrombosis", "Rupture of an infrarenal abdominal aortic aneurysm"], "answer": 0, "explanation": "In proximal dissection, blood tracks back into the pericardial sac. The faculty lecture lists haemopericardium with tamponade as the most common cause of death. **Why not C:** occlusion of a coronary branch is a recognised complication, but tamponade is the classic immediate cause. **Why not D:** a ruptured AAA is infrarenal and does not give a widened mediastinum.", "trap": "", "source": "L1 §1.5.3; VL p100", "sections": ["1.5"], "code": "CVS-L1-Q014", "concept": "dissection-death", "objective": "State the main immediate cause of death in proximal dissection", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.5", "sourceType": "New SBA"}, {"id": "L1-15", "test": "L1", "topic": "aorta", "style": "Clinical case", "stem": ["A 72-year-old man has an early diastolic blowing murmur and bounding pulses. His treponemal antibody test is positive, and CT shows a dilated ascending aorta. What is the pathogenesis of his aortic lesion?"], "image": null, "imgQuery": null, "options": ["Atheroma weakening the infrarenal aorta", "Cystic medial degeneration from fibrillin defect", "Endarteritis of the vasa vasorum, scarring the media", "Mycotic infection seeded by infective endocarditis"], "answer": 2, "explanation": "Tertiary syphilis causes a thoracic aneurysm through endarteritis of the vasa vasorum, which starves and scars the media (tree-bark intima). Aortic-root dilation causes **aortic regurgitation**. **Why not B:** cystic medial degeneration (Marfan) causes dissection in young people, and there is no treponemal link. **Why not A:** atherosclerotic aneurysms are infrarenal.", "trap": "", "source": "L1 §1.5.5; VL p111–112; CQ38", "sections": ["1.5"], "code": "CVS-L1-Q015", "concept": "syphilis-aneurysm", "objective": "Explain the pathogenesis of the syphilitic thoracic aneurysm", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L1", "section": "1.5", "sourceType": "New SBA"}, {"id": "L1-16", "test": "L1", "topic": "vasculitis", "style": "Management / trap", "stem": ["A 74-year-old woman has a new right temporal headache, jaw pain when chewing, and episodes of blurred vision. Her temporal artery is tender and the ESR is 105 mm/h. What is the most appropriate immediate step?"], "image": null, "imgQuery": null, "options": ["Arrange a temporal artery biopsy and treat only if it is positive", "Start high-dose corticosteroids immediately", "Give aspirin and IVIG", "Start cyclophosphamide alone"], "answer": 1, "explanation": "This is giant cell arteritis. Steroids must start **now** to prevent blindness (ophthalmic artery).", "trap": "the biopsy must not delay treatment. The lesions are segmental, so a negative biopsy does not exclude GCA.", "source": "L1 §1.6.3; VL p9–12", "sections": ["1.6"], "code": "CVS-L1-Q016", "concept": "large-vessel", "objective": "Manage suspected giant cell arteritis", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.6", "sourceType": "Previous-exam concept"}, {"id": "L1-17", "test": "L1", "topic": "vasculitis", "style": "Comparison", "stem": ["A 50-year-old man has haemoptysis and haematuria with rapidly progressive glomerulonephritis. He has no sinus or nasal disease. p-ANCA is positive, and lung and kidney biopsies show necrotising vasculitis **without granulomas**. What is the diagnosis?"], "image": null, "imgQuery": null, "options": ["Granulomatosis with polyangiitis (Wegener)", "EGPA (Churg–Strauss)", "Polyarteritis nodosa", "Microscopic polyangiitis"], "answer": 3, "explanation": "MPA involves the lung and kidney with **no granulomas, no ENT disease and p-ANCA**. GPA has granulomas, ENT disease and c-ANCA. EGPA has asthma and eosinophilia. PAN spares the lung.", "trap": "", "source": "L1 §1.6.8; VL p27–28", "sections": ["1.6"], "code": "CVS-L1-Q017", "concept": "anca-vasculitis", "objective": "Distinguish microscopic polyangiitis from GPA and EGPA", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L1", "section": "1.6", "sourceType": "Previous-exam concept"}, {"id": "L1-18", "test": "L1", "topic": "vasculitis", "style": "Complication", "stem": ["A 3-year-old boy has had fever for 6 days, bilateral conjunctival injection, cracked red lips with a strawberry tongue, red swollen palms and soles, and an enlarged cervical lymph node. Which complication is the main cause of serious morbidity and death?"], "image": null, "imgQuery": null, "options": ["Renal artery stenosis with hypertension", "Coronary artery aneurysm and thrombosis", "Diffuse pulmonary haemorrhage", "IgA nephropathy with haematuria"], "answer": 1, "explanation": "Kawasaki disease targets the **coronary arteries**: thrombosis with MI, or aneurysm with rupture. It is treated with aspirin + IVIG, the exception to avoiding aspirin in children. **Why not D:** IgA nephropathy belongs to IgA vasculitis (Henoch–Schönlein purpura).", "trap": "", "source": "L1 §1.6.6; VL p18–21", "sections": ["1.6"], "code": "CVS-L1-Q018", "concept": "kawasaki", "objective": "State the main cause of death in Kawasaki disease", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L1", "section": "1.6", "sourceType": "Previous-exam concept"}, {"id": "L1-19", "test": "L1", "topic": "vasculitis", "style": "Clinical case", "stem": ["A 45-year-old man who is positive for hepatitis B surface antigen has new hypertension, abdominal pain with melaena, and a foot drop. His chest X-ray is normal. Angiography shows multiple small aneurysms alternating with narrowed segments in the renal and mesenteric arteries. What is the diagnosis?"], "image": null, "imgQuery": null, "options": ["Polyarteritis nodosa", "Microscopic polyangiitis", "Granulomatosis with polyangiitis", "Takayasu arteritis"], "answer": 0, "explanation": "PAN is a necrotising medium-vessel vasculitis with lesions of different ages (\"string of pearls\"). It is linked to HBsAg and **spares the lung**, which fits the normal chest X-ray. **Why not B or C:** microscopic polyangiitis and GPA are small-vessel diseases that involve the lung.", "trap": "", "source": "L1 §1.6.5; VL p14–17", "sections": ["1.6"], "code": "CVS-L1-Q019", "concept": "pan", "objective": "Recognise polyarteritis nodosa", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L1", "section": "1.6", "sourceType": "New SBA"}, {"id": "L1-20", "test": "L1", "topic": "vtumour", "style": "Recall in context", "stem": ["A 38-year-old man with AIDS develops multiple purple patches, plaques and nodules on his skin and hard palate. Which agent drives this tumour?"], "image": null, "imgQuery": null, "options": ["Epstein–Barr virus", "Human papillomavirus", "Cytomegalovirus", "Human herpesvirus 8"], "answer": 3, "explanation": "This is Kaposi sarcoma, a low-grade malignant vascular neoplasm associated with HHV-8. **Why not the others:** HIV provides the immunosuppression, but HHV-8 is the associated agent. EBV, HPV and CMV are not linked to Kaposi sarcoma in the course.", "trap": "", "source": "L1 §1.7; VL p123", "sections": ["1.7"], "code": "CVS-L1-Q020", "concept": "vasc-tumours", "objective": "Name the virus associated with Kaposi sarcoma", "difficulty": "Recall", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L1", "section": "1.7", "sourceType": "Previous-exam concept"}, {"id": "L2-1", "test": "L2", "topic": "chd", "style": "Mechanism", "stem": ["A 24-year-old woman has a large VSD that was never repaired. She now has cyanosis, finger clubbing and a haemoglobin of 19 g/dL. What is the main reason her shunt now causes cyanosis?"], "image": null, "imgQuery": null, "options": ["Spontaneous closure of the septal defect", "Development of polycythaemia vera", "Pulmonary hypertension reversing the shunt", "Progression of the defect to tetralogy"], "answer": 2, "explanation": "This is Eisenmenger syndrome: a long-standing L→R shunt causes pulmonary hypertension and RV hypertrophy, then the shunt reverses to R→L with late cyanosis. **Why not B:** the high haemoglobin is **secondary** polycythaemia (a response to hypoxaemia), not polycythaemia vera.", "trap": "", "source": "L2 §2.1.2; CL p41", "sections": ["2.1"], "code": "CVS-L2-Q001", "concept": "eisenmenger", "objective": "Explain shunt reversal in Eisenmenger syndrome", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L2", "section": "2.1", "sourceType": "New SBA"}, {"id": "L2-2", "test": "L2", "topic": "chd", "style": "Clinical case", "stem": ["A 42-year-old woman develops a deep vein thrombosis after a long flight. Two days later she has a sudden left hemiparesis. A bubble study on echo shows bubbles crossing from the right to the left atrium. Which defect best explains the stroke?"], "image": null, "imgQuery": null, "options": ["Atrial septal defect", "Ventricular septal defect", "Patent ductus arteriosus", "Coarctation of the aorta"], "answer": 0, "explanation": "Paradoxical embolism is the key complication of ASD: a venous clot crosses from the right to the left atrium and reaches the brain. **Why not B:** a VSD shunts at ventricular level, and the bubble study shows atrial crossing.", "trap": "", "source": "L2 §2.1.3; CL p46; CQ27", "sections": ["2.1"], "code": "CVS-L2-Q002", "concept": "asd", "objective": "Link ASD to paradoxical embolism", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L2", "section": "2.1", "sourceType": "New SBA"}, {"id": "L2-3", "test": "L2", "topic": "chd", "style": "Clinical case", "stem": ["A 2-year-old boy has episodes of cyanosis that he relieves by squatting. His chest X-ray shows a boot-shaped heart. Which combination of defects is he most likely to have?"], "image": null, "imgQuery": null, "options": ["Aorta from the RV and pulmonary artery from the LV", "A single arterial trunk arising from both ventricles", "An absent tricuspid orifice with a hypoplastic RV and an ASD", "Pulmonary stenosis, RV hypertrophy, overriding aorta and VSD"], "answer": 3, "explanation": "This is tetralogy of Fallot (PROV). Squatting raises systemic resistance, which reduces the R→L shunt. A is transposition, B truncus, C tricuspid atresia.", "trap": "", "source": "L2 §2.1.4; CL p50–51", "sections": ["2.1"], "code": "CVS-L2-Q003", "concept": "cyanotic-chd", "objective": "Recognise tetralogy of Fallot", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L2", "section": "2.1", "sourceType": "Previous-exam concept"}, {"id": "L2-4", "test": "L2", "topic": "rhdvalve", "style": "Diagnostic rule", "stem": ["A 9-year-old girl has a raised ASO titre 3 weeks after a sore throat. Which combination of findings **fulfils** the Jones criteria?"], "image": null, "imgQuery": null, "options": ["Fever and a raised ESR", "Carditis and Sydenham chorea", "Migratory polyarthritis and fever", "Arthralgia and a raised ESR"], "answer": 1, "explanation": "Evidence of group A strep infection plus **2 major** criteria (or 1 major + 2 minor) fulfils the rule. Carditis and chorea are two major criteria. A and D are minor findings only. C is 1 major + 1 minor, which is not enough.", "trap": "the ASO titre is evidence of infection, not a criterion.", "source": "L2 §2.2.2 [CLARIFICATION on the rule]; CL p62–68", "sections": ["2.2"], "code": "CVS-L2-Q004", "concept": "jones", "objective": "Apply the Jones criteria", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L2", "section": "2.2", "sourceType": "New SBA"}, {"id": "L2-5", "test": "L2", "topic": "rhdvalve", "style": "Image", "stem": ["A 10-year-old boy has fever, migratory arthritis, a new murmur and a pericardial rub. His endomyocardial biopsy is shown.", "[[IMAGE]]", "What is the lesion?"], "image": "H&E, high power. A perivascular myocardial focus of lymphocytes and macrophages, some with slender, wavy \"caterpillar\" nuclei, around fibrinoid material.", "imgQuery": "Aschoff body", "options": ["Lymphocytic viral myocarditis", "Giant cell myocarditis", "A sarcoid granuloma", "Rheumatic Aschoff body"], "answer": 3, "explanation": "Aschoff bodies with Anitschkow cells are characteristic of rheumatic myocarditis. Myocarditis is the main cause of death in the acute phase. The clinical picture (fever, migratory arthritis, new murmur, rub) is acute rheumatic fever. **Why not A:** viral myocarditis shows a lymphocytic infiltrate without Aschoff bodies.", "trap": "", "source": "L2 §2.2.3; CL p65", "sections": ["2.2"], "code": "CVS-L2-Q005", "concept": "rhd", "objective": "Recognise the Aschoff body of rheumatic carditis", "difficulty": "Interpretation", "previousExam": true, "integrated": false, "imageBased": true, "correctAnswer": "D", "lecture": "L2", "section": "2.2", "sourceType": "Previous-exam concept"}, {"id": "L2-6", "test": "L2", "topic": "rhdvalve", "style": "Clinical case", "stem": ["A 74-year-old man has angina and fainting on exertion. There is a crescendo–decrescendo systolic murmur, and his blood film shows schistocytes. What is the most likely valve lesion?"], "image": null, "imgQuery": null, "options": ["Rheumatic mitral stenosis", "Calcific aortic stenosis", "Mitral valve prolapse", "Aortic regurgitation"], "answer": 1, "explanation": "Calcific AS (usually >60 years) gives angina and syncope on exertion, because output cannot rise across the fixed valve. Red cells sheared on the calcified valve give microangiopathic haemolytic anaemia (schistocytes). **Why not D:** aortic regurgitation gives an early **diastolic** murmur.", "trap": "", "source": "L2 §2.3.1; CL p74–77", "sections": ["2.3"], "code": "CVS-L2-Q006", "concept": "aortic-stenosis", "objective": "Recognise calcific aortic stenosis and its complications", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L2", "section": "2.3", "sourceType": "New SBA"}, {"id": "L2-7", "test": "L2", "topic": "rhdvalve", "style": "Complication", "stem": ["A 38-year-old woman had rheumatic fever as a child. She has an opening snap with a diastolic rumble and an irregularly irregular pulse. Which complication is she at greatest risk of?"], "image": null, "imgQuery": null, "options": ["Microangiopathic haemolytic anaemia", "Concentric left ventricular hypertrophy", "Stroke from a left atrial mural thrombus", "Tricuspid infective endocarditis"], "answer": 2, "explanation": "Mitral stenosis dilates the LA. This leads to atrial fibrillation, mural thrombus and systemic emboli (stroke). **Why not B:** the LV is protected behind the stenosis, so it does not hypertrophy. **Why not A:** MAHA belongs to calcific aortic stenosis.", "trap": "", "source": "L2 §2.3.5; CL p91; CQ3, CQ9", "sections": ["2.3"], "code": "CVS-L2-Q007", "concept": "ms-af", "objective": "Predict the embolic complication of mitral stenosis", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L2", "section": "2.3", "sourceType": "New SBA"}, {"id": "L2-8", "test": "L2", "topic": "rhdvalve", "style": "Morphology", "stem": ["A tall 30-year-old woman with long fingers has a mid-systolic click followed by a regurgitant murmur at the apex. What is the underlying valve pathology?"], "image": null, "imgQuery": null, "options": ["Myxoid degeneration of the mitral leaflets", "Commissural fusion of the mitral valve", "Degenerative calcification of the mitral valve", "Vegetations along the line of closure"], "answer": 0, "explanation": "This is mitral valve prolapse in Marfan syndrome. Myxoid degeneration makes the valve floppy, so it balloons into the LA. B is chronic RHD.", "trap": "", "source": "L2 §2.3.3; CL p86–87; CQ52", "sections": ["2.3"], "code": "CVS-L2-Q008", "concept": "mvp", "objective": "Identify the pathology of mitral valve prolapse", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "A", "lecture": "L2", "section": "2.3", "sourceType": "New SBA"}, {"id": "L2-9", "test": "L2", "topic": "ie", "style": "Organism by setting", "stem": ["A 67-year-old man with iron-deficiency anaemia and weight loss has infective endocarditis. His blood cultures grow *Streptococcus bovis*. Which investigation is most important next?"], "image": null, "imgQuery": null, "options": ["Dental radiographs", "Bone marrow biopsy", "Renal biopsy", "Colonoscopy"], "answer": 3, "explanation": "*S. bovis* endocarditis is associated with an underlying **colorectal carcinoma**, which also fits his anaemia and weight loss. **Why not A:** dental work links to *S. viridans*, not *S. bovis*.", "trap": "", "source": "L2 §2.4.3; CL p103; QZ21", "sections": ["2.4"], "code": "CVS-L2-Q009", "concept": "ie-organism", "objective": "Link S. bovis endocarditis to colorectal carcinoma", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L2", "section": "2.4", "sourceType": "Previous-exam concept"}, {"id": "L2-10", "test": "L2", "topic": "ie", "style": "Clinical case", "stem": ["A 29-year-old injecting drug user has fever and a pansystolic murmur at the lower left sternal border. His chest X-ray shows multiple nodules in both lungs. Which organism and valve are most likely?"], "image": null, "imgQuery": null, "options": ["*Streptococcus viridans* — mitral valve", "*Staphylococcus aureus* — tricuspid valve", "*Staphylococcus epidermidis* — aortic valve", "HACEK organism — pulmonary valve"], "answer": 1, "explanation": "In IV drug users, the virulent *S. aureus* attacks normal valves, most often the **tricuspid**. Right-sided vegetations embolise to the lungs (the nodules). **Why not A:** *S. viridans* causes subacute IE on a previously damaged valve.", "trap": "", "source": "L2 §2.4.3; CL p102, p107", "sections": ["2.4"], "code": "CVS-L2-Q010", "concept": "ie-organism", "objective": "Match the IV drug user to organism and valve", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L2", "section": "2.4", "sourceType": "Previous-exam concept"}, {"id": "L2-11", "test": "L2", "topic": "ie", "style": "Comparison", "stem": ["A 58-year-old man with metastatic pancreatic adenocarcinoma has a stroke. His blood cultures are negative. At autopsy there are small, bland vegetations along the line of closure of the mitral valve, with no organisms and no inflammation. What is the diagnosis?"], "image": null, "imgQuery": null, "options": ["Libman–Sacks endocarditis", "Acute rheumatic endocarditis", "Marantic (NBTE) endocarditis", "Subacute infective endocarditis"], "answer": 2, "explanation": "NBTE vegetations are bland and non-destructive. They occur with a hypercoagulable state or adenocarcinoma (for example, pancreas), and they embolise. **Why not A:** Libman–Sacks vegetations are inflammatory, can sit on **both** sides of the leaflet, and occur in SLE.", "trap": "", "source": "L2 §2.4.1; CL p95, p113", "sections": ["2.4"], "code": "CVS-L2-Q011", "concept": "nbte-lse", "objective": "Distinguish NBTE from Libman–Sacks and infective vegetations", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "C", "lecture": "L2", "section": "2.4", "sourceType": "New SBA"}, {"id": "L2-12", "test": "L2", "topic": "ie", "style": "Image", "stem": ["A valve vegetation removed at surgery is shown.", "[[IMAGE]]", "Which feature shows th riction rub. What will his pericardium most likely look like?"], "image": null, "imgQuery": null, "options": ["Milky chylous fluid", "Thick calcified fibrous shell", "Clear serous transudate", "Shaggy fibrinous exudate"], "answer": 3, "explanation": "Uraemic pericarditis is fibrinous, the most common type. The rub comes from fibrin strands rubbing together. **Why not A:** chylous fluid means lymphatic obstruction. **Why not B:** a calcified shell is constrictive pericarditis (e.g. after TB).", "trap": "", "source": "L2 §2.6.3; CL p156–157; QZ49; CQ39", "sections": ["2.6"], "code": "CVS-L2-Q017", "concept": "pericarditis-types", "objective": "Recognise uraemic fibrinous pericarditis", "difficulty": "Application", "previousExam": true, "integrated": false, "imageBased": false, "correctAnswer": "D", "lecture": "L2", "section": "2.6", "sourceType": "Previous-exam concept"}, {"id": "L2-18", "test": "L2", "topic": "hf", "style": "Morphology", "stem": ["A 70-year-old man with long-standing left heart failure after an old MI dies of pneumonia. His alveoli contain many macrophages with brown granular pigment that stains blue with Prussian blue. What do these cells indicate?"], "image": null, "imgQuery": null, "options": ["Inhaled anthracotic dust", "Chronic passive congestion", "Pulmonary tuberculosis", "Aspiration of gastric contents"], "answer": 1, "explanation": "Congested alveolar capillaries leak red cells. Macrophages take up the haemoglobin and store it as haemosiderin (Prussian blue positive), forming \"heart-failure cells\" of chronic passive congestion. **Why not A:** anthracotic pigment is black carbon and is Prussian blue negative.", "trap": "", "source": "L2 §2.7.2; CL p144", "sections": ["2.7"], "code": "CVS-L2-Q018", "concept": "hf-left-right", "objective": "Interpret heart-failure cells", "difficulty": "Application", "previousExam": false, "integrated": false, "imageBased": false, "correctAnswer": "B", "lecture": "L2", "section": "2.7", "sourceType": "New SBA
