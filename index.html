"], "sections": ["1.5"]}, "dissection-death": {"name": "Aortic dissection: complications", "subs": ["1.5.3"], "sections": ["1.5"]}, "aneurysm-types": {"name": "Aneurysm classification", "subs": ["1.5.4"], "sections": ["1.5"]}, "syphilis-aneurysm": {"name": "Syphilitic thoracic aneurysm", "subs": ["1.5.5"], "sections": ["1.5"]}, "aaa": {"name": "Abdominal aortic aneurysm", "subs": ["1.5.6", "1.5.7"], "sections": ["1.5"]}, "vasc-basics": {"name": "Vasculitis: general", "subs": ["1.6.1"], "sections": ["1.6"]}, "vasc-size": {"name": "Vasculitis by vessel size", "subs": ["1.6.2"], "sections": ["1.6"]}, "large-vessel": {"name": "GCA and Takayasu arteritis", "subs": ["1.6.10", "1.6.3", "1.6.4"], "sections": ["1.6"]}, "pan": {"name": "Polyarteritis nodosa", "subs": ["1.6.5"], "sections": ["1.6"]}, "kawasaki": {"name": "Kawasaki disease", "subs": ["1.6.6"], "sections": ["1.6"]}, "buerger": {"name": "Buerger disease", "subs": ["1.6.7"], "sections": ["1.6"]}, "anca-vasculitis": {"name": "GPA, MPA and EGPA", "subs": ["1.6.8"], "sections": ["1.6"]}, "hsp": {"name": "IgA vasculitis (Henoch–Schönlein purpura)", "subs": ["1.6.9"], "sections": ["1.6"]}, "vasc-tumours": {"name": "Vascular tumours", "subs": ["1.7"], "sections": ["1.7"]}, "chd-groups": {"name": "Congenital heart disease: groups", "subs": ["2.1.1"], "sections": ["2.1"]}, "eisenmenger": {"name": "Eisenmenger syndrome", "subs": ["2.1.2"], "sections": ["2.1"]}, "asd": {"name": "Left-to-right shunts (ASD, VSD, PDA)", "subs": ["2.1.3"], "sections": ["2.1"]}, "cyanotic-chd": {"name": "Right-to-left shunts", "subs": ["2.1.4"], "sections": ["2.1"]}, "coarctation": {"name": "Coarctation of the aorta", "subs": ["2.1.5"], "sections": ["2.1"]}, "rf-mechanism": {"name": "Rheumatic fever: mechanism", "subs": ["2.2.1"], "sections": ["2.2"]}, "jones": {"name": "Jones criteria", "subs": ["2.2.2"], "sections": ["2.2"]}, "rhd": {"name": "Rheumatic carditis and chronic RHD", "subs": ["2.2.3", "2.2.4", "2.2.5"], "sections": ["2.2"]}, "aortic-stenosis": {"name": "Aortic stenosis", "subs": ["2.3.1"], "sections": ["2.3"]}, "ar": {"name": "Aortic regurgitation", "subs": ["2.3.2", "2.9.4"], "sections": ["2.3", "2.9"]}, "mvp": {"name": "Mitral valve prolapse", "subs": ["2.3.3"], "sections": ["2.3"]}, "mr": {"name": "Mitral regurgitation", "subs": ["2.3.4"], "sections": ["2.3"]}, "ms-af": {"name": "Mitral stenosis", "subs": ["2.3.5"], "sections": ["2.3"]}, "murmurs": {"name": "Murmur decoder", "subs": ["2.3.6"], "sections": ["2.3"]}, "nbte-lse": {"name": "Non-infective vegetations (NBTE, Libman–Sacks)", "subs": ["2.4.1"], "sections": ["2.4"]}, "ie-acute-subacute": {"name": "Acute vs subacute IE", "subs": ["2.4.2"], "sections": ["2.4"]}, "ie-organism": {"name": "IE organisms", "subs": ["2.4.3", "2.4.4"], "sections": ["2.4"]}, "ie-histology": {"name": "Vegetation microscopy", "subs": ["2.4.5"], "sections": ["2.4"]}, "ie-signs": {"name": "IE: signs and labs", "subs": ["2.4.6"], "sections": ["2.4"]}, "dcm": {"name": "Dilated cardiomyopathy", "subs": ["2.5.1", "2.5.5"], "sections": ["2.5"]}, "hcm": {"name": "Hypertrophic cardiomyopathy", "subs": ["2.5.2"], "sections": ["2.5"]}, "arvc": {"name": "ARVC", "subs": ["2.5.3"], "sections": ["2.5"]}, "rcm": {"name": "Restrictive cardiomyopathy", "subs": ["2.5.4"], "sections": ["2.5"]}, "myocarditis": {"name": "Myocarditis", "subs": ["2.6.1"], "sections": ["2.6"]}, "tamponade": {"name": "Pericardial effusion and tamponade", "subs": ["2.6.2"], "sections": ["2.6"]}, "pericarditis-types": {"name": "Types of pericarditis", "subs": ["2.6.3"], "sections": ["2.6"]}, "constrictive": {"name": "Constrictive pericarditis", "subs": ["2.6.4"], "sections": ["2.6"]}, "hf-compensation": {"name": "Heart failure: compensation", "subs": ["2.7.1"], "sections": ["2.7"]}, "hf-left-right": {"name": "Left vs right heart failure", "subs": ["2.7.2"], "sections": ["2.7"]}, "cardiac-tumours": {"name": "Cardiac tumours", "subs": ["2.8"], "sections": ["2.8"]}, "stroke-source": {"name": "Cardiac sources of stroke", "subs": ["2.9.1"], "sections": ["1.3", "2.9"]}}, "review": {"facts": [{"q": "What is the earliest visible lesion of atherosclerosis?", "a": "The **fatty streak**: foamy macrophages in the intima.", "why": "Examiners contrast it with the raised fibrofatty plaque, which comes later and narrows the lumen.", "sub": "1.1.4", "concept": "athero-path"}, {"q": "What degree of fixed coronary stenosis causes stable angina?", "a": "**≥75%** (critical stenosis).", "why": "This is the only critical-stenosis figure used in the course.", "sub": "1.2.2", "concept": "angina-types"}, {"q": "What is the coronary lesion of unstable angina?", "a": "**Plaque rupture with a partial (non-occlusive) thrombus.**", "why": "It is reversible but carries a high risk of progressing to MI.", "sub": "1.2.3", "concept": "acs-plaque"}, {"q": "What causes Prinzmetal angina?", "a": "**Coronary vasospasm**, with transient ST elevation and no enzyme rise.", "why": "It is the classic exception to \"ST elevation means infarction\".", "sub": "1.2.3", "concept": "angina-types"}, {"q": "Which coronary artery is occluded most often in MI, and which region does it supply?", "a": "The **LAD (45%)**: the anterior wall and anterior septum.", "why": "Territory questions pair the LAD with the anterior septum and the RCA with the posterior wall and papillary muscles.", "sub": "1.3.3", "concept": "mi-territory"}, {"q": "Which marker detects reinfarction a few days after an MI?", "a": "**CK-MB**, because it returns to normal by 72 h.", "why": "Troponin I stays raised for 7–10 days, so a new rise cannot be seen.", "sub": "1.3.4", "concept": "mi-biomarkers"}, {"q": "What does contraction-band necrosis indicate?", "a": "**Reperfusion** of irreversibly injured myocardium (calcium influx). It is also seen with cocaine.", "why": "It is the classic histology after fibrinolysis or angioplasty.", "sub": "1.3.5", "concept": "reperfusion"}, {"q": "What is the characteristic complication 1–3 days after an MI?", "a": "**Fibrinous pericarditis** (the neutrophil stage).", "why": "A friction rub at day 2–3 is a favourite stem.", "sub": "1.3.6", "concept": "mi-timeline"}, {"q": "When does myocardial rupture after MI peak?", "a": "**Day 4–7**, when macrophages are clearing dead muscle and no collagen has formed.", "why": "Timing is the clue that separates rupture from early arrhythmia and late aneurysm.", "sub": "1.3.6", "concept": "mi-rupture"}, {"q": "What does papillary muscle rupture after MI cause?", "a": "**Acute mitral regurgitation**: a new holosystolic murmur with pulmonary oedema.", "why": "It is distinguished from free-wall rupture, which causes tamponade.", "sub": "1.3.7", "concept": "mi-rupture"}, {"q": "Which arteriolar lesion is seen in benign hypertension and diabetes?", "a": "**Hyaline arteriolosclerosis** (pink, homogeneous wall thickening).", "why": "Onion-skin change and fibrinoid necrosis belong to malignant hypertension instead.", "sub": "1.4.3", "concept": "hyaline"}, {"q": "What does the kidney look like in pure malignant hypertension?", "a": "**Flea-bitten**: pinpoint petechial haemorrhages from ruptured arterioles and capillaries.", "why": "Benign nephrosclerosis gives small, leather-grain kidneys.", "sub": "1.4.4", "concept": "htn-malignant"}, {"q": "What are heart-failure cells, and what do they indicate?", "a": "**Haemosiderin-laden alveolar macrophages**, showing chronic passive congestion of the lungs (left heart failure).", "why": "They are Prussian blue positive, which separates them from inhaled carbon.", "sub": "2.7.2", "concept": "hf-left-right"}, {"q": "How does hypertension weaken the aortic media in older adults?", "a": "**Hyaline arteriolosclerosis of the vasa vasorum** → less flow → medial atrophy.", "why": "Marfan or Ehlers–Danlos syndrome (cystic medial degeneration) is the young patient's mechanism.", "sub": "1.5.2", "concept": "dissection-mech"}, {"q": "What is the classic immediate cause of death in proximal aortic dissection?", "a": "**Haemopericardium with cardiac tamponade**; the course lists it as the most common cause of death.", "why": "It is chosen over coronary thrombosis in \"most lethal\" questions.", "sub": "1.5.3", "concept": "dissection-death"}, {"q": "What causes a thoracic aneurysm with a tree-bark intima?", "a": "**Tertiary syphilis** (endarteritis of the vasa vasorum), which leads to aortic regurgitation.", "why": "AAA is atherosclerotic; the thoracic syphilitic aneurysm is the contrast.", "sub": "1.5.5", "concept": "syphilis-aneurysm"}, {"q": "What is the most common primary cardiac tumour in adults, and where does it arise?", "a": "**Myxoma**, usually a pedunculated mass in the **left atrium**.", "why": "It can block the mitral valve (syncope) or embolise (stroke).", "sub": "2.8", "concept": "cardiac-tumours"}, {"q": "What is the first step when giant cell arteritis is suspected?", "a": "**Start high-dose corticosteroids immediately.** Do not wait for the biopsy.", "why": "Steroids prevent blindness, and a negative biopsy does not exclude GCA.", "sub": "1.6.3", "concept": "large-vessel"}, {"q": "Which vasculitis spares the lung and is linked to HBsAg?", "a": "**Polyarteritis nodosa.**", "why": "\"Spares the lung\" separates PAN from GPA, MPA and EGPA.", "sub": "1.6.5", "concept": "pan"}, {"q": "What is the main cause of serious illness and death in Kawasaki disease?", "a": "**Coronary artery aneurysm or thrombosis**, leading to MI.", "why": "It explains why an MI can occur in a young child.", "sub": "1.6.6", "concept": "kawasaki"}, {"q": "Which ANCA-associated vasculitis has necrotising granulomas and c-ANCA?", "a": "**GPA (formerly Wegener granulomatosis).**", "why": "MPA has no granulomas and p-ANCA; EGPA has asthma, eosinophils and p-ANCA.", "sub": "1.6.8", "concept": "anca-vasculitis"}, {"q": "What is the most common congenital heart disease?", "a": "**Ventricular septal defect.**", "why": "Large, untreated defects lead to Eisenmenger syndrome.", "sub": "2.1.3", "concept": "asd"}, {"q": "Which ASD is associated with Down syndrome?", "a": "**Ostium primum.**", "why": "Ostium secundum is the commonest ASD overall (90%), so it is the usual distractor.", "sub": "2.1.3", "concept": "asd"}, {"q": "What keeps the ductus arteriosus open in transposition of the great arteries?", "a": "**PGE₁.**", "why": "Indomethacin does the opposite: it closes a PDA.", "sub": "2.1.4", "concept": "cyanotic-chd"}, {"q": "What is the characteristic lesion of acute rheumatic myocarditis?", "a": "The **Aschoff body**, containing **Anitschkow cells** (wavy \"caterpillar\" nuclei).", "why": "Myocarditis is the main cause of death in the acute phase of rheumatic fever.", "sub": "2.2.3", "concept": "rhd"}, {"q": "Which endocarditis organism points to an underlying colorectal carcinoma?", "a": "***Streptococcus bovis.***", "why": "The next step in the stem is colonoscopy.", "sub": "2.4.3", "concept": "ie-organism"}, {"q": "Which vegetations can occur on both surfaces of the valve leaflet?", "a": "**Libman–Sacks** vegetations (SLE).", "why": "Rheumatic and NBTE vegetations sit on the line of closure.", "sub": "2.4.1", "concept": "nbte-lse"}, {"q": "What is the histological hallmark of hypertrophic cardiomyopathy?", "a": "**Myofibre hypertrophy with disarray.**", "why": "It is the autopsy finding in the young athlete who collapses while running.", "sub": "2.5.2", "concept": "hcm"}, {"q": "What is the classic ECG sign of cardiac amyloidosis?", "a": "A **low-voltage ECG** (small QRS complexes), from restrictive cardiomyopathy.", "why": "Amyloid is the classic answer to \"a cause of restrictive cardiomyopathy\".", "sub": "2.5.4", "concept": "rcm"}, {"q": "What type of pericarditis does uraemia cause?", "a": "**Fibrinous (\"bread-and-butter\") pericarditis**, with a friction rub.", "why": "Fibrinous is the most common type of pericarditis.", "sub": "2.6.3", "concept": "pericarditis-types"}], "comparisons": [{"id": "angina", "title": "Stable vs unstable vs Prinzmetal angina", "sub": "1.2.3", "md": "|  | Stable | Unstable | Prinzmetal |\n| --- | --- | --- | --- |\n| Trigger | Exertion or emotion | **At rest** / crescendo | **Unrelated to exertion** |\n| Lesion | Fixed **≥75%** stenosis | **Plaque rupture + partial thrombus** | **Vasospasm** |\n| ECG | ST depression | ST depression | **ST elevation** (transient) |\n| Troponin | Normal | Normal | Normal |\n| Key point | Demand ischaemia | **High risk of MI** | Relieved by a calcium-channel blocker |"}, {"id": "mi-extent", "title": "Subendocardial vs transmural MI", "sub": "1.3.2", "md": "|  | Subendocardial | Transmural |\n| --- | --- | --- |\n| Extent | **<50%** of wall thickness | Most of the wall |\n| Usual cause | Partial occlusion; the initial phase | **Total occlusion** |\n| ECG | **ST depression** | **ST elevation** (STEMI) |\n| Troponin | Raised | Raised |"}, {"id": "rupture-spasm", "title": "Plaque rupture vs vasospasm", "sub": "1.2.2", "md": "|  | Plaque rupture with thrombus | Vasospasm |\n| --- | --- | --- |\n| What happens | Rupture → haemorrhage into plaque → thrombus | Transient constriction of the artery |\n| Syndromes | Unstable angina, MI, sudden death | **Prinzmetal angina** (and a less common cause of MI) |\n| Plaque needed? | Yes, often only mildly stenosing | **No** fixed stenosis needed |\n| ECG | ST depression (partial) or ST elevation (total occlusion) | Transient **ST elevation** |"}, {"id": "pericarditis", "title": "Fibrinous vs purulent pericarditis", "sub": "2.6.3", "md": "|  | Fibrinous | Purulent |\n| --- | --- | --- |\n| Causes | **Uraemia, MI (1–3 d), Dressler**, RF, SLE | Staphylococci, streptococci, pneumococci |\n| Appearance | Shaggy **\"bread-and-butter\"** surface | Pus |\n| Clinical | **Friction rub**; the most common type | High fever, rigors, rub |\n| Healing | May leave adhesions | Usually heals by **scarring** |"}, {"id": "ie-nbte", "title": "Infective endocarditis vs NBTE", "sub": "2.4.1", "md": "|  | Infective | NBTE (marantic) |\n| --- | --- | --- |\n| Vegetation | **Large, irregular, friable** | Small–medium, **bland** |\n| Organisms | **Present** (bacterial colonies) | None; cultures **negative** |\n| Valve | **Destroyed** | Not destroyed |\n| Setting | Bacteraemia ± damaged valve | **Hypercoagulable state / adenocarcinoma** |\n| Shared risk | Emboli | **Emboli** (e.g. stroke) |\n| Also remember | — | Libman–Sacks (SLE) = **both** sides of the leaflet |"}, {"id": "constrict-tamponade", "title": "Constrictive pericarditis vs cardiac tamponade", "sub": "2.6.4", "md": "|  | Cardiac tamponade | Constrictive pericarditis |\n| --- | --- | --- |\n| Time course | **Rapid** accumulation of fluid, blood or pus | **Chronic** |\n| Pericardium | Distended sac full of fluid | **Thick, calcified fibrous shell** |\n| Effect | Heart cannot fill → output falls → cardiogenic shock | Restricted diastolic filling; the heart is **small** |\n| Causes | MI free-wall rupture, dissection, trauma, malignancy | **TB**, severe suppurative pericarditis |\n| Management | **Urgent pericardial drainage** | — |\n| Also compare | — | Restrictive cardiomyopathy: the **myocardium** is stiff (amyloid) |"}, {"id": "hcm-dcm", "title": "HCM vs DCM", "sub": "2.5.5", "md": "|  | Hypertrophic (HCM) | Dilated (DCM) |\n| --- | --- | --- |\n| Chambers | Thick LV, **asymmetric septum**, small cavity | **All four dilated** |\n| Failure | **Diastolic** (+ outflow obstruction) | **Systolic** |\n| Genetics | **AD sarcomere** mutations (β-myosin heavy chain) | **Titin** (~20%) |\n| Other causes | — | Coxsackie myocarditis, alcohol, doxorubicin, pregnancy, haemochromatosis |\n| Histology | **Myofibre disarray** | Non-specific |\n| Signature | **Sudden death in young athletes**; exertional syncope | Biventricular CHF; AV-valve regurgitation |"}, {"id": "anca", "title": "GPA vs MPA vs EGPA", "sub": "1.6.8", "md": "|  | GPA (formerly Wegener) | Microscopic polyangiitis | EGPA (formerly Churg–Strauss) |\n| --- | --- | --- | --- |\n| Organs | **Nose + lung + kidney** | Lung + kidney | Lung + heart |\n| Clues | Sinusitis, nasal ulcer, RPGN | **No ENT disease** | **Asthma + eosinophilia** |\n| Granulomas | **Yes**, necrotising | **No** | Yes, with eosinophils |\n| ANCA | **c-ANCA** | p-ANCA | p-ANCA |"}, {"id": "aneurysm-dissection", "title": "Aneurysm vs dissection", "sub": "1.5.4", "md": "|  | True aneurysm | False aneurysm | Dissection |\n| --- | --- | --- | --- |\n| Definition | Localised dilation | Breach in the wall | **Intimal tear**; blood splits the **media** |\n| Wall | **All layers** | Extravascular haematoma with a fibrous wall | Intima and media separated |\n| Typical cause | Atherosclerosis (AAA), syphilis (thoracic) | Trauma, e.g. catheterisation | HTN (older), Marfan/EDS (young) |\n| Main danger | Rupture (AAA) | Rupture | **Tamponade** (proximal) |"}, {"id": "htn", "title": "Benign vs malignant hypertension", "sub": "1.4.2", "md": "|  | Benign | Malignant |\n| --- | --- | --- |\n| BP | Moderate, rising slowly | Rapid, marked rise (course threshold ≥200/120) |\n| Features | Silent until MI or stroke | **Papilloedema**, retinal haemorrhages, encephalopathy, renal failure |\n| Arterioles | **Hyaline** arteriolosclerosis | **Onion-skin** + **fibrinoid necrosis** |\n| Kidney | Small, **leather-grain** | **Flea-bitten** (pure form enlarged) |"}], "morphology": [{"finding": "Contraction bands (dense transverse eosinophilic bands in myocytes)", "dx": "Reperfusion injury after fibrinolysis or angioplasty; also cocaine", "how": "H&E", "sub": "1.3.5"}, {"finding": "Onion-skin concentric layers of smooth muscle in arterioles", "dx": "Hyperplastic arteriolosclerosis of malignant hypertension", "how": "H&E, renal biopsy", "sub": "1.4.3"}, {"finding": "Flea-bitten kidney (pinpoint petechiae on the surface)", "dx": "Malignant nephrosclerosis", "how": "Gross", "sub": "1.4.4"}, {"finding": "Tree-bark wrinkling of the aortic intima", "dx": "Syphilitic (thoracic) aortitis", "how": "Gross", "sub": "1.5.5"}, {"finding": "Fragmented elastic fibres with proteoglycan-filled \"cysts\"", "dx": "Cystic medial degeneration (Marfan, Ehlers–Danlos) → dissection", "how": "Elastic stain", "sub": "1.5.2"}, {"finding": "Aschoff body with Anitschkow (\"caterpillar\") cells", "dx": "Acute rheumatic myocarditis", "how": "H&E", "sub": "2.2.3"}, {"finding": "Fish-mouth mitral valve with thick, fused chordae", "dx": "Chronic rheumatic heart disease (mitral stenosis)", "how": "Gross, viewed from the left atrium", "sub": "2.2.5"}, {"finding": "Myofibre hypertrophy with disarray", "dx": "Hypertrophic cardiomyopathy", "how": "H&E", "sub": "2.5.2"}, {"finding": "Apple-green birefringence", "dx": "Cardiac amyloidosis (restrictive cardiomyopathy)", "how": "Congo red under polarised light", "sub": "2.5.4"}, {"finding": "Shaggy \"bread-and-butter\" epicardium", "dx": "Fibrinous pericarditis (uraemia, MI, Dressler)", "how": "Gross", "sub": "2.6.3"}], "traps": [{"trap": "ST elevation always means infarction.", "remember": "Transient ST elevation with a normal troponin is **Prinzmetal vasospasm**.", "sub": "1.2.3", "concept": "angina-types"}, {"trap": "ST depression means angina, not infarction.", "remember": "ST depression occurs in stable angina, unstable angina **and** subendocardial MI. **Troponin** separates infarction from angina.", "sub": "1.3.2", "concept": "mi-extent"}, {"trap": "Troponin shows a new infarction on day 5.", "remember": "Troponin stays raised for 7–10 days. **CK-MB** (normal by 72 h) detects reinfarction.", "sub": "1.3.4", "concept": "mi-biomarkers"}, {"trap": "A calcified artery is atherosclerosis.", "remember": "Calcium in the **media** with an **open lumen** is Mönckeberg sclerosis. Atherosclerosis is an **intimal** plaque.", "sub": "1.1.1", "concept": "monckeberg"}, {"trap": "Wait for the temporal artery biopsy before treating.", "remember": "Start **steroids now**. The lesions are segmental, so a negative biopsy does not exclude GCA.", "sub": "1.6.3", "concept": "large-vessel"}, {"trap": "Marfan syndrome is the usual cause of aortic dissection.", "remember": "In **older adults** the usual cause is **hypertension** (vasa vasorum → medial atrophy). Marfan/EDS is the **young** patient.", "sub": "1.5.2", "concept": "dissection-mech"}, {"trap": "HIV causes Kaposi sarcoma.", "remember": "Kaposi sarcoma is associated with **HHV-8**. HIV supplies the immunosuppression.", "sub": "1.7", "concept": "vasc-tumours"}, {"trap": "Titin is an HCM gene.", "remember": "**Titin = DCM.** β-myosin heavy chain and myosin-binding protein C = HCM.", "sub": "2.5.1", "concept": "dcm"}, {"trap": "A raised ASO titre is a Jones criterion.", "remember": "The ASO is the **evidence of infection**. Diagnosis needs **2 major**, or **1 major + 2 minor**, criteria.", "sub": "2.2.2", "concept": "jones"}, {"trap": "Osler nodes are painless.", "remember": "**Osler = Ouch** (painful finger-pulp nodules). **Janeway** lesions are painless, on the palms and soles.", "sub": "2.4.6", "concept": "ie-signs"}], "review15": [{"mins": "Minutes 1–5", "title": "Vascular disease", "points": ["Atherosclerosis is **intimal**: abdominal aorta > coronaries > popliteal > internal carotid. The **fatty streak** is the earliest lesion.", "**Mönckeberg** = medial calcification with an open lumen, usually insignificant.", "**Hyaline** arteriolosclerosis = benign HTN/diabetes. **Onion-skin + fibrinoid necrosis** = malignant HTN (**flea-bitten** kidney).", "**Dissection**: intimal tear + weak media. Older = HTN (vasa vasorum); young = Marfan/EDS (cystic medial degeneration). Death by **tamponade**.", "**Syphilis** → thoracic aneurysm (tree bark) → AR. **Atherosclerosis** → infrarenal **AAA** (rupture; course cut-off >5 cm).", "**GCA**: old woman, markedly raised ESR, jaw claudication → **steroids now**. **Takayasu**: young Asian woman, absent arm pulses.", "**PAN** spares the lung (HBsAg). **Kawasaki** → coronary aneurysm (aspirin + IVIG). **Buerger** → smoker, digital gangrene.", "**GPA** = granulomas + c-ANCA. **MPA** = no granulomas + p-ANCA. **EGPA** = asthma + eosinophils. **IgA vasculitis (HSP)** = child, palpable purpura.", "**Kaposi** = HHV-8. Liver **angiosarcoma** = PVC, arsenic, Thorotrast."]}, {"mins": "Minutes 6–10", "title": "Ischaemic heart disease and MI", "points": ["Stable angina = fixed **≥75%** stenosis, ST depression. Unstable = **plaque rupture + partial thrombus**. Prinzmetal = **vasospasm**, ST elevation.", "**Sudden cardiac death** = within 1 h, usually arrhythmia, often **no infarct** visible.", "Subendocardial MI = ST depression; transmural = ST elevation. **Troponin** separates MI from angina.", "**LAD** (45%) → anterior wall + septum. **RCA** → posterior wall + papillary muscles. Circumflex → lateral wall.", "**Troponin I** stays up 7–10 days; **CK-MB** normal by 72 h → detects reinfarction.", "**Contraction bands** = reperfusion (Ca²⁺ influx), or cocaine.", "Timeline: <4 h nothing → 4–24 h coagulative necrosis → 1–3 d **neutrophils** (fibrinous pericarditis) → 4–7 d **macrophages** (rupture) → 1–3 wk **granulation tissue** → months **scar** (aneurysm, mural thrombus, Dressler).", "Rupture: papillary muscle → **acute MR**; septum → **shunt**; free wall → **tamponade**."]}, {"mins": "Minutes 11–15", "title": "Structural, valvular, infective and myocardial disease", "points": ["L→R: **VSD** (commonest), **ASD** (primum = Down; paradoxical emboli), **PDA** (rubella, machinery murmur). Long-standing → **Eisenmenger**.", "R→L \"T\" lesions: **tetralogy** (PROV, squatting, boot-shaped), transposition (**PGE₁**), truncus, tricuspid atresia. Adult **coarctation**: rib notching, bicuspid valve.", "**Rheumatic fever**: molecular mimicry; **Aschoff bodies/Anitschkow cells**; Jones = 2 major or 1 major + 2 minor. Chronic RHD → **fish-mouth mitral stenosis** → LA dilation → AF → stroke.", "**Aortic stenosis**: calcific (>60, earlier if bicuspid), syncope, angina, schistocytes. **AR**: wide pulse pressure. **MVP**: myxoid, mid-systolic click.", "IE organisms: *S. viridans* (damaged valve), ***S. aureus*** (IVDU, tricuspid), *S. epidermidis* (prosthetic), ***S. bovis*** (colon cancer), HACEK (culture-negative). **Osler = painful.**", "**Libman–Sacks** = SLE, both sides of the leaflet. **NBTE** = adenocarcinoma, bland, embolises.", "**DCM** = systolic, titin/Coxsackie/alcohol. **HCM** = AD sarcomere, **disarray**, young athletes. **ARVC** = fatty RV. **RCM** = amyloid, low-voltage ECG.", "Myocarditis = **Coxsackie**, lymphocytes + necrosis. **Fibrinous** pericarditis = uraemia; chylous = lymphatics; haemorrhagic = malignancy/TB.", "Left HF → pulmonary oedema, **heart-failure cells**. Right HF → JVD, **nutmeg liver**. **Myxoma** = adult LA; **rhabdomyoma** = child, tuberous sclerosis."]}]}, "topics": {"athero": {"name": "Atherosclerosis & arteriosclerosis", "sections": ["1.1"]}, "ihd": {"name": "Ischaemic heart disease", "sections": ["1.2"]}, "mi": {"name": "Myocardial infarction", "sections": ["1.3"]}, "htn": {"name": "Hypertension, arteriolosclerosis & hypertensive heart", "sections": ["1.4"]}, "aorta": {"name": "Aortic dissection & aneurysms", "sections": ["1.5"]}, "vasculitis": {"name": "Vasculitis", "sections": ["1.6"]}, "vtumour": {"name": "Vascular tumours", "sections": ["1.7"]}, "chd": {"name": "Congenital heart disease", "sections": ["2.1"]}, "rhdvalve": {"name": "Rheumatic & valvular disease", "sections": ["2.2", "2.3"]}, "ie": {"name": "Endocarditis", "sections": ["2.4"]}, "cm": {"name": "Cardiomyopathies", "sections": ["2.5"]}, "myoperi": {"name": "Myocarditis & pericardial disease", "sections": ["2.6"]}, "hf": {"name": "Heart failure", "sections": ["2.7"]}, "ctumour": {"name": "Cardiac tumours", "sections": ["2.8"]}, "integrated": {"name": "Integrated cardiovascular pathology", "sections": ["2.9"]}}, "tests": {"L1": {"title": "Lecture 1 assessment", "sub": "Vascular Disease and the Ischaemic Heart", "minutes": 30}, "L2": {"title": "Lecture 2 assessment", "sub": "Structural, Valvular, Infective and Myocardial Heart function highlight(root, q) {

  nodes.forEach(function (tn) { var span = document.createElement('span'); span.innerHTML = esc(tn.nodeValue).replace(re, '<mark>$1</mark>'); tn.parentNode.replaceChild(span, tn); });

/* ---------------- SEARCH ---------------- */
function plain(s) { return String(s).replace(/\*\*|\*|\||#/g, ' ').replace(/\s+/g, ' '); }
function viewSearch(q) {
  $('#gsearch').value = q;
  var ql = q.toLowerCase(), hits = [];
  function add(kind, where, title, text, href, sub) {
    var t = plain(text), idx = t.toLowerCase().indexOf(ql), inTitle = plain(title).toLowerCase().indexOf(ql) >= 0;
    if (idx >= 0 || inTitle) hits.push({ kind: kind, where: where, title: title, href: href, hl: sub, snip: idx >= 0 ? t.slice(Math.max(0, idx - 70), idx + ql.length + 90) : t.slice(0, 150) });
  }
  function topicOf(sec) { var k = SEC_TOPIC[sec] || SEC_TOPIC[String(sec).split('.').slice(0, 2).join('.')]; return k ? D.topics[k].name : ''; }
  D.lectures.forEach(function (L) {
    L.sections.forEach(function (s) {
      add('Lecture', 'Lecture ' + L.num + ' · Section ' + s.id + (topicOf(s.id) ? ' · ' + topicOf(s.id) : ''), s.id + ' ' + s.title, s.intro, secLink(s.id), true);
      s.subs.forEach(function (u) { add('Lecture', 'Lecture ' + L.num + ' · Section ' + s.id + (topicOf(s.id) ? ' · ' + topicOf(s.id) : ''), u.id + ' ' + u.title, u.md, subLink(u.id), true); });
    });
  });
  RV.facts.forEach(function (f, i) { add('Fact', '30 facts · ' + subTitle(f.sub), 'Fact ' + (i + 1) + ': ' + f.q, f.a + ' ' + f.why, '#/review/facts'); });
  RV.comparisons.forEach(function (c) { add('Comparison', 'Comparisons · ' + subTitle(c.sub), c.title, c.md, '#/review/compare'); });
  RV.morphology.forEach(function (m) { add('Morphology', 'Morphology · ' + subTitle(m.sub), m.finding, m.dx + ' ' + m.how, '#/review/morph'); });
  RV.traps.forEach(function (t) { add('Exam trap', 'Exam traps · ' + subTitle(t.sub), t.trap, t.remember, '#/review/traps'); });
  app.appendChild(h('<h1>Search: “' + esc(q) + '”</h1>'));
  var kinds = {}; hits.forEach(function (x) { kinds[x.kind] = (kinds[x.kind] || 0) + 1; });
  app.appendChild(h('<p class="muted">' + hits.length + ' result(s)' + (hits.length ? ': ' + Object.keys(kinds).map(function (k) { return kinds[k] + ' ' + k.toLowerCase() + (kinds[k] > 1 ? 's' : ''); }).join(', ') : '') + '. Searched the lectures, 30 facts, comparisons, morphology associations and exam traps.</p>'));
  var list = h('<div class="grid"></div>'), re = new RegExp('(' + esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  hits.forEach(function (x) {
    var a = h('<a class="card" style="text-decoration:none;color:inherit" href="' + x.href + '"><div class="small muted"><span class="pill">' + esc(x.kind) + '</span> ' + esc(x.where) + '</div><b style="color:var(--navy)">' + esc(plain(x.title)) + '</b><div class="small">…' + esc(x.snip).replace(re, '<mark>$1</mark>') + '…</div></a>');
    if (x.hl) a.addEventListener('click', function () { searchHighlight = q; });
    list.appendChild(a);
  });
  if (!hits.length) list.appendChild(h('<div class="card">Nothing found. Try a shorter word (for example “Kawasaki”, “troponin”, “Aschoff”).</div>'));
  app.appendChild(list);
}

function checkState() { return store.get('checks', {}); }
function saveCheck(id, ok) { var s = checkState(); s[id] = { ok: ok, at: Date.now() }; store.set('checks', s); }
function shuffleIdx(n, seed) { var a = []; for (var i = 0; i < n; i++) a.push(i); var x = 0; for (var j = 0; j < seed.length; j++) x = (x * 31 + seed.charCodeAt(j)) >>> 0; for (var k = n - 1; k > 0; k--) { x = (x * 1103515245 + 12345) >>> 0; var r = x % (k + 1); var t = a[k]; a[k] = a[r]; a[r] = t; } return a; }
var TYPE_NAMES = { tf: 'True / False', fill: 'Fill in the blanks', match: 'Matching', sort: 'Sort into groups', select: 'Select all that apply', mcq: 'Single best answer' };
function renderCheck(c) {
  var prev = checkState()[c.id];
  var box = h('<div class="check" id="c-' + slug(c.id) + '"><div class="hd"><b>' + esc(c.id) + '</b> · ' + TYPE_NAMES[c.type] + (prev ? ' · <span class="pill ' + (prev.ok ? 'good' : 'bad') + '">' + (prev.ok ? 'answered correctly before' : 'try again') + '</span>' : '') + '</div><div class="qb"></div><div class="row" style="margin-top:10px"><button class="btn primary chk">Check answer</button><button class="btn ghost rst">Reset</button></div><div class="fbx"></div></div>');

  }
  if (c.type === 'tf' || c.type === 'mcq' || c.type === 'select') {
    var opts = c.type === 'tf' ? ['True', 'False'] : c.options;
    qb.innerHTML = '<p style="margin:.2em 0"><b>' + inl(c.q) + '</b></p><div class="opts" role="' + (c.type === 'select' ? 'group' : 'radiogroup') + '"></div>';
    var og = $('.opts', qb);
    opts.forEach(function (o, i) {
      var b = h('<button class="opt" type="button" aria-pressed="false"><span class="L">' + (c.type === 'tf' ? (i ? 'F' : 'T') : LETTERS[i]) + '</span><span>' + inl(o) + '</span></button>');
      b.onclick = function () {
        if (box.dataset.done) return;
        if (c.type === 'select') { var k = sel.indexOf(i); if (k >= 0) sel.splice(k, 1); else sel.push(i); }
        else sel = [i];
        $$('.opt', og).forEach(function (x, j) { var on = sel.indexOf(j) >= 0; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
      };
      og.appendChild(b);
    });
    $('.chk', box).onclick = function () {
      if (!sel.length) { toast('Choose an answer first.'); return; }
      var right = c.type === 'tf' ? [c.answer ? 0 : 1] : c.type === 'mcq' ? [c.answer] : c.answer;
      var ok = sel.length === right.length && sel.every(function (x) { return right.indexOf(x) >= 0; });
      $$('.opt', og).forEach(function (x, j) { x.classList.remove('sel'); if (right.indexOf(j) >= 0) x.classList.add('right'); else if (sel.indexOf(j) >= 0) x.classList.add('wrong'); x.disabled = true; });
      box.dataset.done = 1; feedback(ok, ok ? '' : 'Correct: ' + right.map(function (r) { return c.type === 'tf' ? (r ? 'False' : 'True') : LETTERS[r]; }).join(', ') + '.');
    };
  } else if (c.type === 'fill') {
    var n = 0;
    qb.innerHTML = '<p style="line-height:2.1">' + inl(c.q).replace(/\[ blank \]/g, function () { var i = n++; return '<label class="sr-only" for="' + slug(c.id) + '-b' + i + '">Blank ' + (i + 1) + '</label><input class="blank" id="' + slug(c.id) + '-b' + i + '" autocomplete="off">'; }) + '</p>';
    $('.chk', box).onclick = function () {

    };
  } else if (c.type === 'match' || c.type === 'sort') {
    var left = c.type === 'match' ? c.left : c.items.map(function (x) { return x[0]; });
    var right = c.type === 'match' ? c.right : c.groups;
    var key = c.type === 'match' ? c.key : c.items.map(function (x) { return x[1]; });
    qb.innerHTML = '<p style="margin:.2em 0"><b>' + inl(c.q) + '</b></p>';
    var order = c.type === 'match' ? right.map(function (_, i) { return i; }) : right.map(function (_, i) { return i; });
    left.forEach(function (l, i) {

    });

    '<div class="co clar"><p><b>Formative revision and practice — not a secure high-stakes examination system.</b> A single HTML file has no server. The questions and answer keys are inside the file, so a determined student can read them. Results cannot reach you automatically. The teacher password protects only this computer\'s portal. Name and Student ID are typed by the student and are not verified. Result files carry a check value that flags casual editing, but it is not proof against a determined student.</p></div>' +
    '<h3>For official examinations</h3><p>Use <b>server-side delivery and scoring with authenticated users</b>: questions sent one at a time from the server, answers scored on the server, students signed in with university accounts, and results written to a database only the teacher can read.</p>' +
    '<h3>Minimal backend for real deployment</h3><p>For automatic collection and secure teacher access, the same content can be moved onto the shared Google Apps Script backend your other pathology modules already use (one Code.gs Web App, a Google Sheet for results, server-side teacher password, student sign-in). No other server is needed. Ask for “CVS review — connected version” when you want that.</p>' +
    '<h3>Hosting</h3><p>Upload this file as <code>index.html</code> to a GitHub Pages repository (or any web host, or share the file directly — it works offline). Each student\'s progress stays in their own browser.</p></div>'));

window.__cvs = { D: D, md: md, buildDeck: buildDeck, gradeAttempt: gradeAttempt, srv: SRV };

<script>/* CVS Exam Review — bootloader.
   Offline revision edition: starts the app from the embedded data at once.
   Connected edition: signs the user in with the PLATFORM's existing account system (studentLogin / login on the
   shared backend, module "cvs"), receives the course-content key only after a successful sign-in, decrypts the
   course content in the browser and starts the app with a server connection (CX). The question bank and answer
   keys are NOT in this file — they are only on the server. */
(function () {
  'use strict';
  function ready(fn) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn(); }
  ready(function () {
    var enc = document.getElementById('cvs-enc');
    if (!enc) { window.CVS_MAIN(JSON.parse(document.getElementById('cvs-data').textContent), null); return; }
    connected(enc);
  });

  function connected(enc) {
    var conf = JSON.parse(document.getElementById('cvs-conf').textContent);
    var MODULE = conf.module || 'cvs', LS = window.localStorage, SS = window.sessionStorage;
    var K_STU = 'cvs_stu_session_v1', K_T = 'cvs_teacher_session_v1', K_URL = 'cvs_backend_url', K_MSG = 'cvs_boot_msg';
    function lget(k, st) { try { return (st || LS).getItem(k); } catch (e) { return null; } }
    function lset(k, v, st) { try { (st || LS).setItem(k, v); } catch (e) { } }
    function ldel(k) { try { LS.removeItem(k); SS.removeItem(k); } catch (e) { } }
    function url() { return String(conf.backendUrl || lget(K_URL) || '').trim(); }
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    /* Apps Script cannot answer a CORS preflight, so the body is sent as text/plain (a "simple request"). */
    function post(payload, opts) {
      opts = opts || {};
      var u = url(); if (!u) return Promise.resolve({ ok: false, code: 'nourl', error: 'This copy is not connected to the class server.' });
      var ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(function () { ctl.abort(); }, opts.timeout || 30000) : null;
      return fetch(u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ module: MODULE }, payload)), signal: ctl ? ctl.signal : undefined, keepalive: !!opts.keepalive, redirect: 'follow' })
        .then(function (r) { return r.text(); })
        .then(function (txt) { if (t) clearTimeout(t); try { return JSON.parse(txt); } catch (e) { return { ok: false, code: 'badjson', error: 'The server sent an unexpected reply. Check the server URL and that Code.gs + Cvs.gs are deployed.' }; } })
        .catch(function () { if (t) clearTimeout(t); return { ok: false, code: 'network', error: 'Connection lost — the class server could not be reached. Check your internet connection and try again.' }; });
    }
    function stu() { var s = lget(K_STU, SS) || lget(K_STU); try { return s ? JSON.parse(s) : null; } catch (e) { return null; } }
    function saveStu(s) { ldel(K_STU); lset(K_STU, JSON.stringify(s), s.remember ? LS : SS); }
    function tok() { return lget(K_T, SS); }
    var root = null;
    function screen(html) {
      if (!root) { root = document.createElement('div'); root.id = 'cvs-boot'; document.body.appendChild(root); }
      root.innerHTML = '<div class="boot-card"><div class="boot-brand"><svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0e7c7b"/><path d="M20 31s-10-6.4-10-13a5.6 5.6 0 0 1 10-3.4A5.6 5.6 0 0 1 30 18c0 6.6-10 13-10 13z" fill="#fff"/></svg><div><div class="boot-t">' + esc(conf.title || 'Cardiovascular Pathology — Exam Review') + '</div><div class="boot-s">' + esc(conf.subtitle || '') + '</div></div></div>' + html + '</div>';
      return root;
    }
    function msg() { var m = lget(K_MSG, SS); if (m) { try { SS.removeItem(K_MSG); } catch (e) { } } return m ? '<p class="boot-note">' + esc(m) + '</p>' : ''; }
    function showLoading(t) { screen('<p class="boot-muted">⏳ ' + esc(t || 'Connecting to the class server…') + '</p>'); }
    function showFatal(t, retry) { var r = screen('<p class="boot-err">' + esc(t) + '</p><button class="bbtn primary" type="button">Try again</button> <button class="bbtn link cfg" type="button">Server settings</button>'); r.querySelector('.primary').onclick = retry || boot; r.querySelector('.cfg').onclick = showUrl; }
    function showUrl() {
      var r = screen('<h1>Class server</h1><p class="boot-muted">Paste the web-app address of the platform backend (it ends in <code>/exec</code>). Your teacher gives you this link; normally it is built into the file.</p><label>Server URL<input id="b-u" value="' + esc(url()) + '" placeholder="https://script.google.com/macros/s/…/exec"></label><button class="bbtn primary" type="button">Save</button>');
      r.querySelector('button').onclick = function () { lset(K_URL, r.querySelector('#b-u').value.trim()); boot(); };
    }
    function showLogin(tab) {
      var r = screen(msg() + '<div class="boot-tabs" role="tablist"><button type="button" data-t="s" class="' + (tab !== 't' ? 'on' : '') + '">Student</button><button type="button" data-t="t" class="' + (tab === 't' ? 'on' : '') + '">Teacher</button></div>' +
        (tab !== 't'
          ? '<form class="bf" novalidate><h1>Sign in</h1><p class="boot-muted">Use your platform account: your <b>Student ID</b> and password (the same account system as the other pathology modules).</p><label>Student ID<input id="b-id" autocomplete="username" required></label><label>Password<input id="b-pw" type="password" autocomplete="current-password" required></label><label class="chk"><input type="checkbox" id="b-rm"> Remember me on this device (30 days)</label><p class="boot-err" id="b-e" role="alert"></p><button class="bbtn primary" type="submit">Sign in</button></form>'
          : '<form class="bf" novalidate><h1>Teacher sign-in</h1><p class="boot-muted">The CVS module’s teacher password on the shared backend.</p><label>Teacher password<input id="b-tp" type="password" autocomplete="current-password" required></label><p class="boot-err" id="b-e" role="alert"></p><button class="bbtn primary" type="submit">Sign in</button></form>') +
        '<p class="boot-foot">Connected edition — questions, timing, scoring and results are handled by the platform server. Forgotten your password? Ask your teacher to reset it. <button class="bbtn link cfg" type="button">Server settings</button></p>');
      [].forEach.call(r.querySelectorAll('.boot-tabs button'), function (b) { b.onclick = function () { showLogin(b.dataset.t); }; });
      r.querySelector('.cfg').onclick = showUrl;
      var f = r.querySelector('form'), e = r.querySelector('#b-e'), btn = f.querySelector('button[type=submit]');
      setTimeout(function () { var i = f.querySelector('input'); if (i) i.focus(); }, 0);
      f.onsubmit = function (ev) {
        ev.preventDefault(); e.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
        if (tab !== 't') {
          var id = f.querySelector('#b-id').value.trim(), pw = f.querySelector('#b-pw').value, rm = f.querySelector('#b-rm').checked;
          if (!id || !pw) { e.textContent = 'Enter your Student ID and password.'; btn.disabled = false; btn.textContent = 'Sign in'; return; }
          post({ action: 'studentLogin', username: id, password: pw, remember: rm }).then(function (x) {
            btn.disabled = false; btn.textContent = 'Sign in';
            if (!x.ok) { e.textContent = x.error || 'Sign-in failed.'; return; }
            var s = { token: x.token, remember: rm, student: x.student }; saveStu(s);
            if (x.mustChange) return showChange(s, true);
            start('student', x.student, x.contentKey);
          });
        } else {
          post({ action: 'login', password: f.querySelector('#b-tp').value }).then(function (x) {
            btn.disabled = false; btn.textContent = 'Sign in';
            if (!x.ok && x.code === 'needsSetup') return showSetup();
            if (!x.ok) { e.textContent = x.error || 'Sign-in failed.'; return; }
            lset(K_T, x.token, SS); start('teacher', { username: 'teacher', name: 'Teacher' }, x.contentKey);
          });
        }
      };
    }
    function showSetup() {
      var r = screen('<form class="bf"><h1>Create the CVS teacher password</h1><p class="boot-muted">This module has no teacher password yet on the backend. Choose one (at least 8 characters).</p><label>New password<input id="b-n" type="password" autocomplete="new-password"></label><p class="boot-err" id="b-e"></p><button class="bbtn primary" type="submit">Create</button></form>');
      r.querySelector('form').onsubmit = function (ev) { ev.preventDefault(); post({ action: 'setup', password: r.querySelector('#b-n').value }).then(function (x) { if (x.ok) showLogin('t'); else r.querySelector('#b-e').textContent = x.error; }); };
    }
    function showChange(s, forced, onDone) {
      var r = screen('<form class="bf"><h1>' + (forced ? 'Choose your own password' : 'Change password') + '</h1>' + (forced ? '<p class="boot-muted">You signed in with a temporary password. Choose a new one (at least 8 characters, not your Student ID).</p>' : '') +
        '<label>Current password<input id="b-o" type="password" autocomplete="current-password"></label><label>New password<input id="b-n" type="password" autocomplete="new-password"></label><label>Repeat new password<input id="b-n2" type="password" autocomplete="new-password"></label><p class="boot-err" id="b-e"></p><button class="bbtn primary" type="submit">Save password</button>' + (forced ? '' : ' <button class="bbtn link cx" type="button">Cancel</button>') + '</form>');
      if (!forced) { r.classList.add('over'); r.querySelector('.cx').onclick = function () { r.remove(); root = null; }; }
      r.querySelector('form').onsubmit = function (ev) {
        ev.preventDefault(); var n = r.querySelector('#b-n').value, e = r.querySelector('#b-e');
        if (n !== r.querySelector('#b-n2').value) { e.textContent = 'The new passwords do not match.'; return; }
        post({ action: 'studentChangePassword', stoken: s.token, oldPassword: r.querySelector('#b-o').value, newPassword: n }).then(function (x) {
          if (!x.ok) { e.textContent = x.error; return; }
          if (forced) start('student', s.student, x.contentKey); else { r.remove(); root = null; alert('Your password has been changed. Other devices have been signed out.'); }
        });
      };
    }
    function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
    function decrypt(keyB64) {
      var buf = b64(enc.textContent.trim());
      return crypto.subtle.importKey('raw', b64(keyB64), 'AES-GCM', false, ['decrypt'])
        .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, k, buf.slice(12)); })
        .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
    }
    function lock(m) {
      if (lock.busy) return; lock.busy = true;
      ldel(K_STU); ldel(K_T); if (m) lset(K_MSG, m, SS);
      location.hash = ''; location.reload();
    }
    function start(role, user, key) {
      if (!key) return showFatal('The server did not release the course content key. Check that Cvs.gs is installed and that the “cvs” entry was added to CONTENT_KEYS in Code.gs (see DEPLOY.md).');
      showLoading('Opening the course…');
      decrypt(key).then(function (D) {
        var CX = {
          role: role, user: user, module: MODULE,
          api: function (action, payload, opts) {
            var a = role === 'student' ? { stoken: (stu() || {}).token } : { token: tok() };
            return post(Object.assign({ action: action }, a, payload), opts).then(function (r) {
              if (r && (r.code === 'studentauth' || r.code === 'mustchange' || (role === 'teacher' && r.code === 'auth'))) lock(r.error);
              return r;
            });
          },
          logout: function () {
            var p = role === 'student' ? post({ action: 'studentLogout', stoken: (stu() || {}).token }, { timeout: 8000 }) : post({ action: 'logout', token: tok() }, { timeout: 8000 });
            p.then(function () { lock('You have signed out.'); });
          },
          changePassword: function () { var s = stu(); if (s) showChange(s, false); }
        };
        if (root) { root.remove(); root = null; }
        window.CVS_MAIN(D, CX);
      }).catch(function () { showFatal('The course content could not be opened with the key from the server. Make sure this file and the server belong to the same release.'); });
    }
    function boot() {
      if (!window.crypto || !crypto.subtle || !window.fetch) return showFatal('Please open this platform in an up-to-date browser (Chrome, Edge, Firefox or Safari) over https.');
      if (!url()) return showUrl();
      showLoading();
      var s = stu();
      if (s) {
        return post({ action: 'studentSession', stoken: s.token }).then(function (r) {
          if (r && r.ok && r.role === 'student') { s.student = r.student; if (r.mustChange) return showChange(s, true); return start('student', r.student, r.contentKey); }
          if (r && (r.code === 'network' || r.code === 'badjson')) return showFatal(r.error, boot);
          ldel(K_STU); showLogin('s');
        });
      }
      var t = tok();
      if (t) {
        return post({ action: 'studentSession', token: t }).then(function (r) {
          if (r && r.ok && r.role === 'teacher') return start('teacher', { username: 'teacher', name: 'Teacher' }, r.contentKey);
          if (r && (r.code === 'network' || r.code === 'badjson')) return showFatal(r.error, boot);
          ldel(K_T); showLogin('t');
        });
      }
      showLogin('s');
    }
    boot();
  }
})();
</script>
